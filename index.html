<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <meta
    name="theme-color"
    content="#333333">

  <link
    rel="manifest"
    href="manifest.json">

  <title>Control de Pesajes</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f2f2f2;
    }

    .contenedor {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    .tarjeta {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      margin-top: 8px;
      font-size: 18px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      cursor: pointer;
      font-weight: bold;
      margin-top: 15px;
    }

    #trabajador {
      margin-top: 10px;
      padding: 15px;
      background: #eee;
      border-radius: 8px;
      font-size: 18px;
    }

    #lectorQR {
      margin-top: 15px;
      text-align: center;
    }

    #lectorQR video {
      width: 100%;
      max-width: 400px;
      border-radius: 10px;
    }

    #cerrarQR {
      display: none;
    }

    #estado {
      text-align: center;
      margin-top: 20px;
      font-weight: bold;
    }

    #pendientes {
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
    }

    #registros {
      margin-top: 20px;
    }

    .registro {
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      margin-top: 8px;
    }

    .sin-registros {
      text-align: center;
      color: #777;
    }

  </style>

</head>


<body>

<div class="contenedor">

  <h1>CONTROL DE PESAJES</h1>

  <div class="tarjeta">

    <label>
      Código del trabajador
    </label>

    <input
      id="codigo"
      type="text"
      placeholder="Ej: Trab001"
      autocomplete="off">


    <button
      type="button"
      onclick="abrirEscaner()">

      📷 ESCANEAR QR

    </button>


    <div id="lectorQR"></div>


    <button
      id="cerrarQR"
      type="button"
      onclick="cerrarEscaner()">

      ✖ CERRAR CÁMARA

    </button>


    <div id="trabajador">
      Trabajador no seleccionado
    </div>


    <label>
      Kilos
    </label>

    <input
      id="kilos"
      type="number"
      step="0.1"
      placeholder="Ej: 84.5">


    <button
      type="button"
      onclick="guardarPesaje()">

      GUARDAR PESAJE

    </button>


    <div id="estado"></div>


    <div id="pendientes">
      Pendientes: 0
    </div>


    <div id="registros">

      <h3>
        Registros guardados
      </h3>

      <div id="listaRegistros">
        <div class="sin-registros">
          No hay registros todavía
        </div>
      </div>

    </div>

  </div>

</div>


<script>


// ==================================================
// URL DE GOOGLE APPS SCRIPT
// ==================================================

const URL_APPS_SCRIPT =
  "https://script.google.com/macros/s/AKfycbzs9dBMJotH8zBQNYeeOIdejzlTbPBRkw0IErt0Td9eiHmvy497j7Mu2XZJRzc2J_YWkQ/exec";


// ==================================================
// TRABAJADORES
// ==================================================

let trabajadores = [];


// ==================================================
// QR
// ==================================================

let streamQR = null;

let intervaloQR = null;

let qrProcesado = false;


// ==================================================
// BASE DE DATOS LOCAL
// ==================================================

const DB_NAME =
  "ControlPesajesDB";

const DB_VERSION =
  1;

const STORE_NAME =
  "pesajes";


// ==================================================
// JSONP
// ==================================================

function jsonp(url) {

  return new Promise(function(resolve, reject) {

    const callbackName =
      "callback_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .substring(2);


    const script =
      document.createElement("script");


    let terminado = false;


    const tiempo =
      setTimeout(function() {

        if (terminado) {
          return;
        }

        terminado = true;

        limpiar();

        reject(
          new Error(
            "Tiempo de espera agotado"
          )
        );

      }, 10000);


    function limpiar() {

      clearTimeout(tiempo);

      if (script.parentNode) {

        script.parentNode.removeChild(
          script
        );

      }

      try {

        delete window[
          callbackName
        ];

      } catch(error) {

        window[
          callbackName
        ] = undefined;

      }

    }


    window[callbackName] =
      function(datos) {

        if (terminado) {
          return;
        }

        terminado = true;

        limpiar();

        resolve(datos);

      };


    script.onerror =
      function() {

        if (terminado) {
          return;
        }

        terminado = true;

        limpiar();

        reject(
          new Error(
            "No se pudo conectar con Google"
          )
        );

      };


    script.src =
      url +
      "&callback=" +
      encodeURIComponent(
        callbackName
      );


    document.body.appendChild(
      script
    );

  });

}


// ==================================================
// ABRIR BASE DE DATOS
// ==================================================

function abrirBaseDatos() {

  return new Promise(function(resolve, reject) {

    const solicitud =
      indexedDB.open(
        DB_NAME,
        DB_VERSION
      );


    solicitud.onupgradeneeded =
      function(event) {

        const db =
          event.target.result;


        if (
          !db.objectStoreNames.contains(
            STORE_NAME
          )
        ) {

          db.createObjectStore(
            STORE_NAME,
            {
              keyPath: "id"
            }
          );

        }

      };


    solicitud.onsuccess =
      function(event) {

        resolve(
          event.target.result
        );

      };


    solicitud.onerror =
      function() {

        reject(
          solicitud.error
        );

      };

  });

}


// ==================================================
// GUARDAR LOCAL
// ==================================================

async function guardarLocal(registro) {

  const db =
    await abrirBaseDatos();


  return new Promise(function(resolve, reject) {

    const transaccion =
      db.transaction(
        STORE_NAME,
        "readwrite"
      );


    const almacen =
      transaccion.objectStore(
        STORE_NAME
      );


    almacen.put(
      registro
    );


    transaccion.oncomplete =
      function() {

        resolve();

      };


    transaccion.onerror =
      function() {

        reject(
          transaccion.error
        );

      };

  });

}


// ==================================================
// OBTENER TODOS LOS REGISTROS
// ==================================================

async function obtenerRegistros() {

  const db =
    await abrirBaseDatos();


  return new Promise(function(resolve, reject) {

    const transaccion =
      db.transaction(
        STORE_NAME,
        "readonly"
      );


    const almacen =
      transaccion.objectStore(
        STORE_NAME
      );


    const solicitud =
      almacen.getAll();


    solicitud.onsuccess =
      function() {

        resolve(
          solicitud.result
        );

      };


    solicitud.onerror =
      function() {

        reject(
          solicitud.error
        );

      };

  });

}


// ==================================================
// OBTENER PENDIENTES
// ==================================================

async function obtenerPendientes() {

  const registros =
    await obtenerRegistros();


  return registros.filter(
    function(registro) {

      return registro.sincronizado !== true;

    }
  );

}


// ==================================================
// MARCAR COMO SINCRONIZADO
// ==================================================

async function marcarSincronizado(id) {

  const db =
    await abrirBaseDatos();


  return new Promise(function(resolve, reject) {

    const transaccion =
      db.transaction(
        STORE_NAME,
        "readwrite"
      );


    const almacen =
      transaccion.objectStore(
        STORE_NAME
      );


    const solicitud =
      almacen.get(id);


    solicitud.onsuccess =
      function() {

        const registro =
          solicitud.result;


        if (!registro) {

          resolve();

          return;

        }


        registro.sincronizado =
          true;


        almacen.put(
          registro
        );

      };


    solicitud.onerror =
      function() {

        reject(
          solicitud.error
        );

      };


    transaccion.oncomplete =
      function() {

        resolve();

      };


    transaccion.onerror =
      function() {

        reject(
          transaccion.error
        );

      };

  });

}


// ==================================================
// CONTADOR
// ==================================================

async function actualizarPendientes() {

  try {

    const pendientes =
      await obtenerPendientes();


    document.getElementById(
      "pendientes"
    ).textContent =
      "Pendientes de sincronización: " +
      pendientes.length;


  } catch(error) {

    console.log(
      "Error contador:",
      error
    );

  }

}


// ==================================================
// MOSTRAR REGISTROS
// ==================================================

async function mostrarRegistros() {

  try {

    const registros =
      await obtenerRegistros();


    const lista =
      document.getElementById(
        "listaRegistros"
      );


    if (
      registros.length === 0
    ) {

      lista.innerHTML =
        '<div class="sin-registros">' +
        'No hay registros todavía' +
        '</div>';

      return;

    }


    registros.sort(
      function(a, b) {

        return new Date(b.fechaHora)
          -
          new Date(a.fechaHora);

      }
    );


    lista.innerHTML = "";


    registros.forEach(
      function(registro) {

        const trabajador =
          trabajadores.find(
            function(t) {

              return String(
                t.codigo
              ).toLowerCase()
              ===
              String(
                registro.codigo
              ).toLowerCase();

            }
          );


        const nombre =
          trabajador
            ? trabajador.nombre
            : registro.codigo;


        const fecha =
          new Date(
            registro.fechaHora
          );


        const fechaTexto =
          fecha.toLocaleDateString(
            "es-CL"
          );


        const horaTexto =
          fecha.toLocaleTimeString(
            "es-CL",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          );


        const estado =
          registro.sincronizado === true
            ? "✓ Sincronizado"
            : "⏳ Pendiente";


        const elemento =
          document.createElement(
            "div"
          );


        elemento.className =
          "registro";


        elemento.innerHTML =
          "<strong>" +
          nombre +
          "</strong><br>" +
          "Código: " +
          registro.codigo +
          "<br>" +
          "Peso: " +
          registro.kilos +
          " kg<br>" +
          fechaTexto +
          " " +
          horaTexto +
          "<br>" +
          estado;


        lista.appendChild(
          elemento
        );

      }
    );


  } catch(error) {

    console.log(
      "Error mostrando registros:",
      error
    );

  }

}


// ==================================================
// CARGAR TRABAJADORES
// ==================================================

async function cargarTrabajadores() {

  const estado =
    document.getElementById(
      "estado"
    );


  // ----------------------------------------------
  // SI HAY INTERNET
  // ----------------------------------------------

  if (navigator.onLine) {

    try {

      const lista =
        await jsonp(
          URL_APPS_SCRIPT +
          "?action=trabajadores"
        );


      if (
        !Array.isArray(lista)
      ) {

        throw new Error(
          "Respuesta incorrecta"
        );

      }


      trabajadores =
        lista;


      localStorage.setItem(
        "trabajadores",
        JSON.stringify(
          trabajadores
        )
      );


      estado.textContent =
        "✓ Trabajadores actualizados";


      await mostrarRegistros();


      return;


    } catch(error) {

      console.log(
        "No se pudo actualizar trabajadores:",
        error
      );

    }

  }


  // ----------------------------------------------
  // SIN INTERNET
  // ----------------------------------------------

  const guardados =
    localStorage.getItem(
      "trabajadores"
    );


  if (guardados) {

    try {

      trabajadores =
        JSON.parse(
          guardados
        );


      estado.textContent =
        "✓ Trabajadores disponibles sin Internet";


    } catch(error) {

      trabajadores = [];

    }

  } else {

    estado.textContent =
      "No hay trabajadores guardados en la tablet";

  }


  await mostrarRegistros();

}


// ==================================================
// BUSCAR TRABAJADOR
// ==================================================

document
  .getElementById(
    "codigo"
  )
  .addEventListener(
    "input",
    function() {

      buscarTrabajador(
        this.value
      );

    }
  );


function buscarTrabajador(codigo) {

  codigo =
    String(codigo)
      .trim();


  const trabajador =
    trabajadores.find(
      function(t) {

        return String(
          t.codigo
        )
        .trim()
        .toLowerCase()
        ===
        codigo.toLowerCase();

      }
    );


  const pantalla =
    document.getElementById(
      "trabajador"
    );


  if (trabajador) {

    pantalla.textContent =
      trabajador.nombre +
      " (" +
      trabajador.codigo +
      ")";


  } else if (codigo) {

    pantalla.textContent =
      "Trabajador no encontrado";


  } else {

    pantalla.textContent =
      "Trabajador no seleccionado";

  }

}


// ==================================================
// ABRIR ESCÁNER QR
// ==================================================

async function abrirEscaner() {

  const lector =
    document.getElementById(
      "lectorQR"
    );


  const botonCerrar =
    document.getElementById(
      "cerrarQR"
    );


  const estado =
    document.getElementById(
      "estado"
    );


  qrProcesado =
    false;


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    estado.textContent =
      "La cámara no está disponible.";

    return;

  }


  try {

    streamQR =
      await navigator.mediaDevices
        .getUserMedia({

          video: {
            facingMode: {
              ideal: "environment"
            }
          },

          audio: false

        });


    const video =
      document.createElement(
        "video"
      );


    video.setAttribute(
      "playsinline",
      "true"
    );


    video.autoplay =
      true;


    video.muted =
      true;


    video.srcObject =
      streamQR;


    lector.innerHTML =
      "";


    lector.appendChild(
      video
    );


    botonCerrar.style.display =
      "block";


    estado.textContent =
      "Apunta la cámara al QR del trabajador";


    await video.play();


    if (
      "BarcodeDetector"
      in window
    ) {

      const detector =
        new BarcodeDetector({

          formats: [
            "qr_code"
          ]

        });


      intervaloQR =
        setInterval(
          async function() {

            if (qrProcesado) {
              return;
            }


            try {

              const codigos =
                await detector.detect(
                  video
                );


              if (
                codigos.length > 0
              ) {

                const codigoQR =
                  codigos[0].rawValue;


                procesarQR(
                  codigoQR
                );

              }


            } catch(error) {

              console.log(
                "Error QR:",
                error
              );

            }

          },
          300
        );


    } else {

      estado.textContent =
        "Tu navegador no permite leer QR directamente.";

    }


  } catch(error) {

    console.log(
      "Error cámara:",
      error
    );


    estado.textContent =
      "No se pudo abrir la cámara. Revisa los permisos.";

  }

}


// ==================================================
// PROCESAR QR
// ==================================================

function procesarQR(valor) {

  if (qrProcesado) {
    return;
  }


  qrProcesado =
    true;


  valor =
    String(valor)
      .trim();


  document.getElementById(
    "codigo"
  ).value =
    valor;


  buscarTrabajador(
    valor
  );


  cerrarEscaner();


  const trabajador =
    trabajadores.find(
      function(t) {

        return String(
          t.codigo
        )
        .trim()
        .toLowerCase()
        ===
        valor.toLowerCase();

      }
    );


  if (trabajador) {

    document.getElementById(
      "estado"
    ).textContent =
      "✓ QR reconocido: " +
      trabajador.nombre;


  } else {

    document.getElementById(
      "estado"
    ).textContent =
      "QR leído, pero el trabajador no existe";

  }

}


// ==================================================
// CERRAR ESCÁNER
// ==================================================

function cerrarEscaner() {

  if (intervaloQR) {

    clearInterval(
      intervaloQR
    );

    intervaloQR =
      null;

  }


  if (streamQR) {

    streamQR
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    streamQR =
      null;

  }


  document.getElementById(
    "lectorQR"
  ).innerHTML =
    "";


  document.getElementById(
    "cerrarQR"
  ).style.display =
    "none";

}


// ==================================================
// GUARDAR PESAJE
// ==================================================

async function guardarPesaje() {

  const codigo =
    document.getElementById(
      "codigo"
    ).value.trim();


  const kilosTexto =
    document.getElementById(
      "kilos"
    ).value;


  const estado =
    document.getElementById(
      "estado"
    );


  // ----------------------------------------------
  // VALIDAR CÓDIGO
  // ----------------------------------------------

  if (!codigo) {

    estado.textContent =
      "Ingrese o escanee el código del trabajador";

    return;

  }


  // ----------------------------------------------
  // VALIDAR KILOS
  // ----------------------------------------------

  const kilos =
    Number(kilosTexto);


  if (
    !kilos ||
    kilos <= 0
  ) {

    estado.textContent =
      "Ingrese los kilos";

    return;

  }


  // ----------------------------------------------
  // BUSCAR TRABAJADOR
  // ----------------------------------------------

  const trabajador =
    trabajadores.find(
      function(t) {

        return String(
          t.codigo
        )
        .trim()
        .toLowerCase()
        ===
        codigo.toLowerCase();

      }
    );


  if (!trabajador) {

    estado.textContent =
      "Trabajador no encontrado";

    return;

  }


  // ----------------------------------------------
  // CREAR REGISTRO
  // ----------------------------------------------

  const registro = {

    id:
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2, 8),

    fechaHora:
      new Date().toISOString(),

    codigo:
      trabajador.codigo,

    kilos:
      kilos,

    sincronizado:
      false

  };


  // ----------------------------------------------
  // GUARDAR EN LA TABLET
  // ----------------------------------------------

  try {

    await guardarLocal(
      registro
    );


    estado.textContent =
      "✓ PESO GUARDADO EN LA TABLET";


    document.getElementById(
      "kilos"
    ).value =
      "";


    await actualizarPendientes();


    await mostrarRegistros();


    // --------------------------------------------
    // INTENTAR SINCRONIZAR
    // --------------------------------------------

    if (navigator.onLine) {

      sincronizar();

    }


  } catch(error) {

    console.error(
      error
    );


    estado.textContent =
      "❌ Error al guardar en la tablet";

  }

}


// ==================================================
// SINCRONIZAR UN REGISTRO
// ==================================================

async function sincronizarRegistro(registro) {

  const url =
    URL_APPS_SCRIPT +
    "?action=guardar" +
    "&id=" +
    encodeURIComponent(
      registro.id
    ) +
    "&fechaHora=" +
    encodeURIComponent(
      registro.fechaHora
    ) +
    "&codigo=" +
    encodeURIComponent(
      registro.codigo
    ) +
    "&kilos=" +
    encodeURIComponent(
      registro.kilos
    );


  const resultado =
    await jsonp(
      url
    );


  if (
    !resultado ||
    resultado.ok !== true
  ) {

    throw new Error(
      resultado &&
      resultado.error
        ? resultado.error
        : "No se pudo guardar"
    );

  }


  return true;

}


// ==================================================
// SINCRONIZAR
// ==================================================

async function sincronizar() {

  if (
    !navigator.onLine
  ) {

    return;

  }


  let pendientes;


  try {

    pendientes =
      await obtenerPendientes();

  } catch(error) {

    console.log(
      "Error obteniendo pendientes:",
      error
    );

    return;

  }


  if (
    pendientes.length === 0
  ) {

    await actualizarPendientes();

    return;

  }


  for (
    const registro
    of pendientes
  ) {

    try {

      await sincronizarRegistro(
        registro
      );


      await marcarSincronizado(
        registro.id
      );


      await actualizarPendientes();


      await mostrarRegistros();


    } catch(error) {

      console.log(
        "No se pudo sincronizar:",
        error
      );


      break;

    }

  }

}


// ==================================================
// CUANDO VUELVE INTERNET
// ==================================================

window.addEventListener(
  "online",
  function() {

    document.getElementById(
      "estado"
    ).textContent =
      "Internet disponible. Sincronizando...";


    cargarTrabajadores();


    sincronizar();

  }
);


// ==================================================
// CUANDO SE PIERDE INTERNET
// ==================================================

window.addEventListener(
  "offline",
  function() {

    document.getElementById(
      "estado"
    ).textContent =
      "Sin Internet. Los pesajes se guardarán en la tablet.";

  }
);


// ==================================================
// INICIO
// ==================================================

async function iniciar() {

  await cargarTrabajadores();

  await actualizarPendientes();

  await mostrarRegistros();


  if (navigator.onLine) {

    sincronizar();

  }

}


iniciar();


// ==================================================
// SERVICE WORKER
// ==================================================

if (
  "serviceWorker"
  in navigator
) {

  window.addEventListener(
    "load",
    function() {

      navigator.serviceWorker
        .register(
          "sw.js"
        )
        .then(
          function() {

            console.log(
              "Service Worker activo"
            );

          }
        )
        .catch(
          function(error) {

            console.log(
              "Error Service Worker:",
              error
            );

          }
        );

    }
  );

}

</script>

</body>

</html>
