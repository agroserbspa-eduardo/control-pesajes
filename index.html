<input

GUARDAR REGISTRO

REGISTROS DEL TRABAJADOR
</h2>

<script>


// ==================================================
// URL APPS SCRIPT
// ==================================================

const URL_APPS_SCRIPT =
  "https://script.google.com/macros/s/AKfycbzs9dBMJotH8zBQNYeeOIdejzlTbPBRkw0IErt0Td9eiHmvy497j7Mu2XZJRzc2J_YWkQ/exec";


// ==================================================
// TRABAJADORES
// ==================================================

let trabajadores = [];


// ==================================================
// LECTOR QR
// ==================================================

let streamQR = null;

let intervaloQR = null;


// ==================================================
// CAMBIAR TIPO DE REGISTRO
// ==================================================

function cambiarTipoRegistro() {

  const tipo =
    document.getElementById(
      "tipoRegistro"
    ).value;


  const contenedorPeso =
    document.getElementById(
      "contenedorPeso"
    );


  const contenedorJornada =
    document.getElementById(
      "contenedorJornada"
    );


  if (
    tipo === "peso"
  ) {

    contenedorPeso.style.display =
      "block";


    contenedorJornada.style.display =
      "none";


  } else {


    contenedorPeso.style.display =
      "none";


    contenedorJornada.style.display =
      "block";

  }

}


// ==================================================
// JSONP
// ==================================================

function jsonp(url) {

  return new Promise(
    function(resolve, reject) {


      const callbackName =
        "callback_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2);


      const script =
        document.createElement(
          "script"
        );


      let terminado =
        false;


      const tiempo =
        setTimeout(
          function() {

            if (
              terminado
            ) {
              return;
            }


            terminado =
              true;


            limpiar();


            reject(
              new Error(
                "Tiempo de espera agotado"
              )
            );

          },
          15000
        );


      function limpiar() {


        clearTimeout(
          tiempo
        );


        if (
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }


        try {

          delete window[
            callbackName
          ];

        } catch(error) {

          window[
            callbackName
          ] =
            undefined;

        }

      }


      window[
        callbackName
      ] =
      function(datos) {


        if (
          terminado
        ) {
          return;
        }


        terminado =
          true;


        limpiar();


        resolve(
          datos
        );

      };


      script.onerror =
      function() {


        if (
          terminado
        ) {
          return;
        }


        terminado =
          true;


        limpiar();


        reject(
          new Error(
            "No se pudo conectar"
          )
        );

      };


      const separador =
        url.includes("?")
          ? "&"
          : "?";


      script.src =
        url +
        separador +
        "callback=" +
        encodeURIComponent(
          callbackName
        );


      document.body.appendChild(
        script
      );

    }
  );

}


// ==================================================
// CARGAR TRABAJADORES
// ==================================================

async function cargarTrabajadores() {


  const estado =
    document.getElementById(
      "estado"
    );


  if (
    navigator.onLine
  ) {

    try {


      const lista =
        await jsonp(
          URL_APPS_SCRIPT +
          "?action=trabajadores"
        );


      if (
        !Array.isArray(
          lista
        )
      ) {

        throw new Error(
          "Respuesta incorrecta"
        );

      }


      trabajadores =
        lista;


      localStorage.setItem(
        "trabajadores",
        JSON.stringify(
          trabajadores
        )
      );


      estado.textContent =
        "✓ Trabajadores actualizados";


      return;


    } catch(error) {

      console.log(
        "Error al cargar trabajadores:",
        error
      );

    }

  }


  const guardados =
    localStorage.getItem(
      "trabajadores"
    );


  if (
    guardados
  ) {

    try {

      trabajadores =
        JSON.parse(
          guardados
        );


      estado.textContent =
        "✓ Trabajadores disponibles sin Internet";


    } catch(error) {

      console.error(
        error
      );

    }

  }

}


// ==================================================
// BUSCAR TRABAJADOR
// ==================================================

document
  .getElementById(
    "codigo"
  )
  .addEventListener(
    "input",
    function() {

      buscarTrabajador(
        this.value
      );

    }
  );


function buscarTrabajador(
  codigo
) {


  codigo =
    String(
      codigo
    )
    .trim();


  const pantalla =
    document.getElementById(
      "trabajador"
    );


  if (
    !codigo
  ) {

    pantalla.textContent =
      "Trabajador no seleccionado";


    mostrarRegistrosTrabajador(
      ""
    );


    return;

  }


  const trabajador =
    trabajadores.find(
      function(t) {

        return String(
          t.codigo
        )
        .trim()
        .toLowerCase()
        ===
        codigo
        .toLowerCase();

      }
    );


  if (
    trabajador
  ) {

    pantalla.textContent =
      trabajador.nombre +
      " (" +
      trabajador.codigo +
      ")";


    mostrarRegistrosTrabajador(
      trabajador.codigo
    );


  } else {

    pantalla.textContent =
      "Trabajador no encontrado";


    document.getElementById(
      "listaRegistros"
    ).textContent =
      "Seleccione un trabajador";


    document.getElementById(
      "totalTrabajador"
    ).textContent =
      "Total: 0 kg";

  }

}


// ==================================================
// ESCANEAR QR
// ==================================================

async function abrirEscaner() {


  const lector =
    document.getElementById(
      "lectorQR"
    );


  const botonCerrar =
    document.getElementById(
      "cerrarQR"
    );


  const estado =
    document.getElementById(
      "estado"
    );


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    estado.textContent =
      "La cámara no está disponible.";

    return;

  }


  try {


    streamQR =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal:
                "environment"
            }

          },

          audio:
            false

        });


    const video =
      document.createElement(
        "video"
      );


    video.setAttribute(
      "playsinline",
      true
    );


    video.autoplay =
      true;


    video.srcObject =
      streamQR;


    lector.innerHTML =
      "";


    lector.appendChild(
      video
    );


    botonCerrar.style.display =
      "block";


    estado.textContent =
      "Apunta la cámara al QR";


    await video.play();


    if (
      "BarcodeDetector"
      in window
    ) {


      const detector =
        new BarcodeDetector({

          formats: [
            "qr_code"
          ]

        });


      intervaloQR =
        setInterval(
          async function() {

            try {


              const codigos =
                await detector.detect(
                  video
                );


              if (
                codigos.length > 0
              ) {


                const codigoQR =
                  codigos[0]
                    .rawValue;


                procesarQR(
                  codigoQR
                );

              }


            } catch(error) {

              console.log(
                error
              );

            }

          },
          300
        );


    } else {

      estado.textContent =
        "Este navegador no admite lectura QR.";

    }


  } catch(error) {


    console.log(
      error
    );


    estado.textContent =
      "No se pudo abrir la cámara.";

  }

}


// ==================================================
// PROCESAR QR
// ==================================================

function procesarQR(
  valor
) {


  valor =
    String(
      valor
    )
    .trim();


  document.getElementById(
    "codigo"
  ).value =
    valor;


  buscarTrabajador(
    valor
  );


  cerrarEscaner();

}


// ==================================================
// CERRAR ESCÁNER
// ==================================================

function cerrarEscaner() {


  if (
    intervaloQR
  ) {

    clearInterval(
      intervaloQR
    );


    intervaloQR =
      null;

  }


  if (
    streamQR
  ) {


    streamQR
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    streamQR =
      null;

  }


  document.getElementById(
    "lectorQR"
  ).innerHTML =
    "";


  document.getElementById(
    "cerrarQR"
  ).style.display =
    "none";

}


// ==================================================
// BASE DE DATOS LOCAL
// ==================================================

const DB_NAME =
  "ControlPesajesDB";


const DB_VERSION =
  3;


const STORE_NAME =
  "pesajes";


// ==================================================
// ABRIR BASE DE DATOS
// ==================================================

function abrirBaseDatos() {


  return new Promise(
    function(resolve, reject) {


      let solicitud;


      try {

        solicitud =
          indexedDB.open(
            DB_NAME,
            DB_VERSION
          );


      } catch(error) {

        reject(
          error
        );

        return;

      }


      solicitud.onupgradeneeded =
        function(event) {


          const db =
            event.target.result;


          if (
            !db.objectStoreNames
              .contains(
                STORE_NAME
              )
          ) {


            db.createObjectStore(
              STORE_NAME,
              {
                keyPath:
                  "id"
              }
            );

          }

        };


      solicitud.onsuccess =
        function(event) {


          const db =
            event.target.result;


          db.onversionchange =
            function() {

              db.close();

            };


          resolve(
            db
          );

        };


      solicitud.onerror =
        function() {


          reject(
            solicitud.error ||
            new Error(
              "No se pudo abrir la base de datos"
            )
          );

        };


      solicitud.onblocked =
        function() {


          reject(
            new Error(
              "Base de datos bloqueada"
            )
          );

        };

    }
  );

}


// ==================================================
// GUARDAR LOCAL
// ==================================================

async function guardarLocal(
  registro
) {


  const db =
    await abrirBaseDatos();


  return new Promise(
    function(resolve, reject) {


      let transaccion;


      try {


        transaccion =
          db.transaction(
            STORE_NAME,
            "readwrite"
          );


        const almacen =
          transaccion.objectStore(
            STORE_NAME
          );


        almacen.put(
          registro
        );


      } catch(error) {


        db.close();


        reject(
          error
        );


        return;

      }


      transaccion.oncomplete =
        function() {


          db.close();


          resolve();

        };


      transaccion.onerror =
        function() {


          db.close();


          reject(
            transaccion.error ||
            new Error(
              "Error al guardar"
            )
          );

        };


      transaccion.onabort =
        function() {


          db.close();


          reject(
            new Error(
              "Transacción cancelada"
            )
          );

        };

    }
  );

}


// ==================================================
// OBTENER REGISTROS LOCALES
// ==================================================

async function obtenerPendientes() {


  const db =
    await abrirBaseDatos();


  return new Promise(
    function(resolve, reject) {


      try {


        const transaccion =
          db.transaction(
            STORE_NAME,
            "readonly"
          );


        const almacen =
          transaccion.objectStore(
            STORE_NAME
          );


        const solicitud =
          almacen.getAll();


        solicitud.onsuccess =
          function() {


            const resultado =
              solicitud.result ||
              [];


            db.close();


            resolve(
              resultado
            );

          };


        solicitud.onerror =
          function() {


            db.close();


            reject(
              solicitud.error
            );

          };


      } catch(error) {


        db.close();


        reject(
          error
        );

      }

    }
  );

}


// ==================================================
// ELIMINAR REGISTRO LOCAL
// ==================================================

async function eliminarLocal(
  id
) {


  const db =
    await abrirBaseDatos();


  return new Promise(
    function(resolve, reject) {


      try {


        const transaccion =
          db.transaction(
            STORE_NAME,
            "readwrite"
          );


        const almacen =
          transaccion.objectStore(
            STORE_NAME
          );


        almacen.delete(
          id
        );


        transaccion.oncomplete =
          function() {


            db.close();


            resolve();

          };


        transaccion.onerror =
          function() {


            db.close();


            reject(
              transaccion.error
            );

          };


      } catch(error) {


        db.close();


        reject(
          error
        );

      }

    }
  );

}


// ==================================================
// ACTUALIZAR PENDIENTES
// ==================================================

async function actualizarPendientes() {


  try {


    const pendientes =
      await obtenerPendientes();


    document.getElementById(
      "pendientes"
    ).textContent =
      "Pendientes de sincronización: " +
      pendientes.length;


  } catch(error) {


    console.error(
      error
    );


    document.getElementById(
      "pendientes"
    ).textContent =
      "Pendientes de sincronización: ?";

  }

}


// ==================================================
// MOSTRAR REGISTROS DEL TRABAJADOR
// ==================================================

async function mostrarRegistrosTrabajador(
  codigo
) {


  const lista =
    document.getElementById(
      "listaRegistros"
    );


  const totalPantalla =
    document.getElementById(
      "totalTrabajador"
    );


  if (
    !codigo
  ) {

    lista.textContent =
      "Seleccione un trabajador";


    totalPantalla.textContent =
      "Total: 0 kg";


    return;

  }


  try {


    const registros =
      await obtenerPendientes();


    const registrosTrabajador =
      registros.filter(
        function(registro) {

          return String(
            registro.codigo
          )
          .toLowerCase()
          ===
          String(
            codigo
          )
          .toLowerCase();

        }
      );


    lista.innerHTML =
      "";


    let total =
      0;


    if (
      registrosTrabajador.length === 0
    ) {

      lista.textContent =
        "No hay registros locales pendientes";

    }


    registrosTrabajador.forEach(
      function(registro) {


        const fila =
          document.createElement(
            "div"
          );


        fila.className =
          "registroPeso";


        const informacion =
          document.createElement(
            "div"
          );


        informacion.className =
          "infoPeso";


        // ==========================================
        // MOSTRAR PESO O JORNADA
        // ==========================================

        if (
          registro.tipo === "jornada"
        ) {

          informacion.textContent =
            "📅 " +
            registro.jornada;


        } else {


          const peso =
            Number(
              registro.kilos
            );


          total +=
            peso;


          informacion.textContent =
            peso +
            " kg";

        }


        const boton =
          document.createElement(
            "button"
          );


        boton.className =
          "botonEliminar";


        boton.textContent =
          "❌";


        boton.type =
          "button";


        boton.onclick =
          async function() {


            if (
              confirm(
                "¿Eliminar este registro?"
              )
            ) {


              try {


                await eliminarLocal(
                  registro.id
                );


                await actualizarPendientes();


                await mostrarRegistrosTrabajador(
                  codigo
                );


              } catch(error) {


                console.error(
                  error
                );


                alert(
                  "No se pudo eliminar el registro"
                );

              }

            }

          };


        fila.appendChild(
          informacion
        );


        fila.appendChild(
          boton
        );


        lista.appendChild(
          fila
        );

      }
    );


    totalPantalla.textContent =
      "Total: " +
      total +
      " kg";


  } catch(error) {


    console.error(
      error
    );


    lista.textContent =
      "No se pudieron cargar los registros";


    totalPantalla.textContent =
      "Total: 0 kg";

  }

}


// ==================================================
// GUARDAR REGISTRO
// ==================================================

async function guardarPesaje() {


  const codigo =
    document.getElementById(
      "codigo"
    )
    .value
    .trim();


  const tipo =
    document.getElementById(
      "tipoRegistro"
    )
    .value;


  const estado =
    document.getElementById(
      "estado"
    );


  if (
    !codigo
  ) {

    estado.textContent =
      "Ingrese el código";

    return;

  }


  // ================================================
  // BUSCAR TRABAJADOR
  // ================================================

  const trabajador =
    trabajadores.find(
      function(t) {

        return String(
          t.codigo
        )
        .trim()
        .toLowerCase()
        ===
        codigo
        .toLowerCase();

      }
    );


  if (
    !trabajador
  ) {

    estado.textContent =
      "Trabajador no encontrado";

    return;

  }


  // ================================================
  // CREAR REGISTRO
  // ================================================

  const registro = {

    id:
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(
          2,
          8
        ),

    fechaHora:
      new Date()
        .toISOString(),

    codigo:
      trabajador.codigo,

    tipo:
      tipo,

    kilos:
      "",

    jornada:
      ""

  };


  // ================================================
  // REGISTRO DE PESO
  // ================================================

  if (
    tipo === "peso"
  ) {


    const kilos =
      document.getElementById(
        "kilos"
      )
      .value
      .trim();


    if (
      kilos === ""
    ) {

      estado.textContent =
        "Ingrese los kilos";

      return;

    }


    const peso =
      Number(
        kilos
      );


    if (
      isNaN(
        peso
      ) ||
      peso <= 0
    ) {

      estado.textContent =
        "Ingrese un peso válido";

      return;

    }


    registro.kilos =
      peso;

  }


  // ================================================
  // REGISTRO DE JORNADA
  // ================================================

  if (
    tipo === "jornada"
  ) {


    const jornada =
      document.getElementById(
        "jornada"
      )
      .value;


    registro.jornada =
      jornada;

  }


  try {


    estado.textContent =
      "Guardando...";


    // ==============================================
    // GUARDAR PRIMERO EN LA TABLET
    // ==============================================

    await guardarLocal(
      registro
    );


    // ==============================================
    // ACTUALIZAR PANTALLA
    // ==============================================

    await actualizarPendientes();


    await mostrarRegistrosTrabajador(
      trabajador.codigo
    );


    estado.textContent =
      "✓ Registro guardado en la tablet";


    // Limpiar peso

    document.getElementById(
      "kilos"
    ).value =
      "";


    // ==============================================
    // SINCRONIZAR
    // ==============================================

    if (
      navigator.onLine
    ) {


      sincronizar()
        .catch(
          function(error) {

            console.log(
              "Error sincronización:",
              error
            );

          }
        );

    }


  } catch(error) {


    console.error(
      "ERROR AL GUARDAR:",
      error
    );


    estado.textContent =
      "Error al guardar en la tablet";


    alert(
      "Error al guardar:\n\n" +
      (
        error.message ||
        error.name ||
        "Error desconocido"
      )
    );

  }

}


// ==================================================
// SINCRONIZAR UN REGISTRO
// ==================================================

async function sincronizarRegistro(
  registro
) {


  const url =
    URL_APPS_SCRIPT +

    "?action=guardar" +

    "&id=" +
    encodeURIComponent(
      registro.id
    ) +

    "&fechaHora=" +
    encodeURIComponent(
      registro.fechaHora
    ) +

    "&codigo=" +
    encodeURIComponent(
      registro.codigo
    ) +

    "&tipo=" +
    encodeURIComponent(
      registro.tipo
    ) +

    "&kilos=" +
    encodeURIComponent(
      registro.kilos
    ) +

    "&jornada=" +
    encodeURIComponent(
      registro.jornada
    );


  const resultado =
    await jsonp(
      url
    );


  if (
    !resultado ||
    !resultado.ok
  ) {

    throw new Error(

      resultado &&
      resultado.error

        ?

        resultado.error

        :

        "No se pudo sincronizar"

    );

  }


  return true;

}


// ==================================================
// SINCRONIZAR TODOS
// ==================================================

async function sincronizar() {


  if (
    !navigator.onLine
  ) {

    return;

  }


  const pendientes =
    await obtenerPendientes();


  for (
    const registro
    of pendientes
  ) {


    try {


      await sincronizarRegistro(
        registro
      );


      await eliminarLocal(
        registro.id
      );


    } catch(error) {


      console.log(
        "Pendiente sin sincronizar:",
        error
      );


      break;

    }

  }


  await actualizarPendientes();


  const codigo =
    document.getElementById(
      "codigo"
    )
    .value
    .trim();


  if (
    codigo
  ) {

    await mostrarRegistrosTrabajador(
      codigo
    );

  }

}


// ==================================================
// CUANDO VUELVE INTERNET
// ==================================================

window.addEventListener(
  "online",
  async function() {


    document.getElementById(
      "estado"
    ).textContent =
      "Internet disponible. Sincronizando...";


    try {


      await cargarTrabajadores();


      await sincronizar();


      document.getElementById(
        "estado"
      ).textContent =
        "✓ Sincronización completada";


    } catch(error) {

      console.error(
        error
      );

    }

  }
);


// ==================================================
// CUANDO SE QUEDA SIN INTERNET
// ==================================================

window.addEventListener(
  "offline",
  function() {


    document.getElementById(
      "estado"
    ).textContent =
      "Sin Internet. Guardando en la tablet.";

  }
);


// ==================================================
// INICIO
// ==================================================

async function iniciarAplicacion() {


  try {

    await cargarTrabajadores();

  } catch(error) {

    console.error(
      error
    );

  }


  try {

    await actualizarPendientes();

  } catch(error) {

    console.error(
      error
    );

  }


  if (
    navigator.onLine
  ) {


    try {

      await sincronizar();

    } catch(error) {

      console.log(
        error
      );

    }

  }

}


iniciarAplicacion();


// ==================================================
// SERVICE WORKER
// ==================================================

if (
  "serviceWorker"
  in navigator
) {


  window.addEventListener(
    "load",
    function() {


      navigator.serviceWorker
        .register(
          "sw.js"
        )
        .then(
          function() {

            console.log(
              "Service Worker registrado"
            );

          }
        )
        .catch(
          function(error) {

            console.log(
              "Error Service Worker:",
              error
            );

          }
        );

    }
  );

}
