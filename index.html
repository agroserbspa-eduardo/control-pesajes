<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <meta
    name="theme-color"
    content="#333333">

  <link
    rel="manifest"
    href="manifest.json">

  <style>

    body {

      background: #f2f2f2;
    }

    .contenedor {

<body>

<div class="contenedor">

  <h1>CONTROL DE PESAJES</h1>


  <div class="tarjeta">


    <!-- ========================================
         TRABAJADOR
    ========================================= -->

    <label>
      Código del trabajador
    </label>


    <input
      id="codigo"
      type="text"
      placeholder="Ej: Trab001"
      autocomplete="off">


    <button
      type="button"
      onclick="abrirEscaner()">

      📷 ESCANEAR QR

    </button>


    <div id="lectorQR"></div>


    <button
      id="cerrarQR"
      type="button"
      onclick="cerrarEscaner()">

      ✖ CERRAR CÁMARA

    </button>


    <div id="trabajador">

      Trabajador no seleccionado

    </div>


    <!-- ========================================
         BOTÓN CONSULTAR
    ========================================= -->

    <button
      type="button"
      onclick="mostrarPesajes()">

      📊 VER MIS PESAJES

    </button>


    <!-- ========================================
         KILOS
    ========================================= -->

    <label>
      Kilos
    </label>


    <input
      id="kilos"
      type="number"
      step="0.1"
      placeholder="Ej: 84.5">


    <button
      type="button"
      onclick="guardarPesaje()">

      ⚖️ GUARDAR PESAJE

    </button>


    <div id="estado"></div>


    <div id="pendientes">

      Pendientes: 0

    </div>


    <!-- ========================================
         CONSULTA DE PESAJES
    ========================================= -->

    <div id="consulta">

      <h2>
        📊 Pesajes de hoy
      </h2>


      <div id="nombreConsulta"></div>


      <div id="listaPesajes"></div>


      <div id="totalDia">
        TOTAL: 0 kg
      </div>

    </div>


  </div>

</div>


<script>


// ==================================================
// URL DE GOOGLE APPS SCRIPT
// ==================================================

const URL_APPS_SCRIPT =
  "https://script.google.com/macros/s/AKfycbzs9dBMJotH8zBQNYeeOIdejzlTbPBRkw0IErt0Td9eiHmvy497j7Mu2XZJRzc2J_YWkQ/exec";


// ==================================================
// TRABAJADORES
// ==================================================

let trabajadores = [];


// ==================================================
// QR
// ==================================================

let streamQR = null;

let intervaloQR = null;


// ==================================================
// JSONP
// ==================================================

function jsonp(url) {

  return new Promise(function(resolve, reject) {

    const callbackName =
      "callback_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .substring(2, 8);


    const script =
      document.createElement("script");


    const tiempo =
      setTimeout(function() {

        limpiar();

        reject(
          new Error(
            "Tiempo de espera agotado"
          )
        );

      }, 10000);


    function limpiar() {

      clearTimeout(tiempo);


      if (script.parentNode) {

        script.parentNode.removeChild(
          script
        );

      }


      try {

        delete window[callbackName];

      } catch(error) {

        window[callbackName] =
          undefined;

      }

    }


    window[callbackName] =
      function(datos) {

        limpiar();

        resolve(datos);

      };


    script.onerror =
      function() {

        limpiar();

        reject(
          new Error(
            "No se pudo conectar con Apps Script"
          )
        );

      };


    script.src =
      url +
      "&callback=" +
      encodeURIComponent(
        callbackName
      );


    document.body.appendChild(
      script
    );

  });

}


// ==================================================
// CARGAR TRABAJADORES
// ==================================================

async function cargarTrabajadores() {

  const estado =
    document.getElementById(
      "estado"
    );


  if (navigator.onLine) {

    try {

      const lista =
        await jsonp(
          URL_APPS_SCRIPT +
          "?action=trabajadores"
        );


      if (!Array.isArray(lista)) {

        throw new Error(
          "Respuesta incorrecta"
        );

      }


      trabajadores =
        lista;


      localStorage.setItem(
        "trabajadores",
        JSON.stringify(
          trabajadores
        )
      );


      estado.textContent =
        "✓ Trabajadores actualizados";


      return;

    } catch(error) {

      console.log(
        "Error cargando trabajadores:",
        error
      );

    }

  }


  // ================================================
  // SIN INTERNET
  // ================================================

  const guardados =
    localStorage.getItem(
      "trabajadores"
    );


  if (guardados) {

    try {

      trabajadores =
        JSON.parse(
          guardados
        );


      estado.textContent =
        "✓ Trabajadores disponibles sin Internet";


    } catch(error) {

      trabajadores = [];

      estado.textContent =
        "Error leyendo trabajadores guardados";

    }

  } else {

    trabajadores = [];

    estado.textContent =
      "No hay trabajadores guardados";

  }

}


// ==================================================
// BUSCAR TRABAJADOR
// ==================================================

document
  .getElementById("codigo")
  .addEventListener(
    "input",
    function() {

      buscarTrabajador(
        this.value
      );

    }
  );


function buscarTrabajador(codigo) {

  codigo =
    String(codigo).trim();


  const trabajador =
    trabajadores.find(
      function(t) {

        return String(
          t.codigo
        )
        .toLowerCase()
        ===
        codigo.toLowerCase();

      }
    );


  const pantalla =
    document.getElementById(
      "trabajador"
    );


  if (trabajador) {

    pantalla.textContent =
      trabajador.nombre +
      " (" +
      trabajador.codigo +
      ")";


  } else if (codigo) {

    pantalla.textContent =
      "Trabajador no encontrado";


  } else {

    pantalla.textContent =
      "Trabajador no seleccionado";

  }

}


// ==================================================
// ABRIR ESCÁNER QR
// ==================================================

async function abrirEscaner() {

  const lector =
    document.getElementById(
      "lectorQR"
    );


  const botonCerrar =
    document.getElementById(
      "cerrarQR"
    );


  const estado =
    document.getElementById(
      "estado"
    );


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    estado.textContent =
      "La cámara no está disponible.";

    return;

  }


  try {

    streamQR =
      await navigator.mediaDevices
        .getUserMedia({

          video: {
            facingMode: {
              ideal: "environment"
            }
          },

          audio: false

        });


    const video =
      document.createElement(
        "video"
      );


    video.setAttribute(
      "playsinline",
      true
    );


    video.autoplay =
      true;


    video.srcObject =
      streamQR;


    lector.innerHTML =
      "";


    lector.appendChild(
      video
    );


    botonCerrar.style.display =
      "block";


    estado.textContent =
      "Apunta la cámara al QR del trabajador";


    await video.play();


    if (
      "BarcodeDetector" in window
    ) {

      const detector =
        new BarcodeDetector({
          formats: [
            "qr_code"
          ]
        });


      intervaloQR =
        setInterval(
          async function() {

            try {

              const codigos =
                await detector.detect(
                  video
                );


              if (
                codigos.length > 0
              ) {

                procesarQR(
                  codigos[0].rawValue
                );

              }

            } catch(error) {

              console.log(
                "Error leyendo QR:",
                error
              );

            }

          },
          300
        );


    } else {

      estado.textContent =
        "Este navegador no admite lectura QR directa.";

    }


  } catch(error) {

    console.log(
      error
    );


    estado.textContent =
      "No se pudo abrir la cámara. Revisa los permisos.";

  }

}


// ==================================================
// PROCESAR QR
// ==================================================

function procesarQR(valor) {

  valor =
    String(valor).trim();


  document.getElementById(
    "codigo"
  ).value =
    valor;


  buscarTrabajador(
    valor
  );


  cerrarEscaner();


  const trabajador =
    trabajadores.find(
      function(t) {

        return String(
          t.codigo
        )
        .toLowerCase()
        ===
        valor.toLowerCase();

      }
    );


  if (trabajador) {

    document.getElementById(
      "estado"
    ).textContent =
      "✓ QR reconocido: " +
      trabajador.nombre;


  } else {

    document.getElementById(
      "estado"
    ).textContent =
      "QR leído, pero el trabajador no existe";

  }

}


// ==================================================
// CERRAR ESCÁNER
// ==================================================

function cerrarEscaner() {

  if (intervaloQR) {

    clearInterval(
      intervaloQR
    );

    intervaloQR =
      null;

  }


  if (streamQR) {

    streamQR
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    streamQR =
      null;

  }


  document.getElementById(
    "lectorQR"
  ).innerHTML =
    "";


  document.getElementById(
    "cerrarQR"
  ).style.display =
    "none";

}


// ==================================================
// BASE DE DATOS LOCAL
// ==================================================

const DB_NAME =
  "ControlPesajesDB";


const DB_VERSION =
  2;


const STORE_NAME =
  "pesajes";


// ==================================================
// ABRIR BASE DE DATOS
// ==================================================

function abrirBaseDatos() {

  return new Promise(
    function(resolve, reject) {

      const solicitud =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );


      solicitud.onupgradeneeded =
        function(event) {

          const db =
            event.target.result;


          if (
            !db.objectStoreNames.contains(
              STORE_NAME
            )
          ) {

            db.createObjectStore(
              STORE_NAME,
              {
                keyPath: "id"
              }
            );

          }

        };


      solicitud.onsuccess =
        function(event) {

          resolve(
            event.target.result
          );

        };


      solicitud.onerror =
        function() {

          reject(
            solicitud.error
          );

        };

    }
  );

}


// ==================================================
// GUARDAR LOCAL
// ==================================================

async function guardarLocal(registro) {

  const db =
    await abrirBaseDatos();


  return new Promise(
    function(resolve, reject) {

      const transaccion =
        db.transaction(
          STORE_NAME,
          "readwrite"
        );


      const almacen =
        transaccion.objectStore(
          STORE_NAME
        );


      const solicitud =
        almacen.put(
          registro
        );


      solicitud.onerror =
        function() {

          reject(
            solicitud.error
          );

        };


      transaccion.oncomplete =
        function() {

          resolve();

        };


      transaccion.onerror =
        function() {

          reject(
            transaccion.error
          );

        };

    }
  );

}


// ==================================================
// OBTENER TODOS LOS PESAJES
// ==================================================

async function obtenerPendientes() {

  const db =
    await abrirBaseDatos();


  return new Promise(
    function(resolve, reject) {

      const transaccion =
        db.transaction(
          STORE_NAME,
          "readonly"
        );


      const almacen =
        transaccion.objectStore(
          STORE_NAME
        );


      const solicitud =
        almacen.getAll();


      solicitud.onsuccess =
        function() {

          resolve(
            solicitud.result
          );

        };


      solicitud.onerror =
        function() {

          reject(
            solicitud.error
          );

        };

    }
  );

}


// ==================================================
// ELIMINAR LOCAL
// ==================================================

async function eliminarLocal(id) {

  const db =
    await abrirBaseDatos();


  return new Promise(
    function(resolve, reject) {

      const transaccion =
        db.transaction(
          STORE_NAME,
          "readwrite"
        );


      const almacen =
        transaccion.objectStore(
          STORE_NAME
        );


      almacen.delete(
        id
      );


      transaccion.oncomplete =
        function() {

          resolve();

        };


      transaccion.onerror =
        function() {

          reject(
            transaccion.error
          );

        };

    }
  );

}


// ==================================================
// CONTADOR
// ==================================================

async function actualizarPendientes() {

  try {

    const pendientes =
      await obtenerPendientes();


    document.getElementById(
      "pendientes"
    ).textContent =
      "Pendientes: " +
      pendientes.length;


  } catch(error) {

    console.log(
      error
    );

  }

}


// ==================================================
// GUARDAR PESAJE
// ==================================================

async function guardarPesaje() {

  const codigo =
    document.getElementById(
      "codigo"
    ).value.trim();


  const kilos =
    document.getElementById(
      "kilos"
    ).value;


  const estado =
    document.getElementById(
      "estado"
    );


  if (!codigo) {

    estado.textContent =
      "Ingrese el código";

    return;

  }


  if (
    !kilos ||
    Number(kilos) <= 0
  ) {

    estado.textContent =
      "Ingrese los kilos";

    return;

  }


  const trabajador =
    trabajadores.find(
      function(t) {

        return String(
          t.codigo
        )
        .toLowerCase()
        ===
        codigo.toLowerCase();

      }
    );


  if (!trabajador) {

    estado.textContent =
      "Trabajador no encontrado";

    return;

  }


  const registro = {

    id:
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2, 8),

    fechaHora:
      new Date().toISOString(),

    codigo:
      trabajador.codigo,

    nombre:
      trabajador.nombre,

    kilos:
      Number(kilos)

  };


  try {

    estado.textContent =
      "Guardando en la tablet...";


    await guardarLocal(
      registro
    );


    await actualizarPendientes();


    estado.textContent =
      "✓ Pesaje guardado en la tablet";


    document.getElementById(
      "kilos"
    ).value =
      "";


    if (navigator.onLine) {

      sincronizar();

    }


    // Actualizar consulta automáticamente
    const consulta =
      document.getElementById(
        "consulta"
      );


    if (
      consulta.style.display === "block"
    ) {

      mostrarPesajes();

    }


  } catch(error) {

    console.error(
      "ERROR:",
      error
    );


    estado.textContent =
      "❌ Error al guardar en la tablet";

  }

}


// ==================================================
// CONSULTAR PESAJE DEL TRABAJADOR
// ==================================================

async function mostrarPesajes() {

  const codigo =
    document.getElementById(
      "codigo"
    ).value.trim();


  const trabajador =
    trabajadores.find(
      function(t) {

        return String(
          t.codigo
        )
        .toLowerCase()
        ===
        codigo.toLowerCase();

      }
    );


  const consulta =
    document.getElementById(
      "consulta"
    );


  const lista =
    document.getElementById(
      "listaPesajes"
    );


  const totalElemento =
    document.getElementById(
      "totalDia"
    );


  const nombreConsulta =
    document.getElementById(
      "nombreConsulta"
    );


  if (!trabajador) {

    consulta.style.display =
      "block";


    nombreConsulta.textContent =
      "";


    lista.innerHTML =
      "<div id='sinPesajes'>Primero seleccione un trabajador.</div>";


    totalElemento.textContent =
      "TOTAL: 0 kg";


    return;

  }


  consulta.style.display =
    "block";


  nombreConsulta.textContent =
    trabajador.nombre +
    " (" +
    trabajador.codigo +
    ")";


  try {

    const registros =
      await obtenerPendientes();


    // ==============================================
    // FECHA DE HOY
    // ==============================================

    const hoy =
      new Date();


    const año =
      hoy.getFullYear();


    const mes =
      hoy.getMonth();


    const dia =
      hoy.getDate();


    // ==============================================
    // FILTRAR POR TRABAJADOR Y FECHA
    // ==============================================

    const pesajesHoy =
      registros.filter(
        function(registro) {

          const fecha =
            new Date(
              registro.fechaHora
            );


          return (
            String(
              registro.codigo
            )
            .toLowerCase()
            ===
            String(
              trabajador.codigo
            )
            .toLowerCase()
            &&
            fecha.getFullYear() === año
            &&
            fecha.getMonth() === mes
            &&
            fecha.getDate() === dia
          );

        }
      );


    // ==============================================
    // ORDENAR POR HORA
    // ==============================================

    pesajesHoy.sort(
      function(a, b) {

        return new Date(
          a.fechaHora
        ) -
        new Date(
          b.fechaHora
        );

      }
    );


    lista.innerHTML =
      "";


    if (
      pesajesHoy.length === 0
    ) {

      lista.innerHTML =
        "<div id='sinPesajes'>" +
        "No hay pesajes registrados hoy." +
        "</div>";


      totalElemento.textContent =
        "TOTAL: 0 kg";


      return;

    }


    let total =
      0;


    pesajesHoy.forEach(
      function(registro) {

        const fecha =
          new Date(
            registro.fechaHora
          );


        const hora =
          fecha.toLocaleTimeString(
            "es-CL",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          );


        total +=
          Number(
            registro.kilos
          );


        const elemento =
          document.createElement(
            "div"
          );


        elemento.className =
          "pesaje";


        elemento.innerHTML =

          "<span class='hora'>" +
          hora +
          "</span>" +

          "<span class='kilosRegistro'>" +
          Number(
            registro.kilos
          ).toFixed(1) +
          " kg" +
          "</span>";


        lista.appendChild(
          elemento
        );

      }
    );


    totalElemento.textContent =
      "TOTAL: " +
      total.toFixed(1) +
      " kg";


  } catch(error) {

    console.error(
      "Error consultando pesajes:",
      error
    );


    lista.innerHTML =
      "<div id='sinPesajes'>" +
      "No se pudieron consultar los pesajes." +
      "</div>";

  }

}


// ==================================================
// SINCRONIZAR UN REGISTRO
// ==================================================

async function sincronizarRegistro(
  registro
) {

  const url =
    URL_APPS_SCRIPT +
    "?action=guardar" +
    "&id=" +
    encodeURIComponent(
      registro.id
    ) +
    "&fechaHora=" +
    encodeURIComponent(
      registro.fechaHora
    ) +
    "&codigo=" +
    encodeURIComponent(
      registro.codigo
    ) +
    "&kilos=" +
    encodeURIComponent(
      registro.kilos
    );


  const resultado =
    await jsonp(
      url
    );


  if (
    !resultado ||
    !resultado.ok
  ) {

    throw new Error(
      resultado &&
      resultado.error
        ? resultado.error
        : "No se pudo guardar"
    );

  }


  return true;

}


// ==================================================
// SINCRONIZAR
// ==================================================

async function sincronizar() {

  if (!navigator.onLine) {

    return;

  }


  try {

    const pendientes =
      await obtenerPendientes();


    if (
      pendientes.length === 0
    ) {

      return;

    }


    for (
      const registro
      of pendientes
    ) {

      try {

        await sincronizarRegistro(
          registro
        );


        /*
         IMPORTANTE:
         Solo eliminamos el registro
         local DESPUÉS de confirmar
         que Google Sheets lo recibió.
        */

        await eliminarLocal(
          registro.id
        );


      } catch(error) {

        console.log(
          "Pendiente:",
          error
        );


        break;

      }

    }


    await actualizarPendientes();


  } catch(error) {

    console.log(
      "Error sincronizando:",
      error
    );

  }

}


// ==================================================
// INTERNET DISPONIBLE
// ==================================================

window.addEventListener(
  "online",
  function() {

    document.getElementById(
      "estado"
    ).textContent =
      "Internet disponible. Sincronizando...";


    cargarTrabajadores();


    sincronizar();

  }
);


// ==================================================
// SIN INTERNET
// ==================================================

window.addEventListener(
  "offline",
  function() {

    document.getElementById(
      "estado"
    ).textContent =
      "Sin Internet. Trabajando localmente.";

  }
);


// ==================================================
// INICIAR
// ==================================================

cargarTrabajadores();

actualizarPendientes();


// ==================================================
// SERVICE WORKER
// ==================================================

if (
  "serviceWorker" in navigator
) {

  window.addEventListener(
    "load",
    function() {

      navigator.serviceWorker
        .register(
          "sw.js"
        )
        .then(
          function() {

            console.log(
              "Service Worker instalado"
            );

          }
        )
        .catch(
          function(error) {

            console.log(
              "Error Service Worker:",
              error
            );

          }
        );

    }
  );

}

</script>

</body>

</html>
