<body>


<div class="contenedor">


<h1>
CONTROL DE PESAJES
</h1>


<div class="tarjeta">


<!-- ==================================================
     CÓDIGO TRABAJADOR
================================================== -->

<label>
Código del trabajador
</label>


<input
  id="codigo"
  type="text"
  placeholder="Ej: Trab001"
  autocomplete="off">


<button
  type="button"
  onclick="abrirEscaner()">

📷 ESCANEAR QR

</button>

<button
  id="cerrarQR"
  type="button"
  onclick="cerrarEscaner()">

✖ CERRAR CÁMARA

</button>


<!-- ==================================================
     TRABAJADOR
================================================== -->

<div id="trabajador">

Trabajador no seleccionado

</div>


<!-- ==================================================
     KILOS
================================================== -->

<label>
Kilos
</label>


<input
  id="kilos"
  type="number"
  step="0.1"
  placeholder="Ej: 84.5">


<button
  type="button"
  onclick="guardarPesaje()">

GUARDAR PESAJE

</button>

     ESTADO
================================================== -->

<div id="estado"></div>

     PENDIENTES
================================================== -->

<div id="pendientes">

Pendientes de sincronización: 0

</div>


<!-- ==================================================
     REGISTROS DEL TRABAJADOR
================================================== -->

<div id="zonaRegistros">

<div class="tituloRegistros">

REGISTROS DEL TRABAJADOR

</div>


<div id="listaPesajes">

<div class="sinRegistros">

Seleccione un trabajador

</div>

</div>


<div
  id="totalPesos"
  class="totalPesos">

Total: 0 kg

</div>


</div>


</div>


</div>


<script>


// ==================================================
// URL APPS SCRIPT
// ==================================================

const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbzs9dBMJotH8zBQNYeeOIdejzlTbPBRkw0IErt0Td9eiHmvy497j7Mu2XZJRzc2J_YWkQ/exec";


// ==================================================
// TRABAJADORES
// ==================================================

let trabajadores = [];


// ==================================================
// LECTOR QR
// ==================================================

let streamQR = null;

let intervaloQR = null;


// ==================================================
// TRABAJADOR SELECCIONADO
// ==================================================

let trabajadorSeleccionado = null;


// ==================================================
// JSONP
// ==================================================

function jsonp(url) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        "callback_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2);


      const script =
        document.createElement("script");


      const tiempo =
        setTimeout(
          function() {

            limpiar();

            reject(
              new Error(
                "Tiempo de espera agotado"
              )
            );

          },
          10000
        );


      function limpiar() {

        clearTimeout(tiempo);


        if (script.parentNode) {

          script.parentNode.removeChild(
            script
          );

        }


        try {

          delete window[
            callbackName
          ];

        } catch(error) {

          window[
            callbackName
          ] = undefined;

        }

      }


      window[callbackName] =
        function(datos) {

          limpiar();

          resolve(datos);

        };


      script.onerror =
        function() {

          limpiar();

          reject(
            new Error(
              "No se pudo conectar con Apps Script"
            )
          );

        };


      script.src =
        url +
        (url.indexOf("?") >= 0 ? "&" : "?") +
        "callback=" +
        encodeURIComponent(
          callbackName
        );


      document.body.appendChild(
        script
      );

    }
  );

}


// ==================================================
// CARGAR TRABAJADORES
// ==================================================

async function cargarTrabajadores() {

  const estado =
    document.getElementById(
      "estado"
    );


  if (navigator.onLine) {

    try {

      const lista =
        await jsonp(
          URL_APPS_SCRIPT +
          "?action=trabajadores"
        );


      if (!Array.isArray(lista)) {

        throw new Error(
          "Respuesta incorrecta"
        );

      }


      trabajadores =
        lista;


      localStorage.setItem(
        "trabajadores",
        JSON.stringify(
          trabajadores
        )
      );


      estado.textContent =
        "✓ Trabajadores actualizados";


      return;


    } catch(error) {

      console.log(
        "Error cargando trabajadores:",
        error
      );

    }

  }


  const guardados =
    localStorage.getItem(
      "trabajadores"
    );


  if (guardados) {

    trabajadores =
      JSON.parse(
        guardados
      );


    estado.textContent =
      "✓ Trabajadores disponibles sin Internet";

  } else {

    estado.textContent =
      "No hay trabajadores guardados";

  }

}


// ==================================================
// BUSCAR TRABAJADOR AL ESCRIBIR
// ==================================================

document
  .getElementById("codigo")
  .addEventListener(
    "input",
    function() {

      buscarTrabajador(
        this.value
      );

    }
  );


// ==================================================
// BUSCAR TRABAJADOR
// ==================================================

function buscarTrabajador(
  codigo
) {

  codigo =
    codigo.trim();


  const pantalla =
    document.getElementById(
      "trabajador"
    );


  if (!codigo) {

    trabajadorSeleccionado =
      null;


    pantalla.textContent =
      "Trabajador no seleccionado";


    mostrarRegistrosTrabajador();


    return;

  }


  const trabajador =
    trabajadores.find(
      function(t) {

        return String(
          t.codigo
        )
        .toLowerCase()
        ===
        codigo.toLowerCase();

      }
    );


  if (trabajador) {

    trabajadorSeleccionado =
      trabajador;


    pantalla.textContent =
      trabajador.nombre +
      " (" +
      trabajador.codigo +
      ")";


    mostrarRegistrosTrabajador();


  } else {

    trabajadorSeleccionado =
      null;


    pantalla.textContent =
      "Trabajador no encontrado";


    mostrarRegistrosTrabajador();

  }

}


// ==================================================
// ESCANEAR QR
// ==================================================

async function abrirEscaner() {

  const lector =
    document.getElementById(
      "lectorQR"
    );


  const botonCerrar =
    document.getElementById(
      "cerrarQR"
    );


  const estado =
    document.getElementById(
      "estado"
    );


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    estado.textContent =
      "La cámara no está disponible.";

    return;

  }


  try {

    streamQR =
      await navigator.mediaDevices
        .getUserMedia({

          video: {
            facingMode: {
              ideal: "environment"
            }
          },

          audio: false

        });


    const video =
      document.createElement(
        "video"
      );


    video.setAttribute(
      "playsinline",
      true
    );


    video.autoplay =
      true;


    video.srcObject =
      streamQR;


    lector.innerHTML =
      "";


    lector.appendChild(
      video
    );


    botonCerrar.style.display =
      "block";


    estado.textContent =
      "Apunta la cámara al QR del trabajador";


    await video.play();


    if (
      "BarcodeDetector" in window
    ) {

      const detector =
        new BarcodeDetector({

          formats: [
            "qr_code"
          ]

        });


      intervaloQR =
        setInterval(
          async function() {

            try {

              const codigos =
                await detector.detect(
                  video
                );


              if (
                codigos.length > 0
              ) {

                procesarQR(
                  codigos[0].rawValue
                );

              }

            } catch(error) {

              console.log(
                "Error lector QR:",
                error
              );

            }

          },
          300
        );


    } else {

      estado.textContent =
        "Este navegador no admite lectura QR directa.";

    }


  } catch(error) {

    console.log(
      error
    );


    estado.textContent =
      "No se pudo abrir la cámara. Revisa los permisos.";

  }

}


// ==================================================
// PROCESAR QR
// ==================================================

function procesarQR(
  valor
) {

  valor =
    String(
      valor
    ).trim();


  document.getElementById(
    "codigo"
  ).value =
    valor;


  buscarTrabajador(
    valor
  );


  cerrarEscaner();


  const trabajador =
    trabajadores.find(
      function(t) {

        return String(
          t.codigo
        )
        .toLowerCase()
        ===
        valor.toLowerCase();

      }
    );


  if (trabajador) {

    document.getElementById(
      "estado"
    ).textContent =
      "✓ QR reconocido: " +
      trabajador.nombre;

  } else {

    document.getElementById(
      "estado"
    ).textContent =
      "QR leído, pero el trabajador no existe";

  }

}


// ==================================================
// CERRAR ESCÁNER
// ==================================================

function cerrarEscaner() {

  if (intervaloQR) {

    clearInterval(
      intervaloQR
    );

    intervaloQR =
      null;

  }


  if (streamQR) {

    streamQR
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    streamQR =
      null;

  }


  document.getElementById(
    "lectorQR"
  ).innerHTML =
    "";


  document.getElementById(
    "cerrarQR"
  ).style.display =
    "none";

}


// ==================================================
// BASE DE DATOS LOCAL
// ==================================================

const DB_NAME =
  "ControlPesajesDB";

const DB_VERSION =
  1;

const STORE_NAME =
  "pesajes";


function abrirBaseDatos() {

  return new Promise(
    function(resolve, reject) {

      const solicitud =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );


      solicitud.onupgradeneeded =
        function(event) {

          const db =
            event.target.result;


          if (
            !db.objectStoreNames
              .contains(
                STORE_NAME
              )
          ) {

            db.createObjectStore(
              STORE_NAME,
              {
                keyPath: "id"
              }
            );

          }

        };


      solicitud.onsuccess =
        function(event) {

          resolve(
            event.target.result
          );

        };


      solicitud.onerror =
        function() {

          reject(
            solicitud.error
          );

        };

    }
  );

}


// ==================================================
// GUARDAR LOCAL
// ==================================================

async function guardarLocal(
  registro
) {

  const db =
    await abrirBaseDatos();


  return new Promise(
    function(resolve, reject) {

      const transaccion =
        db.transaction(
          STORE_NAME,
          "readwrite"
        );


      const almacen =
        transaccion.objectStore(
          STORE_NAME
        );


      almacen.put(
        registro
      );


      transaccion.oncomplete =
        function() {

          resolve();

        };


      transaccion.onerror =
        function() {

          reject(
            transaccion.error
          );

        };

    }
  );

}


// ==================================================
// OBTENER TODOS LOS REGISTROS LOCALES
// ==================================================

async function obtenerTodosLosRegistros() {

  const db =
    await abrirBaseDatos();


  return new Promise(
    function(resolve, reject) {

      const transaccion =
        db.transaction(
          STORE_NAME,
          "readonly"
        );


      const almacen =
        transaccion.objectStore(
          STORE_NAME
        );


      const solicitud =
        almacen.getAll();


      solicitud.onsuccess =
        function() {

          resolve(
            solicitud.result
          );

        };


      solicitud.onerror =
        function() {

          reject(
            solicitud.error
          );

        };

    }
  );

}


// ==================================================
// ELIMINAR LOCAL
// ==================================================

async function eliminarLocal(
  id
) {

  const db =
    await abrirBaseDatos();


  return new Promise(
    function(resolve, reject) {

      const transaccion =
        db.transaction(
          STORE_NAME,
          "readwrite"
        );


      const almacen =
        transaccion.objectStore(
          STORE_NAME
        );


      almacen.delete(
        id
      );


      transaccion.oncomplete =
        function() {

          resolve();

        };


      transaccion.onerror =
        function() {

          reject(
            transaccion.error
          );

        };

    }
  );

}


// ==================================================
// MOSTRAR REGISTROS DEL TRABAJADOR
// ==================================================

async function mostrarRegistrosTrabajador() {

  const lista =
    document.getElementById(
      "listaPesajes"
    );


  const total =
    document.getElementById(
      "totalPesos"
    );


  if (!trabajadorSeleccionado) {

    lista.innerHTML =
      '<div class="sinRegistros">' +
      'Seleccione un trabajador' +
      '</div>';


    total.textContent =
      "Total: 0 kg";


    return;

  }


  try {

    const registros =
      await obtenerTodosLosRegistros();


    const codigo =
      String(
        trabajadorSeleccionado.codigo
      )
      .toLowerCase();


    const registrosTrabajador =
      registros.filter(
        function(registro) {

          return String(
            registro.codigo
          )
          .toLowerCase()
          ===
          codigo;

        }
      );


    lista.innerHTML =
      "";


    if (
      registrosTrabajador.length === 0
    ) {

      lista.innerHTML =
        '<div class="sinRegistros">' +
        'No hay pesajes registrados para este trabajador.' +
        '</div>';


      total.textContent =
        "Total: 0 kg";


      return;

    }


    let suma =
      0;


    registrosTrabajador
      .slice()
      .reverse()
      .forEach(
        function(registro) {

          suma +=
            Number(
              registro.kilos
            ) || 0;


          const div =
            document.createElement(
              "div"
            );


          div.className =
            "pesaje";


          const hora =
            document.createElement(
              "div"
            );


          hora.className =
            "pesajeHora";


          hora.textContent =
            registro.fechaHora;


          const peso =
            document.createElement(
              "div"
            );


          peso.className =
            "pesajePeso";


          peso.textContent =
            "Peso: " +
            registro.kilos +
            " kg";


          const estadoRegistro =
            document.createElement(
              "div"
            );


          estadoRegistro.className =
            "pesajeEstado";


          if (
            registro.sincronizado
          ) {

            estadoRegistro.textContent =
              "✓ Sincronizado";

          } else {

            estadoRegistro.textContent =
              "⏳ Pendiente de sincronización";

          }


          const boton =
            document.createElement(
              "button"
            );


          boton.type =
            "button";


          boton.className =
            "botonEliminar";


          boton.textContent =
            "❌";


          boton.title =
            "Eliminar pesaje";


          boton.onclick =
            function() {

              eliminarPesaje(
                registro
              );

            };


          div.appendChild(
            hora
          );


          div.appendChild(
            peso
          );


          div.appendChild(
            estadoRegistro
          );


          div.appendChild(
            boton
          );


          lista.appendChild(
            div
          );

        }
      );


    total.textContent =
      "Total: " +
      suma.toFixed(1) +
      " kg";


  } catch(error) {

    console.log(
      error
    );

  }

}


// ==================================================
// ACTUALIZAR PENDIENTES
// ==================================================

async function actualizarPendientes() {

  try {

    const registros =
      await obtenerTodosLosRegistros();


    const pendientes =
      registros.filter(
        function(registro) {

          return !registro.sincronizado;

        }
      );


    document.getElementById(
      "pendientes"
    ).textContent =
      "Pendientes de sincronización: " +
      pendientes.length;


    await mostrarRegistrosTrabajador();


  } catch(error) {

    console.log(
      error
    );

  }

}


// ==================================================
// GUARDAR PESAJE
// ==================================================

async function guardarPesaje() {

  const codigo =
    document.getElementById(
      "codigo"
    ).value.trim();


  const kilos =
    document.getElementById(
      "kilos"
    ).value;


  const estado =
    document.getElementById(
      "estado"
    );


  if (!codigo) {

    estado.textContent =
      "Ingrese el código";

    return;

  }


  if (
    !kilos ||
    Number(kilos) <= 0
  ) {

    estado.textContent =
      "Ingrese los kilos";

    return;

  }


  const trabajador =
    trabajadores.find(
      function(t) {

        return String(
          t.codigo
        )
        .toLowerCase()
        ===
        codigo.toLowerCase();

      }
    );


  if (!trabajador) {

    estado.textContent =
      "Trabajador no encontrado";

    return;

  }


  trabajadorSeleccionado =
    trabajador;


  const registro = {

    id:
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(
          2,
          8
        ),


    fechaHora:
      new Date().toLocaleString(
        "es-CL",
        {
          timeZone:
            "America/Santiago",

          year:
            "numeric",

          month:
            "2-digit",

          day:
            "2-digit",

          hour:
            "2-digit",

          minute:
            "2-digit",

          second:
            "2-digit",

          hour12:
            false

        }
      ),


    codigo:
      trabajador.codigo,


    kilos:
      Number(
        kilos
      ),


    sincronizado:
      false

  };


  try {

    await guardarLocal(
      registro
    );


    document.getElementById(
      "kilos"
    ).value =
      "";


    estado.textContent =
      "✓ Pesaje guardado";


    await actualizarPendientes();


    if (
      navigator.onLine
    ) {

      sincronizar();

    }


  } catch(error) {

    console.error(
      error
    );


    estado.textContent =
      "Error al guardar en la tablet";

  }

}


// ==================================================
// SINCRONIZAR UN REGISTRO
// ==================================================

async function sincronizarRegistro(
  registro
) {

  const url =
    URL_APPS_SCRIPT +
    "?action=guardar" +
    "&id=" +
    encodeURIComponent(
      registro.id
    ) +
    "&fechaHora=" +
    encodeURIComponent(
      registro.fechaHora
    ) +
    "&codigo=" +
    encodeURIComponent(
      registro.codigo
    ) +
    "&kilos=" +
    encodeURIComponent(
      registro.kilos
    );


  const resultado =
    await jsonp(
      url
    );


  if (
    !resultado.ok
  ) {

    throw new Error(
      resultado.error ||
      "No se pudo guardar"
    );

  }


  return true;

}


// ==================================================
// MARCAR COMO SINCRONIZADO
// ==================================================

async function marcarSincronizado(
  registro
) {

  registro.sincronizado =
    true;


  await guardarLocal(
    registro
  );

}


// ==================================================
// SINCRONIZAR
// ==================================================

async function sincronizar() {

  if (
    !navigator.onLine
  ) {

    return;

  }


  try {

    const registros =
      await obtenerTodosLosRegistros();


    const pendientes =
      registros.filter(
        function(registro) {

          return !registro.sincronizado;

        }
      );


    for (
      const registro
      of pendientes
    ) {

      try {

        await sincronizarRegistro(
          registro
        );


        /*
           IMPORTANTE:
           NO ELIMINAMOS EL REGISTRO
           DE LA TABLET.

           Solo lo marcamos como
           sincronizado para conservar
           el historial local.
        */

        await marcarSincronizado(
          registro
        );


      } catch(error) {

        console.log(
          "Pendiente:",
          error
        );


        break;

      }

    }


    await actualizarPendientes();


  } catch(error) {

    console.log(
      "Error sincronizando:",
      error
    );

  }

}


// ==================================================
// ELIMINAR PESAJE
// ==================================================

async function eliminarPesaje(
  registro
) {

  const confirmar =
    confirm(
      "¿Seguro que quieres eliminar este pesaje?\n\n" +
      "Trabajador: " +
      registro.codigo +
      "\n" +
      "Peso: " +
      registro.kilos +
      " kg\n" +
      "Fecha: " +
      registro.fechaHora
    );


  if (!confirmar) {

    return;

  }


  try {

    /*
       SI YA FUE SINCRONIZADO,
       LO BORRAMOS TAMBIÉN
       DE GOOGLE SHEETS.
    */

    if (
      registro.sincronizado &&
      navigator.onLine
    ) {

      const resultado =
        await jsonp(
          URL_APPS_SCRIPT +
          "?action=eliminar" +
          "&id=" +
          encodeURIComponent(
            registro.id
          )
        );


      if (
        !resultado.ok
      ) {

        throw new Error(
          resultado.error ||
          "No se pudo eliminar de Google Sheets"
        );

      }

    }


    /*
       ELIMINAR DE LA TABLET
    */

    await eliminarLocal(
      registro.id
    );


    await actualizarPendientes();


    document.getElementById(
      "estado"
    ).textContent =
      "✓ Pesaje eliminado";


  } catch(error) {

    console.log(
      "Error eliminando:",
      error
    );


    document.getElementById(
      "estado"
    ).textContent =
      "Error al eliminar el pesaje";

  }

}
