<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#333333">

<link rel="manifest"
      href="manifest.json">

<title>Control de Pesajes</title>

<style>

body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 20px;
  background: #f2f2f2;
}

.contenedor {
  max-width: 600px;
  margin: auto;
}

}

  margin-top: 20px;
}

  margin-top: 15px;
  font-weight: bold;

  color: white;

  margin-top: 15px;

  font-weight: bold;
}

  text-align: center;
  padding: 20px;
}

  background: #e5e5e5;
}

</style>

</head>

<body>

<div class="contenedor">

<h1>CONTROL DE PESAJES</h1>

<!-- ==========================================
     PANTALLA PRINCIPAL
========================================== -->

<div id="pantallaPesaje">

<div class="tarjeta">

<label>
Código del trabajador
</label>

<input
  id="codigo"
  type="text"
  placeholder="Ej: Trab001"
  autocomplete="off">

<button
  type="button"
  onclick="abrirEscaner()">

📷 ESCANEAR QR

</button>

<div id="lectorQR"></div>

<button
  id="cerrarQR"
  type="button"
  onclick="cerrarEscaner()">

✖ CERRAR CÁMARA

</button>

<div id="trabajador">

Trabajador no seleccionado

</div>

<label>
Kilos
</label>

<input
  id="kilos"
  type="number"
  step="0.1"
  placeholder="Ej: 84.5">

<button
  onclick="guardarPesaje()">

GUARDAR PESAJE

</button>

<div id="estado"></div>

<div id="pendientes">

Pendientes: 0

</div>

<button
  type="button"
  class="boton-secundario"
  onclick="mostrarHistorial()">

📋 VER REGISTROS DEL DÍA

</button>

</div>

</div>


<!-- ==========================================
     HISTORIAL
========================================== -->

<div id="historial">

<div class="tarjeta">

<h2>📋 REGISTROS DEL DÍA</h2>

<label>
Buscar trabajador
</label>

<input
  id="buscarHistorial"
  type="text"
  placeholder="Escriba código o nombre"
  autocomplete="off">

<button
  type="button"
  onclick="mostrarTodosLosRegistros()">

👥 MOSTRAR TODOS

</button>

<div id="listaHistorial"></div>

<button
  type="button"
  class="boton-secundario"
  onclick="cerrarHistorial()">

⬅ VOLVER AL PESAJE

</button>

</div>

</div>

</div>


<script>


// ==========================================
// URL APPS SCRIPT
// ==========================================

const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbzs9dBMJotH8zBQNYeeOIdejzlTbPBRkw0IErt0Td9eiHmvy497j7Mu2XZJRzc2J_YWkQ/exec";


// ==========================================
// TRABAJADORES
// ==========================================

let trabajadores = [];


// ==========================================
// LECTOR QR
// ==========================================

let streamQR = null;

let intervaloQR = null;


// ==========================================
// JSONP
// ==========================================

function jsonp(url) {

  return new Promise(function(resolve, reject) {

    const callbackName =
      "callback_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .substring(2);

    const script =
      document.createElement("script");

    const tiempo =
      setTimeout(function() {

        limpiar();

        reject(
          new Error(
            "Tiempo de espera agotado"
          )
        );

      }, 10000);


    function limpiar() {

      clearTimeout(tiempo);

      if (script.parentNode) {

        script.parentNode.removeChild(
          script
        );

      }

      try {

        delete window[
          callbackName
        ];

      } catch(error) {

        window[
          callbackName
        ] = undefined;

      }

    }


    window[callbackName] =
      function(datos) {

        limpiar();

        resolve(datos);

      };


    script.onerror =
      function() {

        limpiar();

        reject(
          new Error(
            "No se pudo conectar con Apps Script"
          )
        );

      };


    script.src =
      url +
      "&callback=" +
      encodeURIComponent(
        callbackName
      );


    document.body.appendChild(
      script
    );

  });

}


// ==========================================
// CARGAR TRABAJADORES
// ==========================================

async function cargarTrabajadores() {

  const estado =
    document.getElementById(
      "estado"
    );


  if (navigator.onLine) {

    try {

      const lista =
        await jsonp(
          URL_APPS_SCRIPT +
          "?action=trabajadores"
        );


      if (!Array.isArray(lista)) {

        throw new Error(
          "Respuesta incorrecta"
        );

      }


      trabajadores =
        lista;


      localStorage.setItem(
        "trabajadores",
        JSON.stringify(
          trabajadores
        )
      );


      estado.textContent =
        "✓ Trabajadores actualizados";


      console.log(
        "Trabajadores:",
        trabajadores
      );


      return;

    } catch(error) {

      console.log(
        "Error Internet:",
        error
      );

    }

  }


  const guardados =
    localStorage.getItem(
      "trabajadores"
    );


  if (guardados) {

    trabajadores =
      JSON.parse(
        guardados
      );


    estado.textContent =
      "✓ Trabajadores disponibles sin Internet";

  } else {

    estado.textContent =
      "No hay trabajadores guardados";

  }

}


// ==========================================
// BUSCAR TRABAJADOR
// ==========================================

document
  .getElementById("codigo")
  .addEventListener(
    "input",
    function() {

      buscarTrabajador(
        this.value
      );

    }
  );


function buscarTrabajador(codigo) {

  codigo =
    codigo.trim();


  const trabajador =
    trabajadores.find(
      function(t) {

        return String(
          t.codigo
        )
        .toLowerCase()
        ===
        codigo.toLowerCase();

      }
    );


  const pantalla =
    document.getElementById(
      "trabajador"
    );


  if (trabajador) {

    pantalla.textContent =
      trabajador.nombre +
      " (" +
      trabajador.codigo +
      ")";


  } else if (codigo) {

    pantalla.textContent =
      "Trabajador no encontrado";


  } else {

    pantalla.textContent =
      "Trabajador no seleccionado";

  }

}


// ==========================================
// ESCANEAR QR
// ==========================================

async function abrirEscaner() {

  const lector =
    document.getElementById(
      "lectorQR"
    );


  const botonCerrar =
    document.getElementById(
      "cerrarQR"
    );


  const estado =
    document.getElementById(
      "estado"
    );


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    estado.textContent =
      "La cámara no está disponible.";

    return;

  }


  try {

    streamQR =
      await navigator.mediaDevices
        .getUserMedia({

          video: {
            facingMode: {
              ideal: "environment"
            }
          },

          audio: false

        });


    const video =
      document.createElement(
        "video"
      );


    video.setAttribute(
      "playsinline",
      true
    );


    video.autoplay =
      true;


    video.srcObject =
      streamQR;


    lector.innerHTML =
      "";


    lector.appendChild(
      video
    );


    botonCerrar.style.display =
      "block";


    estado.textContent =
      "Apunta la cámara al QR del trabajador";


    await video.play();


    if (
      "BarcodeDetector"
      in window
    ) {

      const detector =
        new BarcodeDetector({

          formats: [
            "qr_code"
          ]

        });


      intervaloQR =
        setInterval(
          async function() {

            try {

              const codigos =
                await detector.detect(
                  video
                );


              if (
                codigos.length > 0
              ) {

                const codigoQR =
                  codigos[0].rawValue;


                procesarQR(
                  codigoQR
                );

              }

            } catch(error) {

              console.log(
                "Error lector QR:",
                error
              );

            }

          },
          300
        );


    } else {

      estado.textContent =
        "Este navegador no admite lectura QR directa.";

    }


  } catch(error) {

    console.log(
      error
    );


    estado.textContent =
      "No se pudo abrir la cámara. Revisa los permisos.";

  }

}


// ==========================================
// PROCESAR QR
// ==========================================

function procesarQR(valor) {

  valor =
    String(valor).trim();


  console.log(
    "QR leído:",
    valor
  );


  document.getElementById(
    "codigo"
  ).value =
    valor;


  buscarTrabajador(
    valor
  );


  cerrarEscaner();


  const trabajador =
    trabajadores.find(
      function(t) {

        return String(
          t.codigo
        )
        .toLowerCase()
        ===
        valor.toLowerCase();

      }
    );


  if (trabajador) {

    document.getElementById(
      "estado"
    ).textContent =
      "✓ QR reconocido: " +
      trabajador.nombre;


  } else {

    document.getElementById(
      "estado"
    ).textContent =
      "QR leído, pero el trabajador no existe";

  }

}


// ==========================================
// CERRAR ESCÁNER
// ==========================================

function cerrarEscaner() {

  if (intervaloQR) {

    clearInterval(
      intervaloQR
    );

    intervaloQR =
      null;

  }


  if (streamQR) {

    streamQR
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    streamQR =
      null;

  }


  const lector =
    document.getElementById(
      "lectorQR"
    );


  lector.innerHTML =
    "";


  document.getElementById(
    "cerrarQR"
  ).style.display =
    "none";

}


// ==========================================
// BASE DE DATOS LOCAL
// ==========================================

const DB_NAME =
"ControlPesajesDB";

const DB_VERSION =
2;

const STORE_NAME =
"pesajes";

const HISTORIAL_STORE =
"historialPesajes";


function abrirBaseDatos() {

  return new Promise(
    function(resolve, reject) {

      const solicitud =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );


      solicitud.onupgradeneeded =
        function(event) {

          const db =
            event.target.result;


          if (
            !db.objectStoreNames
              .contains(
                STORE_NAME
              )
          ) {

            db.createObjectStore(
              STORE_NAME,
              {
                keyPath: "id"
              }
            );

          }


          if (
            !db.objectStoreNames
              .contains(
                HISTORIAL_STORE
              )
          ) {

            db.createObjectStore(
              HISTORIAL_STORE,
              {
                keyPath: "id"
              }
            );

          }

        };


      solicitud.onsuccess =
        function(event) {

          resolve(
            event.target.result
          );

        };


      solicitud.onerror =
        function() {

          reject(
            solicitud.error
          );

        };

    }
  );

}


// ==========================================
// GUARDAR LOCAL
// ==========================================

async function guardarLocal(registro) {

  const db =
    await abrirBaseDatos();


  return new Promise(
    function(resolve, reject) {

      const transaccion =
        db.transaction(
          [
            STORE_NAME,
            HISTORIAL_STORE
          ],
          "readwrite"
        );


      const almacenPendientes =
        transaccion.objectStore(
          STORE_NAME
        );


      const almacenHistorial =
        transaccion.objectStore(
          HISTORIAL_STORE
        );


      almacenPendientes.put(
        registro
      );


      almacenHistorial.put(
        registro
      );


      transaccion.oncomplete =
        function() {

          resolve();

        };


      transaccion.onerror =
        function() {

          reject(
            transaccion.error
          );

        };

    }
  );

}


// ==========================================
// OBTENER PENDIENTES
// ==========================================

async function obtenerPendientes() {

  const db =
    await abrirBaseDatos();


  return new Promise(
    function(resolve, reject) {

      const transaccion =
        db.transaction(
          STORE_NAME,
          "readonly"
        );


      const almacen =
        transaccion.objectStore(
          STORE_NAME
        );


      const solicitud =
        almacen.getAll();


      solicitud.onsuccess =
        function() {

          resolve(
            solicitud.result
          );

        };


      solicitud.onerror =
        function() {

          reject(
            solicitud.error
          );

        };

    }
  );

}


// ==========================================
// OBTENER HISTORIAL
// ==========================================

async function obtenerHistorial() {

  const db =
    await abrirBaseDatos();


  return new Promise(
    function(resolve, reject) {

      const transaccion =
        db.transaction(
          HISTORIAL_STORE,
          "readonly"
        );


      const almacen =
        transaccion.objectStore(
          HISTORIAL_STORE
        );


      const solicitud =
        almacen.getAll();


      solicitud.onsuccess =
        function() {

          resolve(
            solicitud.result
          );

        };


      solicitud.onerror =
        function() {

          reject(
            solicitud.error
          );

        };

    }
  );

}


// ==========================================
// ELIMINAR PENDIENTE
// ==========================================

async function eliminarLocal(id) {

  const db =
    await abrirBaseDatos();


  return new Promise(
    function(resolve, reject) {

      const transaccion =
        db.transaction(
          STORE_NAME,
          "readwrite"
        );


      const almacen =
        transaccion.objectStore(
          STORE_NAME
        );


      almacen.delete(
        id
      );


      transaccion.oncomplete =
        function() {

          resolve();

        };


      transaccion.onerror =
        function() {

          reject(
            transaccion.error
          );

        };

    }
  );

}


// ==========================================
// CONTADOR
// ==========================================

async function actualizarPendientes() {

  try {

    const pendientes =
      await obtenerPendientes();


    document.getElementById(
      "pendientes"
    ).textContent =
      "Pendientes: " +
      pendientes.length;


  } catch(error) {

    console.log(error);

  }

}


// ==========================================
// GUARDAR PESAJE
// ==========================================

async function guardarPesaje() {

  const codigo =
    document.getElementById(
      "codigo"
    ).value.trim();


  const kilos =
    document.getElementById(
      "kilos"
    ).value;


  const estado =
    document.getElementById(
      "estado"
    );


  if (!codigo) {

    estado.textContent =
      "Ingrese el código";

    return;

  }


  if (
    !kilos ||
    Number(kilos) <= 0
  ) {

    estado.textContent =
      "Ingrese los kilos";

    return;

  }


  const trabajador =
    trabajadores.find(
      function(t) {

        return String(
          t.codigo
        )
        .toLowerCase()
        ===
        codigo.toLowerCase();

      }
    );


  if (!trabajador) {

    estado.textContent =
      "Trabajador no encontrado";

    return;

  }


  const registro = {

    id:
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(
          2,
          8
        ),

    fechaHora:
      new Date().toISOString(),

    codigo:
      trabajador.codigo,

    nombre:
      trabajador.nombre,

    kilos:
      Number(kilos)

  };


  try {

    await guardarLocal(
      registro
    );


    await actualizarPendientes();


    estado.textContent =
      "✓ Pesaje guardado";


    document.getElementById(
      "kilos"
    ).value =
      "";


    if (
      navigator.onLine
    ) {

      sincronizar();

    }


  } catch(error) {

    estado.textContent =
      "Error al guardar";


    console.error(
      error
    );

  }

}


// ==========================================
// SINCRONIZAR UN PESAJE
// ==========================================

async function sincronizarRegistro(registro) {

  const url =
    URL_APPS_SCRIPT +
    "?action=guardar" +
    "&id=" +
    encodeURIComponent(
      registro.id
    ) +
    "&fechaHora=" +
    encodeURIComponent(
      registro.fechaHora
    ) +
    "&codigo=" +
    encodeURIComponent(
      registro.codigo
    ) +
    "&kilos=" +
    encodeURIComponent(
      registro.kilos
    );


  const resultado =
    await jsonp(
      url
    );


  if (!resultado.ok) {

    throw new Error(
      resultado.error ||
      "No se pudo guardar"
    );

  }


  return true;

}


// ==========================================
// SINCRONIZAR
// ==========================================

async function sincronizar() {

  if (
    !navigator.onLine
  ) {

    return;

  }


  const pendientes =
    await obtenerPendientes();


  for (
    const registro
    of pendientes
  ) {

    try {

      await sincronizarRegistro(
        registro
      );


      await eliminarLocal(
        registro.id
      );


    } catch(error) {

      console.log(
        "Pendiente:",
        error
      );


      break;

    }

  }


  await actualizarPendientes();

}


// ==========================================
// MOSTRAR HISTORIAL
// ==========================================

async function mostrarHistorial() {

  document.getElementById(
    "pantallaPesaje"
  ).style.display =
    "none";


  document.getElementById(
    "historial"
  ).style.display =
    "block";


  document.getElementById(
    "buscarHistorial"
  ).value =
    "";


  await mostrarTodosLosRegistros();

}


// ==========================================
// CERRAR HISTORIAL
// ==========================================

function cerrarHistorial() {

  document.getElementById(
    "historial"
  ).style.display =
    "none";


  document.getElementById(
    "pantallaPesaje"
  ).style.display =
    "block";

}


// ==========================================
// MOSTRAR TODOS LOS REGISTROS
// ==========================================

async function mostrarTodosLosRegistros() {

  const contenedor =
    document.getElementById(
      "listaHistorial"
    );


  contenedor.innerHTML =
    "Cargando registros...";


  try {

    const registros =
      await obtenerHistorial();


    const hoy =
      obtenerFechaLocal(
        new Date()
      );


    const registrosHoy =
      registros.filter(
        function(registro) {

          return obtenerFechaLocal(
            new Date(
              registro.fechaHora
            )
          ) === hoy;

        }
      );


    const busqueda =
      document.getElementById(
        "buscarHistorial"
      ).value
      .trim()
      .toLowerCase();


    let filtrados =
      registrosHoy;


    if (busqueda) {

      filtrados =
        registrosHoy.filter(
          function(registro) {

            const nombre =
              String(
                registro.nombre || ""
              ).toLowerCase();


            const codigo =
              String(
                registro.codigo || ""
              ).toLowerCase();


            return (
              nombre.includes(
                busqueda
              ) ||
              codigo.includes(
                busqueda
              )
            );

          }
        );

    }


    filtrados.sort(
      function(a, b) {

        return new Date(
          b.fechaHora
        ) -
        new Date(
          a.fechaHora
        );

      }
    );


    if (
      filtrados.length === 0
    ) {

      contenedor.innerHTML =
        '<div class="sin-registros">' +
        'No hay registros para hoy.' +
        '</div>';

      return;

    }


    let html = "";


    let total =
      0;


    filtrados.forEach(
      function(registro) {

        total +=
          Number(
            registro.kilos
          );


        const fecha =
          new Date(
            registro.fechaHora
          );


        const hora =
          fecha.toLocaleTimeString(
            "es-CL",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          );


        html +=
          '<div class="registro">' +

          '<strong>' +
          escapeHTML(
            registro.nombre ||
            "Sin nombre"
          ) +
          '</strong><br>' +

          'Código: ' +
          escapeHTML(
            registro.codigo
          ) +
          '<br>' +

          'Hora: ' +
          hora +
          '<br>' +

          'Peso: <strong>' +
          Number(
            registro.kilos
          ).toFixed(1) +
          ' kg</strong>' +

          '</div>';

      }
    );


    html +=
      '<div class="total">' +
      'TOTAL: ' +
      total.toFixed(1) +
      ' kg' +
      '</div>';


    contenedor.innerHTML =
      html;


  } catch(error) {

    console.error(
      error
    );


    contenedor.innerHTML =
      '<div class="sin-registros">' +
      'No se pudo cargar el historial.' +
      '</div>';

  }

}


// ==========================================
// FECHA LOCAL
// ==========================================

function obtenerFechaLocal(fecha) {

  const año =
    fecha.getFullYear();


  const mes =
    String(
      fecha.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const dia =
    String(
      fecha.getDate()
    ).padStart(
      2,
      "0"
    );


  return
    año +
    "-" +
    mes +
    "-" +
    dia;

}


// ==========================================
// PROTEGER TEXTO HTML
// ==========================================

function escapeHTML(texto) {

  return String(
    texto
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}
