<script>


// ==================================================
// URL GOOGLE APPS SCRIPT
// ==================================================

const URL_APPS_SCRIPT =
  "https://script.google.com/macros/s/AKfycbx7Sy-xMXL2S6DKloTVA8baMDZhTcPDA3dLqZxPPmDF7xmlizZvKn4lj2nbjJ3nAp_ldw/exec";


// ==================================================
// TRABAJADORES
// ==================================================

let trabajadores = [];

let trabajadorSeleccionado = null;

// Promesa de sincronización actualmente en curso.
// Evita que dos procesos intenten sincronizar al mismo tiempo.
let sincronizacionEnCurso = null;


// ==================================================
// BASE DE DATOS
// ==================================================

const DB_NAME =
  "ControlPesajesDB";

const DB_VERSION =
  6;

const STORE_REGISTROS =
  "pesajes";

const STORE_TRABAJADORES =
  "trabajadores";


// ==================================================
// FECHA LOCAL
// ==================================================

function obtenerFechaLocal(fecha) {

  const f =
    fecha
      ? new Date(fecha)
      : new Date();


  const año =
    f.getFullYear();


  const mes =
    String(
      f.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const dia =
    String(
      f.getDate()
    ).padStart(
      2,
      "0"
    );


  return (
    año +
    "-" +
    mes +
    "-" +
    dia
  );

}


// ==================================================
// ABRIR BASE DE DATOS
// ==================================================

function abrirBaseDatos() {

  return new Promise(
    function(resolve, reject) {

      let solicitud;

      try {

        solicitud =
          indexedDB.open(
            DB_NAME,
            DB_VERSION
          );

      } catch (error) {

        reject(error);

        return;

      }


      solicitud.onupgradeneeded =
        function(event) {

          const db =
            event.target.result;


          if (

            !db.objectStoreNames.contains(
              STORE_REGISTROS
            )

          ) {

            db.createObjectStore(

              STORE_REGISTROS,

              {
                keyPath: "id"
              }

            );

          }


          if (

            !db.objectStoreNames.contains(
              STORE_TRABAJADORES
            )

          ) {

            db.createObjectStore(

              STORE_TRABAJADORES,

              {
                keyPath: "id"
              }

            );

          }

        };


      solicitud.onsuccess =
        function(event) {

          resolve(
            event.target.result
          );

        };


      solicitud.onerror =
        function() {

          reject(
            solicitud.error
          );

        };


      solicitud.onblocked =
        function() {

          reject(
            new Error(
              "Base de datos bloqueada"
            )
          );

        };

    }
  );

}


// ==================================================
// GUARDAR EN ALMACÉN
// ==================================================

async function guardarEnAlmacen(
  almacenNombre,
  datos
) {

  const db =
    await abrirBaseDatos();


  return new Promise(
    function(resolve, reject) {

      const transaccion =
        db.transaction(
          almacenNombre,
          "readwrite"
        );


      const almacen =
        transaccion.objectStore(
          almacenNombre
        );


      almacen.put(
        datos
      );


      transaccion.oncomplete =
        function() {

          db.close();

          resolve();

        };


      transaccion.onerror =
        function() {

          db.close();

          reject(
            transaccion.error
          );

        };

    }
  );

}


// ==================================================
// OBTENER DE ALMACÉN
// ==================================================

async function obtenerDeAlmacen(
  almacenNombre
) {

  const db =
    await abrirBaseDatos();


  return new Promise(
    function(resolve, reject) {

      const transaccion =
        db.transaction(
          almacenNombre,
          "readonly"
        );


      const almacen =
        transaccion.objectStore(
          almacenNombre
        );


      const solicitud =
        almacen.getAll();


      solicitud.onsuccess =
        function() {

          const datos =
            solicitud.result ||
            [];


          db.close();

          resolve(
            datos
          );

        };


      solicitud.onerror =
        function() {

          db.close();

          reject(
            solicitud.error
          );

        };

    }
  );

}


// ==================================================
// ELIMINAR DE ALMACÉN
// ==================================================

async function eliminarDeAlmacen(
  almacenNombre,
  id
) {

  const db =
    await abrirBaseDatos();


  return new Promise(
    function(resolve, reject) {

      const transaccion =
        db.transaction(
          almacenNombre,
          "readwrite"
        );


      const almacen =
        transaccion.objectStore(
          almacenNombre
        );


      almacen.delete(
        id
      );


      transaccion.oncomplete =
        function() {

          db.close();

          resolve();

        };


      transaccion.onerror =
        function() {

          db.close();

          reject(
            transaccion.error
          );

        };

    }
  );

}


// ==================================================
// JSONP
// ==================================================

function jsonp(url, tiempoEspera = 30000) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        "callback_" +
        Date.now() +
        "_" +
        Math
          .random()
          .toString(36)
          .substring(2);


      const script =
        document.createElement(
          "script"
        );


      let terminado =
        false;


      const tiempo =
        setTimeout(

          function() {

            if (
              terminado
            ) {

              return;

            }


            terminado =
              true;


            limpiar();


            reject(
              new Error(
                "Tiempo de espera agotado"
              )
            );

          },

          tiempoEspera

        );


      function limpiar() {

        clearTimeout(
          tiempo
        );


        if (
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }


        try {

          delete window[
            callbackName
          ];

        } catch (error) {

          window[
            callbackName
          ] =
            undefined;

        }

      }


      window[
        callbackName
      ] =
        function(datos) {

          if (
            terminado
          ) {

            return;

          }


          terminado =
            true;


          limpiar();


          resolve(
            datos
          );

        };


      script.onerror =
        function() {

          if (
            terminado
          ) {

            return;

          }


          terminado =
            true;


          limpiar();


          reject(
            new Error(
              "No se pudo conectar"
            )
          );

        };


      const separador =
        url.includes("?")
          ? "&"
          : "?";


      script.src =
        url +
        separador +
        "callback=" +
        encodeURIComponent(
          callbackName
        ) +
        "&_cache=" +
        Date.now();


      document.body.appendChild(
        script
      );

    }
  );

}


// ==================================================
// JSONP CON REINTENTO
// ==================================================

async function jsonpConReintento(
  url,
  intentos = 2
) {

  let ultimoError =
    null;


  for (
    let intento = 1;
    intento <= intentos;
    intento++
  ) {

    try {

      return await jsonp(
        url
      );

    } catch (error) {

      ultimoError =
        error;

      console.log(
        "Intento " +
        intento +
        " de " +
        intentos +
        " falló:",
        error
      );


      if (
        intento < intentos
      ) {

        await new Promise(
          function(resolve) {

            setTimeout(
              resolve,
              1000
            );

          }
        );

      }

    }

  }


  throw (
    ultimoError ||
    new Error(
      "No se pudo completar la solicitud"
    )
  );

}


// ==================================================
// CARGAR TRABAJADORES
// ==================================================

async function cargarTrabajadores() {

  const estado =
    document.getElementById(
      "estado"
    );


  let trabajadoresInternet =
    [];


  if (
    navigator.onLine
  ) {

    try {

      const lista =
        await jsonp(

          URL_APPS_SCRIPT +
          "?action=trabajadores"

        );


      if (
        !Array.isArray(
          lista
        )
      ) {

        throw new Error(
          "Respuesta incorrecta"
        );

      }


      trabajadoresInternet =
        lista;


      localStorage.setItem(

        "trabajadores",

        JSON.stringify(
          trabajadoresInternet
        )

      );

    } catch (error) {

      console.log(
        "Error trabajadores:",
        error
      );

    }

  }


  if (
    trabajadoresInternet.length === 0
  ) {

    const guardados =
      localStorage.getItem(
        "trabajadores"
      );


    if (
      guardados
    ) {

      try {

        trabajadoresInternet =
          JSON.parse(
            guardados
          );

      } catch (error) {

        console.error(
          error
        );

      }

    }

  }


  const nuevosLocales =
    await obtenerDeAlmacen(
      STORE_TRABAJADORES
    );


  trabajadores =
    [
      ...trabajadoresInternet,
      ...nuevosLocales
    ];


  const codigos =
    new Set();


  trabajadores =
    trabajadores.filter(
      function(t) {

        const codigo =
          String(
            t.codigo
          )
            .trim()
            .toLowerCase();


        if (
          codigos.has(
            codigo
          )
        ) {

          return false;

        }


        codigos.add(
          codigo
        );


        return true;

      }
    );


  trabajadores.sort(
    function(a, b) {

      return String(
        a.nombre
      ).localeCompare(

        String(
          b.nombre
        ),

        "es"

      );

    }
  );


  if (
    !navigator.onLine
  ) {

    estado.textContent =
      "Trabajadores disponibles sin Internet";

  }

}


// ==================================================
// ABRIR LISTA TRABAJADORES
// ==================================================

async function abrirSeleccionTrabajador() {

  ocultarPantallas();


  document
    .getElementById(
      "pantallaTrabajadores"
    )
    .classList.remove(
      "oculto"
    );


  await cargarTrabajadores();


  mostrarListaTrabajadores();

}


// ==================================================
// MOSTRAR LISTA
// ==================================================

function mostrarListaTrabajadores() {

  const lista =
    document.getElementById(
      "listaTrabajadores"
    );


  lista.innerHTML =
    "";


  if (
    trabajadores.length === 0
  ) {

    lista.textContent =
      "No hay trabajadores disponibles";

    return;

  }


  trabajadores.forEach(
    function(trabajador) {

      const boton =
        document.createElement(
          "button"
        );


      boton.className =
        "trabajadorItem";


      boton.type =
        "button";


      boton.textContent =
        trabajador.codigo +
        " - " +
        trabajador.nombre;


      boton.onclick =
        function() {

          seleccionarTrabajador(
            trabajador
          );

        };


      lista.appendChild(
        boton
      );

    }
  );

}


// ==================================================
// SELECCIONAR TRABAJADOR
// ==================================================

async function seleccionarTrabajador(
  trabajador
) {

  trabajadorSeleccionado =
    trabajador;


  ocultarPantallas();


  document
    .getElementById(
      "pantallaFormulario"
    )
    .classList.remove(
      "oculto"
    );


  document
    .getElementById(
      "trabajadorSeleccionado"
    )
    .textContent =
      trabajador.nombre;


  document
    .getElementById(
      "peso"
    )
    .value =
      "";


  document
    .getElementById(
      "jornada"
    )
    .value =
      "";


  await mostrarRegistrosTrabajador(
    trabajador.codigo
  );


  setTimeout(
    function() {

      document
        .getElementById(
          "peso"
        )
        .focus();

    },
    100
  );

}


// ==================================================
// OBTENER SIGUIENTE CÓDIGO LOCAL
// ==================================================

function obtenerSiguienteCodigoLocal() {

  let mayor =
    0;


  trabajadores.forEach(
    function(t) {

      const numero =
        parseInt(
          String(
            t.codigo || ""
          ).trim(),
          10
        );


      if (
        !isNaN(numero) &&
        numero > mayor
      ) {

        mayor =
          numero;

      }

    }
  );


  return String(
    mayor + 1
  );

}


// ==================================================
// OBTENER SIGUIENTE CÓDIGO DESDE GOOGLE SHEETS
// ==================================================

async function obtenerSiguienteCodigoRemoto() {

  if (
    !navigator.onLine
  ) {

    return obtenerSiguienteCodigoLocal();

  }


  const resultado =
    await jsonp(
      URL_APPS_SCRIPT +
      "?action=siguienteCodigo&_=" +
      Date.now()
    );


  if (
    !resultado ||
    resultado.ok !== true ||
    !resultado.codigo
  ) {

    throw new Error(
      resultado &&
      resultado.error
        ? resultado.error
        : "No se pudo obtener el siguiente código desde Google Sheets"
    );

  }


  return String(
    resultado.codigo
  ).trim();

}


// ==================================================
// ABRIR AGREGAR TRABAJADOR
// ==================================================

async function abrirAgregarTrabajador() {

  ocultarPantallas();


  document
    .getElementById(
      "pantallaAgregar"
    )
    .classList.remove(
      "oculto"
    );


  const campoCodigo =
    document.getElementById(
      "nuevoCodigo"
    );


  const campoNombre =
    document.getElementById(
      "nuevoNombre"
    );


  campoCodigo.value =
    "Cargando...";


  campoNombre.value =
    "";


  try {

    campoCodigo.value =
      await obtenerSiguienteCodigoRemoto();

  } catch (error) {

    console.error(
      "No se pudo obtener el código desde Google Sheets:",
      error
    );


    campoCodigo.value =
      obtenerSiguienteCodigoLocal();

  }


  campoNombre.focus();

}


// ==================================================
// GUARDAR NUEVO TRABAJADOR
// ==================================================

async function guardarNuevoTrabajador() {

  const estado =
    document.getElementById(
      "estado"
    );


  const nombre =
    document
      .getElementById(
        "nuevoNombre"
      )
      .value
      .trim();


  let codigo =
    document
      .getElementById(
        "nuevoCodigo"
      )
      .value
      .trim();


  if (!nombre) {

    estado.textContent =
      "Ingrese el nombre del trabajador";

    return;

  }


  // Con Internet, Google Sheets es la fuente de verdad.
  if (
    navigator.onLine
  ) {

    try {

      codigo =
        await obtenerSiguienteCodigoRemoto();


      document
        .getElementById(
          "nuevoCodigo"
        )
        .value =
        codigo;

    } catch (error) {

      console.error(
        "No se pudo actualizar el código desde Google Sheets:",
        error
      );

    }

  }


  if (
    !codigo ||
    codigo === "Cargando..."
  ) {

    codigo =
      obtenerSiguienteCodigoLocal();

  }


  const existe =
    trabajadores.find(
      function(t) {

        return (
          String(
            t.codigo || ""
          )
            .trim()
            .toLowerCase()
          ===
          codigo.toLowerCase()
        );

      }
    );


  if (
    existe
  ) {

    estado.textContent =
      "Ese código ya existe. Actualice la lista e intente nuevamente.";

    return;

  }


  const trabajador = {

    id:
      "LOCAL-T-" +
      Date.now() +
      "-" +
      Math
        .random()
        .toString(36)
        .substring(
          2,
          8
        ),

    codigo:
      codigo,

    nombre:
      nombre

  };


  try {

    await guardarEnAlmacen(
      STORE_TRABAJADORES,
      trabajador
    );


    trabajadores.push(
      trabajador
    );


    estado.textContent =
      "✓ Trabajador guardado en la tablet";


    if (
      navigator.onLine
    ) {

      try {

        await sincronizarTrabajadores();


        await cargarTrabajadores();


        estado.textContent =
          "✓ Trabajador sincronizado";

      } catch (error) {

        console.error(
          "No se pudo sincronizar trabajador:",
          error
        );


        estado.textContent =
          "✓ Guardado en la tablet. Pendiente de sincronización";

      }

    }


    abrirSeleccionTrabajador();


  } catch (error) {

    console.error(
      error
    );


    estado.textContent =
      "No se pudo guardar el trabajador";

  }

}


// ==================================================
// CREAR REGISTRO
// ==================================================

function crearRegistro(
  peso,
  jornada
) {

  if (
    !trabajadorSeleccionado
  ) {

    throw new Error(
      "Seleccione un trabajador"
    );

  }


  const ahora =
    new Date();


  return {

    id:

      Date.now() +
      "-" +
      Math
        .random()
        .toString(36)
        .substring(2, 8),


    fechaHora:
      ahora.toISOString(),


    fechaLocal:
      obtenerFechaLocal(
        ahora
      ),


    codigo:
      trabajadorSeleccionado.codigo,


    peso:
      peso,


    jornada:
      jornada,


    sincronizado:
      false

  };

}


// ==================================================
// GUARDAR REGISTRO FORMULARIO
// ==================================================

async function guardarRegistroFormulario() {

  const estado =
    document.getElementById(
      "estado"
    );


  if (
    !trabajadorSeleccionado
  ) {

    estado.textContent =
      "Seleccione un trabajador";

    return;

  }


  const valorPeso =
    document
      .getElementById(
        "peso"
      )
      .value;


  const jornada =
    document
      .getElementById(
        "jornada"
      )
      .value;


  if (

    valorPeso === "" &&

    jornada === ""

  ) {

    estado.textContent =
      "Ingrese un peso o seleccione una jornada";

    return;

  }


  let peso =
    "";


  if (
    valorPeso !== ""
  ) {

    peso =
      Number(

        String(
          valorPeso
        )
          .replace(
            ",",
            "."
          )

      );


    if (

      isNaN(
        peso
      )

      ||

      peso <= 0

    ) {

      estado.textContent =
        "Ingrese un peso válido";

      return;

    }

  }


  try {

    const registro =
      crearRegistro(
        peso,
        jornada
      );


    await guardarRegistroLocal(
      registro
    );


    document
      .getElementById(
        "peso"
      )
      .value =
      "";


    document
      .getElementById(
        "jornada"
      )
      .value =
      "";


    await mostrarRegistrosTrabajador(
      trabajadorSeleccionado.codigo
    );


    document
      .getElementById(
        "peso"
      )
      .focus();


  } catch (error) {

    console.error(
      error
    );


    estado.textContent =
      error.message;

  }

}


// ==================================================
// GUARDAR REGISTRO LOCAL
// ==================================================

async function guardarRegistroLocal(
  registro
) {

  const estado =
    document.getElementById(
      "estado"
    );


  await guardarEnAlmacen(

    STORE_REGISTROS,

    registro

  );


  await actualizarPendientes();


  estado.textContent =
    "✓ Registro guardado en la tablet";


  if (
    navigator.onLine
  ) {

    try {

      await sincronizar();


      estado.textContent =
        "✓ Registro guardado y sincronizado";

    } catch (error) {

      console.error(
        "Sincronización después de guardar:",
        error
      );


      estado.textContent =
        "✓ Guardado en la tablet. Pendiente de sincronización";

    }

  }

}


// ==================================================
// SINCRONIZAR TRABAJADOR
// ==================================================

async function sincronizarTrabajador(
  trabajador
) {

  const url =

    URL_APPS_SCRIPT +

    "?action=agregarTrabajador" +

    "&id=" +

    encodeURIComponent(
      trabajador.id
    ) +

    "&codigo=" +

    encodeURIComponent(
      trabajador.codigo || ""
    ) +

    "&nombre=" +

    encodeURIComponent(
      trabajador.nombre
    );


  const resultado =
    await jsonpConReintento(
      url
    );


  if (
    !resultado ||
    resultado.ok !== true
  ) {

    throw new Error(
      resultado &&
      resultado.error
        ? resultado.error
        : "No se pudo sincronizar el trabajador"
    );

  }


  return resultado;

}


// ==================================================
// SINCRONIZAR TRABAJADORES
// ==================================================

async function sincronizarTrabajadores() {

  if (
    !navigator.onLine
  ) {

    return 0;

  }


  const pendientes =
    await obtenerDeAlmacen(
      STORE_TRABAJADORES
    );


  let sincronizados =
    0;


  for (
    const trabajador
    of pendientes
  ) {

    const nombre =
      trabajador.nombre ||
      trabajador.codigo ||
      trabajador.id;


    document
      .getElementById(
        "estado"
      )
      .textContent =
      "Sincronizando trabajador: " +
      nombre;


    try {

      const resultado =
        await sincronizarTrabajador(
          trabajador
        );


      // Si el servidor asignó/confirmó un código diferente,
      // actualizamos el trabajador local para mantenerlo consistente.
      if (
        resultado &&
        resultado.trabajador
      ) {

        const trabajadorServidor =
          resultado.trabajador;

        const cambioCodigo =
          trabajadorServidor.codigo &&
          String(
            trabajadorServidor.codigo
          ) !== String(
            trabajador.codigo || ""
          );


        if (
          cambioCodigo
        ) {

          trabajador.codigo =
            String(
              trabajadorServidor.codigo
            );

        }

      }


      await eliminarDeAlmacen(
        STORE_TRABAJADORES,
        trabajador.id
      );


      sincronizados++;

    } catch (error) {

      throw new Error(
        "Trabajador " +
        nombre +
        ": " +
        error.message
      );

    }

  }


  return sincronizados;

}


// ==================================================
// SINCRONIZAR UN REGISTRO
// ==================================================

async function sincronizarRegistro(
  registro
) {

  if (
    registro.sincronizado === true
  ) {

    return true;

  }


  const url =

    URL_APPS_SCRIPT +

    "?action=guardar" +

    "&id=" +

    encodeURIComponent(
      registro.id
    ) +

    "&fechaHora=" +

    encodeURIComponent(
      registro.fechaHora || ""
    ) +

    "&codigo=" +

    encodeURIComponent(
      registro.codigo || ""
    ) +

    "&peso=" +

    encodeURIComponent(
      registro.peso === undefined ||
      registro.peso === null
        ? ""
        : registro.peso
    ) +

    "&jornada=" +

    encodeURIComponent(
      registro.jornada === undefined ||
      registro.jornada === null
        ? ""
        : registro.jornada
    );


  const resultado =
    await jsonpConReintento(
      url
    );


  if (
    !resultado ||
    resultado.ok !== true
  ) {

    throw new Error(
      resultado &&
      resultado.error
        ? resultado.error
        : "No se pudo sincronizar"
    );

  }


  // Solo marcamos como sincronizado después de recibir OK del servidor.
  registro.sincronizado =
    true;


  await guardarEnAlmacen(
    STORE_REGISTROS,
    registro
  );


  return true;

}


// ==================================================
// SINCRONIZAR REGISTROS
// ==================================================

async function sincronizarRegistros() {

  if (
    !navigator.onLine
  ) {

    return 0;

  }


  const registros =
    await obtenerDeAlmacen(
      STORE_REGISTROS
    );


  let sincronizados =
    0;


  for (
    const registro
    of registros
  ) {

    if (
      registro.sincronizado === true
    ) {

      continue;

    }


    document
      .getElementById(
        "estado"
      )
      .textContent =
      "Sincronizando pesaje: " +
      String(
        registro.codigo || ""
      ) +
      " - " +
      String(
        registro.peso || ""
      ) +
      " kg";


    try {

      await sincronizarRegistro(
        registro
      );

      sincronizados++;

    } catch (error) {

      throw new Error(
        "Pesaje " +
        String(
          registro.id
        ) +
        ": " +
        error.message
      );

    }

  }


  await actualizarPendientes();


  return sincronizados;

}


// ==================================================
// SINCRONIZACIÓN COMPLETA
// ==================================================

async function sincronizar() {

  if (
    !navigator.onLine
  ) {

    return;

  }


  // Si ya existe una sincronización en curso, reutilizamos esa misma promesa.
  if (
    sincronizacionEnCurso
  ) {

    return await sincronizacionEnCurso;

  }


  sincronizacionEnCurso =
    (async function() {

      const estado =
        document.getElementById(
          "estado"
        );


      estado.textContent =
        "Sincronizando...";


      try {

        await sincronizarTrabajadores();


        await sincronizarRegistros();


        await cargarTrabajadores();


        await actualizarPendientes();


        estado.textContent =
          "✓ Todo sincronizado";

      } catch (error) {

        console.error(
          "Error de sincronización:",
          error
        );


        await actualizarPendientes();


        throw error;

      }

    })();


  try {

    return await sincronizacionEnCurso;

  } finally {

    sincronizacionEnCurso =
      null;

  }

}


// ==================================================
// ACTUALIZAR PENDIENTES
// ==================================================

async function actualizarPendientes() {

  try {

    const registros =
      await obtenerDeAlmacen(
        STORE_REGISTROS
      );


    const trabajadoresPendientes =
      await obtenerDeAlmacen(
        STORE_TRABAJADORES
      );


    const registrosPendientes =
      registros.filter(
        function(registro) {

          return (
            registro.sincronizado !== true
          );

        }
      );


    document
      .getElementById(
        "pendientes"
      )
      .textContent =

      "Pendientes de sincronización: " +

      (
        registrosPendientes.length +

        trabajadoresPendientes.length
      );


  } catch (error) {

    console.error(
      error
    );

  }

}


// ==================================================
// MOSTRAR REGISTROS DEL TRABAJADOR
// SOLO DEL DÍA ACTUAL
// ==================================================

async function mostrarRegistrosTrabajador(
  codigo
) {

  const lista =
    document.getElementById(
      "listaRegistros"
    );


  const totalPantalla =
    document.getElementById(
      "totalTrabajador"
    );


  try {

    const registros =
      await obtenerDeAlmacen(
        STORE_REGISTROS
      );


    const hoy =
      obtenerFechaLocal();


    const registrosTrabajador =
      registros.filter(
        function(registro) {

          const mismoCodigo =

            String(
              registro.codigo
            )
              .trim()
              .toLowerCase()

            ===

            String(
              codigo
            )
              .trim()
              .toLowerCase();


          let fechaRegistro =
            registro.fechaLocal;


          if (
            !fechaRegistro
          ) {

            fechaRegistro =
              obtenerFechaLocal(
                registro.fechaHora
              );

          }


          return (

            mismoCodigo &&

            fechaRegistro === hoy

          );

        }
      );


    registrosTrabajador.sort(
      function(a, b) {

        return new Date(
          b.fechaHora
        ) - new Date(
          a.fechaHora
        );

      }
    );


    lista.innerHTML =
      "";


    let total =
      0;


    if (
      registrosTrabajador.length === 0
    ) {

      lista.textContent =
        "No hay registros hoy";

    }


    registrosTrabajador.forEach(
      function(registro) {

        const fila =
          document.createElement(
            "div"
          );


        fila.className =
          "registro";


        const informacion =
          document.createElement(
            "div"
          );


        informacion.className =
          "infoRegistro";


        let texto =
          "";


        if (

          registro.peso !== "" &&

          registro.peso !== null &&

          registro.peso !== undefined

        ) {

          const numero =
            Number(
              registro.peso
            );


          if (
            !isNaN(
              numero
            )
          ) {

            total +=
              numero;

          }


          texto +=
            registro.peso +
            " kg";

        }


        if (
          registro.jornada
        ) {

          if (
            texto
          ) {

            texto +=
              " - ";

          }


          texto +=
            registro.jornada;

        }


        if (
          registro.sincronizado === true
        ) {

          texto +=
            " ✓";

        } else {

          texto +=
            " ⏳";

        }


        informacion.textContent =
          texto;



        fila.appendChild(
          informacion
        );


        lista.appendChild(
          fila
        );

      }
    );


    totalPantalla.textContent =

      "Total: " +

      total +

      " kg";


  } catch (error) {

    console.error(
      error
    );


    lista.textContent =
      "No se pudieron cargar los registros";


    totalPantalla.textContent =
      "Total: 0 kg";

  }

}


// ==================================================
// DESCARGAR RESPALDO
// ==================================================

async function descargarRespaldo() {

  try {

    const registros =
      await obtenerDeAlmacen(
        STORE_REGISTROS
      );


    if (
      registros.length === 0
    ) {

      alert(
        "No hay registros guardados en la tablet"
      );

      return;

    }


    const encabezados =

      [
        "ID",
        "Fecha y hora",
        "Fecha",
        "Código trabajador",
        "Peso (kg)",
        "Jornada",
        "Sincronizado"
      ];


    const filas =
      registros.map(
        function(registro) {

          return [

            registro.id || "",

            registro.fechaHora || "",

            registro.fechaLocal || "",

            registro.codigo || "",

            registro.peso || "",

            registro.jornada || "",

            registro.sincronizado === true
              ? "SI"
              : "NO"

          ];

        }
      );


    const datos =
      [
        encabezados,
        ...filas
      ];


    const csv =
      datos
        .map(
          function(fila) {

            return fila
              .map(
                function(valor) {

                  const texto =
                    String(
                      valor
                    )
                      .replace(
                        /"/g,
                        '""'
                      );


                  return (
                    '"' +
                    texto +
                    '"'
                  );

                }
              )
              .join(
                ";"
              );

          }
        )
        .join(
          "\n"
        );


    const blob =
      new Blob(

        [
          "\uFEFF" +
          csv
        ],

        {
          type:
            "text/csv;charset=utf-8;"
        }

      );


    const url =
      URL.createObjectURL(
        blob
      );


    const enlace =
      document.createElement(
        "a"
      );


    enlace.href =
      url;


    enlace.download =

      "Respaldo_Control_Pesajes_" +

      obtenerFechaLocal() +

      ".csv";


    document.body.appendChild(
      enlace
    );


    enlace.click();


    document.body.removeChild(
      enlace
    );


    URL.revokeObjectURL(
      url
    );


    document
      .getElementById(
        "estado"
      )
      .textContent =
      "✓ Respaldo descargado";


  } catch (error) {

    console.error(
      error
    );


    alert(
      "No se pudo generar el respaldo"
    );

  }

}


// ==================================================
// VOLVER PRINCIPAL
// ==================================================

function volverPrincipal() {

  trabajadorSeleccionado =
    null;


  ocultarPantallas();


  document
    .getElementById(
      "pantallaPrincipal"
    )
    .classList.remove(
      "oculto"
    );

}


// ==================================================
// OCULTAR PANTALLAS
// ==================================================

function ocultarPantallas() {

  document
    .getElementById(
      "pantallaPrincipal"
    )
    .classList.add(
      "oculto"
    );


  document
    .getElementById(
      "pantallaTrabajadores"
    )
    .classList.add(
      "oculto"
    );


  document
    .getElementById(
      "pantallaAgregar"
    )
    .classList.add(
      "oculto"
    );


  document
    .getElementById(
      "pantallaFormulario"
    )
    .classList.add(
      "oculto"
    );

}


// ==================================================
// CUANDO VUELVE INTERNET
// ==================================================

window.addEventListener(

  "online",

  async function() {

    const estado =
      document.getElementById(
        "estado"
      );


    estado.textContent =
      "Internet disponible. Sincronizando...";


    try {

      await sincronizar();


      estado.textContent =
        "✓ Todo sincronizado";


      if (
        trabajadorSeleccionado
      ) {

        await mostrarRegistrosTrabajador(
          trabajadorSeleccionado.codigo
        );

      }


    } catch (error) {

      console.error(
        "Sincronización al volver Internet:",
        error
      );

      estado.textContent =
        "Sincronización pendiente: " +
        error.message;

    }

  }

);


// ==================================================
// SIN INTERNET
// ==================================================

window.addEventListener(

  "offline",

  function() {

    document
      .getElementById(
        "estado"
      )
      .textContent =
      "Sin Internet. Guardando en la tablet.";

  }

);


// ==================================================
// INICIAR APLICACIÓN
// ==================================================

async function iniciarAplicacion() {

  try {

    await cargarTrabajadores();

  } catch (error) {

    console.error(
      error
    );

  }


  try {

    await actualizarPendientes();

  } catch (error) {

    console.error(
      error
    );

  }


  if (
    navigator.onLine
  ) {

    try {

      document
        .getElementById(
          "estado"
        )
        .textContent =
        "Sincronizando...";


      await sincronizar();


      document
        .getElementById(
          "estado"
        )
        .textContent =
        "✓ Todo sincronizado";


    } catch (error) {

      console.log(
        "Error de sincronización inicial:",
        error
      );


      document
        .getElementById(
          "estado"
        )
        .textContent =
        "Sincronización pendiente: " +
        error.message;

    }

  }

}


// ==================================================
// INICIAR
// ==================================================

iniciarAplicacion();


</script>
