<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#333333">

<link rel="manifest"
      href="manifest.json">

<title>Control de Pesajes</title>


<style>

body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 20px;
  background: #f2f2f2;
}

.contenedor {
  max-width: 600px;
  margin: auto;
}

h1 {
  text-align: center;
}

.tarjeta {
  background: white;
  padding: 20px;
  border-radius: 12px;
  margin-top: 20px;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

input,
button {
  width: 100%;
  box-sizing: border-box;
  padding: 15px;
  margin-top: 8px;
  font-size: 18px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  cursor: pointer;
  font-weight: bold;
  margin-top: 20px;
}

#trabajador {
  margin-top: 10px;
  padding: 15px;
  background: #eee;
  border-radius: 8px;
  font-size: 18px;
}

#estado {
  text-align: center;
  margin-top: 20px;
  font-weight: bold;
}

#pendientes {
  text-align: center;
  margin-top: 10px;
}

</style>

</head>


<body>

<div class="contenedor">

<h1>CONTROL DE PESAJES</h1>

<div class="tarjeta">

<label>
Código del trabajador
</label>

<input
  id="codigo"
  type="text"
  placeholder="Ej: Trab001"
  autocomplete="off">

<div id="trabajador">
Trabajador no seleccionado
</div>


<label>
Kilos
</label>

<input
  id="kilos"
  type="number"
  step="0.1"
  placeholder="Ej: 84.5">


<button onclick="guardarPesaje()">
GUARDAR PESAJE
</button>


<div id="estado"></div>

<div id="pendientes">
Pendientes: 0
</div>

</div>

</div>


<script>


// ==========================================
// URL APPS SCRIPT
// ==========================================

const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbzs9dBMJotH8zBQNYeeOIdejzlTbPBRkw0IErt0Td9eiHmvy497j7Mu2XZJRzc2J_YWkQ/exec";


// ==========================================
// TRABAJADORES
// ==========================================

let trabajadores = [];


// ==========================================
// JSONP
// ==========================================

function jsonp(url) {

  return new Promise(function(resolve, reject) {

    const callbackName =
      "callback_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .substring(2);


    const script =
      document.createElement("script");


    const tiempo =
      setTimeout(function() {

        limpiar();

        reject(
          new Error(
            "Tiempo de espera agotado"
          )
        );

      }, 10000);


    function limpiar() {

      clearTimeout(tiempo);

      if (script.parentNode) {

        script.parentNode.removeChild(
          script
        );

      }

      try {

        delete window[
          callbackName
        ];

      } catch(error) {

        window[
          callbackName
        ] = undefined;

      }

    }


    window[callbackName] =
      function(datos) {

        limpiar();

        resolve(datos);

      };


    script.onerror =
      function() {

        limpiar();

        reject(
          new Error(
            "No se pudo conectar con Apps Script"
          )
        );

      };


    script.src =
      url +
      "&callback=" +
      encodeURIComponent(
        callbackName
      );


    document.body.appendChild(
      script
    );

  });

}


// ==========================================
// CARGAR TRABAJADORES
// ==========================================

async function cargarTrabajadores() {

  const estado =
    document.getElementById(
      "estado"
    );


  // ========================================
  // SI HAY INTERNET
  // ========================================

  if (navigator.onLine) {

    try {

      const lista =
        await jsonp(
          URL_APPS_SCRIPT +
          "?action=trabajadores"
        );


      if (!Array.isArray(lista)) {

        throw new Error(
          "Respuesta incorrecta"
        );

      }


      trabajadores =
        lista;


      // Guardar copia en dispositivo

      localStorage.setItem(
        "trabajadores",
        JSON.stringify(
          trabajadores
        )
      );


      estado.textContent =
        "✓ Trabajadores actualizados";


      console.log(
        "Trabajadores:",
        trabajadores
      );


      return;


    } catch(error) {

      console.log(
        "Error Internet:",
        error
      );

    }

  }


  // ========================================
  // COPIA LOCAL
  // ========================================

  const guardados =
    localStorage.getItem(
      "trabajadores"
    );


  if (guardados) {

    trabajadores =
      JSON.parse(
        guardados
      );


    estado.textContent =
      "✓ Trabajadores disponibles sin Internet";


  } else {

    estado.textContent =
      "No hay trabajadores guardados";

  }

}


// ==========================================
// BUSCAR TRABAJADOR
// ==========================================

document
  .getElementById("codigo")
  .addEventListener(
    "input",
    function() {

      buscarTrabajador(
        this.value
      );

    }
  );


function buscarTrabajador(
  codigo
) {

  codigo =
    codigo.trim();


  const trabajador =
    trabajadores.find(
      function(t) {

        return String(
          t.codigo
        )
        .toLowerCase()
        ===
        codigo.toLowerCase();

      }
    );


  const pantalla =
    document.getElementById(
      "trabajador"
    );


  if (trabajador) {

    pantalla.textContent =
      trabajador.nombre +
      " (" +
      trabajador.codigo +
      ")";


  } else if (codigo) {

    pantalla.textContent =
      "Trabajador no encontrado";


  } else {

    pantalla.textContent =
      "Trabajador no seleccionado";

  }

}


// ==========================================
// BASE DE DATOS LOCAL
// ==========================================

const DB_NAME =
"ControlPesajesDB";

const DB_VERSION =
1;

const STORE_NAME =
"pesajes";


function abrirBaseDatos() {

  return new Promise(
    function(resolve, reject) {

      const solicitud =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );


      solicitud.onupgradeneeded =
        function(event) {

          const db =
            event.target.result;


          if (
            !db.objectStoreNames
              .contains(
                STORE_NAME
              )
          ) {

            db.createObjectStore(
              STORE_NAME,
              {
                keyPath: "id"
              }
            );

          }

        };


      solicitud.onsuccess =
        function(event) {

          resolve(
            event.target.result
          );

        };


      solicitud.onerror =
        function() {

          reject(
            solicitud.error
          );

        };

    }
  );

}


// ==========================================
// GUARDAR LOCAL
// ==========================================

async function guardarLocal(
  registro
) {

  const db =
    await abrirBaseDatos();


  return new Promise(
    function(resolve, reject) {

      const transaccion =
        db.transaction(
          STORE_NAME,
          "readwrite"
        );


      const almacen =
        transaccion.objectStore(
          STORE_NAME
        );


      almacen.put(
        registro
      );


      transaccion.oncomplete =
        function() {

          resolve();

        };


      transaccion.onerror =
        function() {

          reject(
            transaccion.error
          );

        };

    }
  );

}


// ==========================================
// OBTENER PENDIENTES
// ==========================================

async function obtenerPendientes() {

  const db =
    await abrirBaseDatos();


  return new Promise(
    function(resolve, reject) {

      const transaccion =
        db.transaction(
          STORE_NAME,
          "readonly"
        );


      const almacen =
        transaccion.objectStore(
          STORE_NAME
        );


      const solicitud =
        almacen.getAll();


      solicitud.onsuccess =
        function() {

          resolve(
            solicitud.result
          );

        };


      solicitud.onerror =
        function() {

          reject(
            solicitud.error
          );

        };

    }
  );

}


// ==========================================
// ELIMINAR LOCAL
// ==========================================

async function eliminarLocal(
  id
) {

  const db =
    await abrirBaseDatos();


  return new Promise(
    function(resolve, reject) {

      const transaccion =
        db.transaction(
          STORE_NAME,
          "readwrite"
        );


      const almacen =
        transaccion.objectStore(
          STORE_NAME
        );


      almacen.delete(id);


      transaccion.oncomplete =
        function() {

          resolve();

        };


      transaccion.onerror =
        function() {

          reject(
            transaccion.error
          );

        };

    }
  );

}


// ==========================================
// CONTADOR
// ==========================================

async function actualizarPendientes() {

  try {

    const pendientes =
      await obtenerPendientes();


    document.getElementById(
      "pendientes"
    ).textContent =
      "Pendientes: " +
      pendientes.length;

  } catch(error) {

    console.log(error);

  }

}


// ==========================================
// GUARDAR PESAJE
// ==========================================

async function guardarPesaje() {

  const codigo =
    document.getElementById(
      "codigo"
    ).value.trim();


  const kilos =
    document.getElementById(
      "kilos"
    ).value;


  const estado =
    document.getElementById(
      "estado"
    );


  if (!codigo) {

    estado.textContent =
      "Ingrese el código";

    return;

  }


  if (!kilos || Number(kilos) <= 0) {

    estado.textContent =
      "Ingrese los kilos";

    return;

  }


  const trabajador =
    trabajadores.find(
      function(t) {

        return String(
          t.codigo
        )
        .toLowerCase()
        ===
        codigo.toLowerCase();

      }
    );


  if (!trabajador) {

    estado.textContent =
      "Trabajador no encontrado";

    return;

  }


  const registro = {

    id:
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2, 8),

    fechaHora:
      new Date().toISOString(),

    codigo:
      trabajador.codigo,

    kilos:
      Number(kilos)

  };


  try {

    await guardarLocal(
      registro
    );


    await actualizarPendientes();


    estado.textContent =
      "✓ Pesaje guardado";


    document.getElementById(
      "kilos"
    ).value = "";


    if (navigator.onLine) {

      sincronizar();

    }


  } catch(error) {

    estado.textContent =
      "Error al guardar";


    console.error(error);

  }

}


// ==========================================
// SINCRONIZAR UN PESAJE
// ==========================================

async function sincronizarRegistro(
  registro
) {

  const url =
    URL_APPS_SCRIPT +
    "?action=guardar" +
    "&id=" +
    encodeURIComponent(
      registro.id
    ) +
    "&fechaHora=" +
    encodeURIComponent(
      registro.fechaHora
    ) +
    "&codigo=" +
    encodeURIComponent(
      registro.codigo
    ) +
    "&kilos=" +
    encodeURIComponent(
      registro.kilos
    );


  const resultado =
    await jsonp(url);


  if (!resultado.ok) {

    throw new Error(
      resultado.error ||
      "No se pudo guardar"
    );

  }


  return true;

}


// ==========================================
// SINCRONIZAR
// ==========================================

async function sincronizar() {

  if (!navigator.onLine) {

    return;

  }


  const pendientes =
    await obtenerPendientes();


  for (
    const registro
    of pendientes
  ) {

    try {

      await sincronizarRegistro(
        registro
      );


      await eliminarLocal(
        registro.id
      );


    } catch(error) {

      console.log(
        "Pendiente:",
        error
      );


      break;

    }

  }


  await actualizarPendientes();

}


// ==========================================
// INTERNET
// ==========================================

window.addEventListener(
  "online",
  function() {

    document.getElementById(
      "estado"
    ).textContent =
      "Internet disponible. Sincronizando...";


    cargarTrabajadores();

    sincronizar();

  }
);


// ==========================================
// SIN INTERNET
// ==========================================

window.addEventListener(
  "offline",
  function() {

    document.getElementById(
      "estado"
    ).textContent =
      "Sin Internet. Trabajando localmente.";

  }
);


// ==========================================
// INICIAR
// ==========================================

cargarTrabajadores();

actualizarPendientes();


// ==========================================
// SERVICE WORKER
// ==========================================

if (
  "serviceWorker" in navigator
) {

  window.addEventListener(
    "load",
    function() {

      navigator.serviceWorker
        .register(
          "sw.js"
        );

    }
  );

}

</script>

</body>

</html>
