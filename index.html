<script>


// ==================================================
// URL GOOGLE APPS SCRIPT
// ==================================================

const URL_APPS_SCRIPT =
  "https://script.google.com/macros/s/AKfycbxCDWwilSh4v7eukRicKgGR0eEFbGlbYmxqlRVwTtOYsTvO26rHYp-T1iQTjUdh0kLg_w/exec";



// ==================================================
// TRABAJADORES
// ==================================================

let trabajadores = [];

let trabajadorSeleccionado = null;



// ==================================================
// BASE DE DATOS
// ==================================================

const DB_NAME =
  "ControlPesajesDB";

const DB_VERSION =
  5;



const STORE_REGISTROS =
  "pesajes";



const STORE_TRABAJADORES =
  "trabajadores";



// ==================================================
// ABRIR BASE DE DATOS
// ==================================================

function abrirBaseDatos() {

  return new Promise(
    function(resolve, reject) {

      let solicitud;

      try {

        solicitud =
          indexedDB.open(
            DB_NAME,
            DB_VERSION
          );

      } catch (error) {

        reject(error);

        return;

      }


      solicitud.onupgradeneeded =
        function(event) {

          const db =
            event.target.result;


          if (

            !db.objectStoreNames.contains(
              STORE_REGISTROS
            )

          ) {

            db.createObjectStore(

              STORE_REGISTROS,

              {
                keyPath: "id"
              }

            );

          }


          if (

            !db.objectStoreNames.contains(
              STORE_TRABAJADORES
            )

          ) {

            db.createObjectStore(

              STORE_TRABAJADORES,

              {
                keyPath: "id"
              }

            );

          }

        };


      solicitud.onsuccess =
        function(event) {

          resolve(
            event.target.result
          );

        };


      solicitud.onerror =
        function() {

          reject(
            solicitud.error
          );

        };


      solicitud.onblocked =
        function() {

          reject(
            new Error(
              "Base de datos bloqueada"
            )
          );

        };

    }
  );

}



// ==================================================
// GUARDAR EN ALMACÉN
// ==================================================

async function guardarEnAlmacen(
  almacenNombre,
  datos
) {

  const db =
    await abrirBaseDatos();


  return new Promise(
    function(resolve, reject) {

      const transaccion =
        db.transaction(
          almacenNombre,
          "readwrite"
        );


      const almacen =
        transaccion.objectStore(
          almacenNombre
        );


      almacen.put(
        datos
      );


      transaccion.oncomplete =
        function() {

          db.close();

          resolve();

        };


      transaccion.onerror =
        function() {

          db.close();

          reject(
            transaccion.error
          );

        };

    }
  );

}



// ==================================================
// OBTENER DE ALMACÉN
// ==================================================

async function obtenerDeAlmacen(
  almacenNombre
) {

  const db =
    await abrirBaseDatos();


  return new Promise(
    function(resolve, reject) {

      const transaccion =
        db.transaction(
          almacenNombre,
          "readonly"
        );


      const almacen =
        transaccion.objectStore(
          almacenNombre
        );


      const solicitud =
        almacen.getAll();


      solicitud.onsuccess =
        function() {

          const datos =
            solicitud.result ||
            [];


          db.close();

          resolve(
            datos
          );

        };


      solicitud.onerror =
        function() {

          db.close();

          reject(
            solicitud.error
          );

        };

    }
  );

}



// ==================================================
// ELIMINAR DE ALMACÉN
// ==================================================

async function eliminarDeAlmacen(
  almacenNombre,
  id
) {

  const db =
    await abrirBaseDatos();


  return new Promise(
    function(resolve, reject) {

      const transaccion =
        db.transaction(
          almacenNombre,
          "readwrite"
        );


      const almacen =
        transaccion.objectStore(
          almacenNombre
        );


      almacen.delete(
        id
      );


      transaccion.oncomplete =
        function() {

          db.close();

          resolve();

        };


      transaccion.onerror =
        function() {

          db.close();

          reject(
            transaccion.error
          );

        };

    }
  );

}



// ==================================================
// JSONP
// ==================================================

function jsonp(url) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        "callback_" +
        Date.now() +
        "_" +
        Math
          .random()
          .toString(36)
          .substring(2);


      const script =
        document.createElement(
          "script"
        );


      let terminado =
        false;


      const tiempo =
        setTimeout(

          function() {

            if (
              terminado
            ) {

              return;

            }


            terminado =
              true;


            limpiar();


            reject(
              new Error(
                "Tiempo de espera agotado"
              )
            );

          },

          15000

        );


      function limpiar() {

        clearTimeout(
          tiempo
        );


        if (
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }


        try {

          delete window[
            callbackName
          ];

        } catch (error) {

          window[
            callbackName
          ] =
            undefined;

        }

      }


      window[
        callbackName
      ] =
        function(datos) {

          if (
            terminado
          ) {

            return;

          }


          terminado =
            true;


          limpiar();


          resolve(
            datos
          );

        };


      script.onerror =
        function() {

          if (
            terminado
          ) {

            return;

          }


          terminado =
            true;


          limpiar();


          reject(
            new Error(
              "No se pudo conectar"
            )
          );

        };


      const separador =
        url.includes("?")
          ? "&"
          : "?";


      script.src =
        url +
        separador +
        "callback=" +
        encodeURIComponent(
          callbackName
        );


      document.body.appendChild(
        script
      );

    }
  );

}



// ==================================================
// CARGAR TRABAJADORES
// ==================================================

async function cargarTrabajadores() {

  const estado =
    document.getElementById(
      "estado"
    );


  let trabajadoresInternet =
    [];


  if (
    navigator.onLine
  ) {

    try {

      const lista =
        await jsonp(

          URL_APPS_SCRIPT +
          "?action=trabajadores"

        );


      if (
        !Array.isArray(
          lista
        )
      ) {

        throw new Error(
          "Respuesta incorrecta"
        );

      }


      trabajadoresInternet =
        lista;


      localStorage.setItem(

        "trabajadores",

        JSON.stringify(
          trabajadoresInternet
        )

      );

    } catch (error) {

      console.log(
        "Error trabajadores:",
        error
      );

    }

  }



  if (
    trabajadoresInternet.length === 0
  ) {

    const guardados =
      localStorage.getItem(
        "trabajadores"
      );


    if (
      guardados
    ) {

      try {

        trabajadoresInternet =
          JSON.parse(
            guardados
          );

      } catch (error) {

        console.error(
          error
        );

      }

    }

  }



  const nuevosLocales =
    await obtenerDeAlmacen(
      STORE_TRABAJADORES
    );


  trabajadores =
    [
      ...trabajadoresInternet,
      ...nuevosLocales
    ];



  const codigos =
    new Set();


  trabajadores =
    trabajadores.filter(
      function(t) {

        const codigo =
          String(
            t.codigo
          )
            .trim()
            .toLowerCase();


        if (
          codigos.has(
            codigo
          )
        ) {

          return false;

        }


        codigos.add(
          codigo
        );


        return true;

      }
    );



  trabajadores.sort(
    function(a, b) {

      return String(
        a.nombre
      ).localeCompare(

        String(
          b.nombre
        ),

        "es"

      );

    }
  );



  if (
    !navigator.onLine
  ) {

    estado.textContent =
      "Trabajadores disponibles sin Internet";

  }

}



// ==================================================
// ABRIR LISTA TRABAJADORES
// ==================================================

async function abrirSeleccionTrabajador() {

  ocultarPantallas();


  document
    .getElementById(
      "pantallaTrabajadores"
    )
    .classList.remove(
      "oculto"
    );


  await cargarTrabajadores();


  mostrarListaTrabajadores();

}



// ==================================================
// MOSTRAR LISTA
// ==================================================

function mostrarListaTrabajadores() {

  const lista =
    document.getElementById(
      "listaTrabajadores"
    );


  lista.innerHTML =
    "";


  if (
    trabajadores.length === 0
  ) {

    lista.textContent =
      "No hay trabajadores disponibles";

    return;

  }


  trabajadores.forEach(
    function(trabajador) {

      const boton =
        document.createElement(
          "button"
        );


      boton.className =
        "trabajadorItem";


      boton.type =
        "button";


      boton.textContent =
        trabajador.nombre;


      boton.onclick =
        function() {

          seleccionarTrabajador(
            trabajador
          );

        };


      lista.appendChild(
        boton
      );

    }
  );

}



// ==================================================
// SELECCIONAR TRABAJADOR
// ==================================================

async function seleccionarTrabajador(
  trabajador
) {

  trabajadorSeleccionado =
    trabajador;


  ocultarPantallas();


  document
    .getElementById(
      "pantallaFormulario"
    )
    .classList.remove(
      "oculto"
    );


  document
    .getElementById(
      "trabajadorSeleccionado"
    )
    .textContent =
      trabajador.nombre;


  document
    .getElementById(
      "peso"
    )
    .value =
      "";


  document
    .getElementById(
      "jornada"
    )
    .value =
      "";


  await mostrarRegistrosTrabajador(
    trabajador.codigo
  );


  setTimeout(
    function() {

      document
        .getElementById(
          "peso"
        )
        .focus();

    },
    100
  );

}



// ==================================================
// ABRIR AGREGAR TRABAJADOR
// ==================================================

function abrirAgregarTrabajador() {

  ocultarPantallas();


  document
    .getElementById(
      "pantallaAgregar"
    )
    .classList.remove(
      "oculto"
    );


  document
    .getElementById(
      "nuevoCodigo"
    )
    .value =
      "";


  document
    .getElementById(
      "nuevoNombre"
    )
    .value =
      "";

}



// ==================================================
// GUARDAR NUEVO TRABAJADOR
// ==================================================

async function guardarNuevoTrabajador() {

  const estado =
    document.getElementById(
      "estado"
    );


  const codigo =
    document
      .getElementById(
        "nuevoCodigo"
      )
      .value
      .trim();


  const nombre =
    document
      .getElementById(
        "nuevoNombre"
      )
      .value
      .trim();


  if (
    !codigo
  ) {

    estado.textContent =
      "Ingrese el código del trabajador";

    return;

  }


  if (
    !nombre
  ) {

    estado.textContent =
      "Ingrese el nombre del trabajador";

    return;

  }


  const existe =
    trabajadores.find(
      function(t) {

        return (

          String(
            t.codigo
          )
            .trim()
            .toLowerCase()

          ===

          codigo
            .toLowerCase()

        );

      }
    );


  if (
    existe
  ) {

    estado.textContent =
      "Ese código ya existe";

    return;

  }


  const trabajador = {

    id:

      "LOCAL-T-" +
      Date.now() +
      "-" +
      Math
        .random()
        .toString(36)
        .substring(2, 8),


    codigo:
      codigo,


    nombre:
      nombre

  };


  try {

    await guardarEnAlmacen(

      STORE_TRABAJADORES,

      trabajador

    );


    trabajadores.push(
      trabajador
    );


    trabajadores.sort(
      function(a, b) {

        return String(
          a.nombre
        ).localeCompare(

          String(
            b.nombre
          ),

          "es"

        );

      }
    );


    estado.textContent =
      "✓ Trabajador guardado en la tablet";


    if (
      navigator.onLine
    ) {

      try {

        await sincronizarTrabajadores();


        await cargarTrabajadores();


        estado.textContent =
          "✓ Trabajador sincronizado";

      } catch (error) {

        console.log(
          error
        );


        estado.textContent =
          "✓ Trabajador guardado. Pendiente de sincronización";

      }

    }


    abrirSeleccionTrabajador();


  } catch (error) {

    console.error(
      error
    );


    estado.textContent =
      "No se pudo guardar el trabajador";

  }

}



// ==================================================
// CREAR REGISTRO
// ==================================================

function crearRegistro(
  peso,
  jornada
) {

  if (
    !trabajadorSeleccionado
  ) {

    throw new Error(
      "Seleccione un trabajador"
    );

  }


  return {

    id:

      Date.now() +
      "-" +
      Math
        .random()
        .toString(36)
        .substring(2, 8),


    fechaHora:
      new Date()
        .toISOString(),


    codigo:
      trabajadorSeleccionado.codigo,


    peso:
      peso,


    jornada:
      jornada

  };

}



// ==================================================
// GUARDAR REGISTRO FORMULARIO
// ==================================================

async function guardarRegistroFormulario() {

  const estado =
    document.getElementById(
      "estado"
    );


  if (
    !trabajadorSeleccionado
  ) {

    estado.textContent =
      "Seleccione un trabajador";

    return;

  }


  const valorPeso =
    document
      .getElementById(
        "peso"
      )
      .value;


  const jornada =
    document
      .getElementById(
        "jornada"
      )
      .value;



  // VALIDAR

  if (

    valorPeso === "" &&

    jornada === ""

  ) {

    estado.textContent =
      "Ingrese un peso o seleccione una jornada";

    return;

  }


  let peso =
    "";


  if (
    valorPeso !== ""
  ) {

    peso =
      Number(

        String(
          valorPeso
        )
          .replace(
            ",",
            "."
          )

      );


    if (

      isNaN(
        peso
      )

      ||

      peso <= 0

    ) {

      estado.textContent =
        "Ingrese un peso válido";

      return;

    }

  }


  try {

    const registro =
      crearRegistro(
        peso,
        jornada
      );


    await guardarRegistroLocal(
      registro
    );



    // ================================================
    // SOLO LIMPIAR PESO
    // ================================================

    document
      .getElementById(
        "peso"
      )
      .value =
        "";



    // ================================================
    // SOLO LIMPIAR JORNADA
    // ================================================

    document
      .getElementById(
        "jornada"
      )
      .value =
        "";



    // ================================================
    // EL TRABAJADOR SIGUE SELECCIONADO
    // ================================================


    await mostrarRegistrosTrabajador(
      trabajadorSeleccionado.codigo
    );



    // ================================================
    // VOLVER AUTOMÁTICAMENTE AL CAMPO PESO
    // ================================================

    document
      .getElementById(
        "peso"
      )
      .focus();


  } catch (error) {

    console.error(
      error
    );


    estado.textContent =
      error.message;

  }

}



// ==================================================
// GUARDAR REGISTRO LOCAL
// ==================================================

async function guardarRegistroLocal(
  registro
) {

  const estado =
    document.getElementById(
      "estado"
    );


  await guardarEnAlmacen(

    STORE_REGISTROS,

    registro

  );


  await actualizarPendientes();


  estado.textContent =
    "✓ Registro guardado en la tablet";


  if (
    navigator.onLine
  ) {

    try {

      await sincronizarTrabajadores();


      await sincronizarRegistros();


      estado.textContent =
        "✓ Registro sincronizado";


    } catch (error) {

      console.log(
        error
      );


      estado.textContent =
        "✓ Guardado en la tablet. Pendiente de sincronización";

    }

  }

}



// ==================================================
// SINCRONIZAR UN TRABAJADOR
// ==================================================

async function sincronizarTrabajador(
  trabajador
) {

  const url =

    URL_APPS_SCRIPT +

    "?action=agregarTrabajador" +

    "&id=" +

    encodeURIComponent(
      trabajador.id
    ) +

    "&codigo=" +

    encodeURIComponent(
      trabajador.codigo
    ) +

    "&nombre=" +

    encodeURIComponent(
      trabajador.nombre
    );


  const resultado =
    await jsonp(
      url
    );


  if (

    !resultado ||

    resultado.ok !== true

  ) {

    throw new Error(

      resultado &&
      resultado.error

        ?

        resultado.error

        :

        "No se pudo sincronizar el trabajador"

    );

  }


  return resultado;

}



// ==================================================
// SINCRONIZAR TRABAJADORES
// ==================================================

async function sincronizarTrabajadores() {

  if (
    !navigator.onLine
  ) {

    return;

  }


  const pendientes =
    await obtenerDeAlmacen(
      STORE_TRABAJADORES
    );


  for (

    const trabajador

    of pendientes

  ) {

    try {

      await sincronizarTrabajador(
        trabajador
      );


      await eliminarDeAlmacen(

        STORE_TRABAJADORES,

        trabajador.id

      );


    } catch (error) {

      console.log(
        "No se pudo sincronizar trabajador:",
        error
      );


      break;

    }

  }


  const restantes =
    await obtenerDeAlmacen(
      STORE_TRABAJADORES
    );


  return restantes;

}



// ==================================================
// SINCRONIZAR UN REGISTRO
// ==================================================

async function sincronizarRegistro(
  registro
) {

  const url =

    URL_APPS_SCRIPT +

    "?action=guardar" +

    "&id=" +

    encodeURIComponent(
      registro.id
    ) +

    "&fechaHora=" +

    encodeURIComponent(
      registro.fechaHora
    ) +

    "&codigo=" +

    encodeURIComponent(
      registro.codigo
    ) +

    "&peso=" +

    encodeURIComponent(

      registro.peso === undefined ||

      registro.peso === null

        ?

        ""

        :

        registro.peso

    ) +

    "&jornada=" +

    encodeURIComponent(

      registro.jornada === undefined ||

      registro.jornada === null

        ?

        ""

        :

        registro.jornada

    );


  const resultado =
    await jsonp(
      url
    );


  if (

    !resultado ||

    resultado.ok !== true

  ) {

    throw new Error(

      resultado &&
      resultado.error

        ?

        resultado.error

        :

        "No se pudo sincronizar"

    );

  }


  return true;

}



// ==================================================
// SINCRONIZAR REGISTROS
// ==================================================

async function sincronizarRegistros() {

  if (
    !navigator.onLine
  ) {

    return;

  }


  const pendientes =
    await obtenerDeAlmacen(
      STORE_REGISTROS
    );


  for (

    const registro

    of pendientes

  ) {

    try {

      await sincronizarRegistro(
        registro
      );


      await eliminarDeAlmacen(

        STORE_REGISTROS,

        registro.id

      );


    } catch (error) {

      console.log(
        "No se pudo sincronizar:",
        error
      );


      break;

    }

  }


  await actualizarPendientes();

}



// ==================================================
// SINCRONIZACIÓN COMPLETA
// ==================================================

async function sincronizar() {

  if (
    !navigator.onLine
  ) {

    return;

  }


  await sincronizarTrabajadores();


  await sincronizarRegistros();


  await cargarTrabajadores();

}



// ==================================================
// ACTUALIZAR PENDIENTES
// ==================================================

async function actualizarPendientes() {

  try {

    const registros =
      await obtenerDeAlmacen(
        STORE_REGISTROS
      );


    const trabajadoresPendientes =
      await obtenerDeAlmacen(
        STORE_TRABAJADORES
      );


    document
      .getElementById(
        "pendientes"
      )
      .textContent =

      "Pendientes de sincronización: " +

      (
        registros.length +

        trabajadoresPendientes.length
      );


  } catch (error) {

    console.error(
      error
    );

  }

}



// ==================================================
// MOSTRAR REGISTROS DEL TRABAJADOR
// ==================================================

async function mostrarRegistrosTrabajador(
  codigo
) {

  const lista =
    document.getElementById(
      "listaRegistros"
    );


  const totalPantalla =
    document.getElementById(
      "totalTrabajador"
    );


  try {

    const registros =
      await obtenerDeAlmacen(
        STORE_REGISTROS
      );


    const registrosTrabajador =
      registros.filter(
        function(registro) {

          return (

            String(
              registro.codigo
            )
              .trim()
              .toLowerCase()

            ===

            String(
              codigo
            )
              .trim()
              .toLowerCase()

          );

        }
      );


    lista.innerHTML =
      "";


    let total =
      0;


    if (
      registrosTrabajador.length === 0
    ) {

      lista.textContent =
        "No hay registros locales pendientes";

    }


    registrosTrabajador.forEach(
      function(registro) {

        const fila =
          document.createElement(
            "div"
          );


        fila.className =
          "registro";


        const informacion =
          document.createElement(
            "div"
          );


        informacion.className =
          "infoRegistro";


        let texto =
          "";


        if (

          registro.peso !== "" &&

          registro.peso !== null &&

          registro.peso !== undefined

        ) {

          const numero =
            Number(
              registro.peso
            );


          if (
            !isNaN(
              numero
            )
          ) {

            total +=
              numero;

          }


          texto +=
            registro.peso +
            " kg";

        }


        if (
          registro.jornada
        ) {

          if (
            texto
          ) {

            texto +=
              " - ";

          }


          texto +=
            registro.jornada;

        }


        informacion.textContent =
          texto;


        const boton =
          document.createElement(
            "button"
          );


        boton.className =
          "botonEliminar";


        boton.textContent =
          "❌";


        boton.type =
          "button";


        boton.onclick =
          async function() {

            if (

              confirm(
                "¿Eliminar este registro?"
              )

            ) {

              try {

                await eliminarDeAlmacen(

                  STORE_REGISTROS,

                  registro.id

                );


                await actualizarPendientes();


                await mostrarRegistrosTrabajador(
                  codigo
                );


              } catch (error) {

                alert(
                  "No se pudo eliminar el registro"
                );

              }

            }

          };


        fila.appendChild(
          informacion
        );


        fila.appendChild(
          boton
        );


        lista.appendChild(
          fila
        );

      }
    );


    totalPantalla.textContent =

      "Total: " +

      total +

      " kg";


  } catch (error) {

    console.error(
      error
    );


    lista.textContent =
      "No se pudieron cargar los registros";


    totalPantalla.textContent =
      "Total: 0 kg";

  }

}



// ==================================================
// VOLVER PRINCIPAL
// ==================================================

function volverPrincipal() {

  trabajadorSeleccionado =
    null;


  ocultarPantallas();


  document
    .getElementById(
      "pantallaPrincipal"
    )
    .classList.remove(
      "oculto"
    );

}



// ==================================================
// OCULTAR PANTALLAS
// ==================================================

function ocultarPantallas() {

  document
    .getElementById(
      "pantallaPrincipal"
    )
    .classList.add(
      "oculto"
    );


  document
    .getElementById(
      "pantallaTrabajadores"
    )
    .classList.add(
      "oculto"
    );


  document
    .getElementById(
      "pantallaAgregar"
    )
    .classList.add(
      "oculto"
    );


  document
    .getElementById(
      "pantallaFormulario"
    )
    .classList.add(
      "oculto"
    );

}



// ==================================================
// CUANDO VUELVE INTERNET
// ==================================================

window.addEventListener(

  "online",

  async function() {

    const estado =
      document.getElementById(
        "estado"
      );


    estado.textContent =
      "Internet disponible. Sincronizando...";


    try {

      await sincronizar();


      estado.textContent =
        "✓ Sincronización completada";


    } catch (error) {

      console.error(
        error
      );

    }

  }

);



// ==================================================
// SIN INTERNET
// ==================================================

window.addEventListener(

  "offline",

  function() {

    document
      .getElementById(
        "estado"
      )
      .textContent =
      "Sin Internet. Guardando en la tablet.";

  }

);



// ==================================================
// INICIAR APLICACIÓN
// ==================================================

async function iniciarAplicacion() {

  try {

    await cargarTrabajadores();

  } catch (error) {

    console.error(
      error
    );

  }


  try {

    await actualizarPendientes();

  } catch (error) {

    console.error(
      error
    );

  }


  if (
    navigator.onLine
  ) {

    try {

      await sincronizar();


      document
        .getElementById(
          "estado"
        )
        .textContent =
        "✓ Aplicación sincronizada";


    } catch (error) {

      console.log(
        error
      );

    }

  }

}



// ==================================================
// INICIAR
// ==================================================

iniciarAplicacion();


</script>
