<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<meta
  name="theme-color"
  content="#333333">

<link
  rel="manifest"
  href="manifest.json">

<title>Control de Pesajes</title>


<style>

body {

  font-family: Arial, sans-serif;

  margin: 0;

  padding: 20px;

  background: #f2f2f2;

}


.contenedor {

  max-width: 600px;

  margin: auto;

}


h1 {

  text-align: center;

}


.tarjeta {

  background: white;

  padding: 20px;

  border-radius: 12px;

  margin-top: 20px;

}


label {

  display: block;

  margin-top: 15px;

  font-weight: bold;

}


input,
button {

  width: 100%;

  box-sizing: border-box;

  padding: 15px;

  margin-top: 8px;

  font-size: 18px;

  border-radius: 8px;

  border: 1px solid #ccc;

}


button {

  cursor: pointer;

  font-weight: bold;

  margin-top: 20px;

}


#trabajador {

  margin-top: 10px;

  padding: 15px;

  background: #eee;

  border-radius: 8px;

}


#estado {

  text-align: center;

  margin-top: 20px;

  font-weight: bold;

}


#pendientes {

  text-align: center;

  margin-top: 10px;

}

</style>

</head>


<body>


<div class="contenedor">


<h1>CONTROL DE PESAJES</h1>


<div class="tarjeta">


<label>

Código del trabajador

</label>


<input
  id="codigo"
  type="text"
  placeholder="Ej: Trab001">


<div id="trabajador">

Trabajador no seleccionado

</div>


<label>

Kilos

</label>


<input
  id="kilos"
  type="number"
  step="0.1"
  placeholder="Ej: 84.5">


<button
  onclick="guardarPesaje()">

GUARDAR PESAJE

</button>


<div id="estado"></div>


<div id="pendientes">

Pendientes: 0

</div>


</div>

</div>


<script>


/* ==========================================
   URL APPS SCRIPT
========================================== */

const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbzs9dBMJotH8zBQNYeeOIdejzlTbPBRkw0IErt0Td9eiHmvy497j7Mu2XZJRzc2J_YWkQ/exec";


/* ==========================================
   TRABAJADORES
========================================== */

let trabajadores = [];


/* ==========================================
   BASE LOCAL
========================================== */

const DB_NAME =
"ControlPesajesDB";

const DB_VERSION =
1;

const STORE_NAME =
"pesajes";


/* ==========================================
   ABRIR BASE
========================================== */

function abrirBaseDatos() {

return new Promise(
function(resolve,reject) {

const solicitud =
indexedDB.open(
DB_NAME,
DB_VERSION
);


solicitud.onupgradeneeded =
function(event) {

const db =
event.target.result;


if (
!db.objectStoreNames.contains(
STORE_NAME
)
) {

db.createObjectStore(
STORE_NAME,
{
keyPath: "id"
}
);

}

};


solicitud.onsuccess =
function(event) {

resolve(
event.target.result
);

};


solicitud.onerror =
function() {

reject(
solicitud.error
);

};

});

}


/* ==========================================
   GUARDAR LOCAL
========================================== */

async function guardarLocal(
registro
) {

const db =
await abrirBaseDatos();


return new Promise(
function(resolve,reject) {

const transaccion =
db.transaction(
STORE_NAME,
"readwrite"
);


const almacen =
transaccion.objectStore(
STORE_NAME
);


almacen.put(
registro
);


transaccion.oncomplete =
function() {

resolve();

};


transaccion.onerror =
function() {

reject(
transaccion.error
);

};

});

}


/* ==========================================
   OBTENER PENDIENTES
========================================== */

async function obtenerPendientes() {

const db =
await abrirBaseDatos();


return new Promise(
function(resolve,reject) {

const transaccion =
db.transaction(
STORE_NAME,
"readonly"
);


const almacen =
transaccion.objectStore(
STORE_NAME
);


const solicitud =
almacen.getAll();


solicitud.onsuccess =
function() {

resolve(
solicitud.result
);

};


solicitud.onerror =
function() {

reject(
solicitud.error
);

};

});

}


/* ==========================================
   ELIMINAR LOCAL
========================================== */

async function eliminarLocal(
id
) {

const db =
await abrirBaseDatos();


return new Promise(
function(resolve,reject) {

const transaccion =
db.transaction(
STORE_NAME,
"readwrite"
);


const almacen =
transaccion.objectStore(
STORE_NAME
);


almacen.delete(
id
);


transaccion.oncomplete =
function() {

resolve();

};


transaccion.onerror =
function() {

reject(
transaccion.error
);

};

});

}


/* ==========================================
   CARGAR TRABAJADORES
========================================== */

async function cargarTrabajadores() {

const estado =
document.getElementById(
"estado"
);


try {


/*
Intentar cargar desde Internet
*/

if (navigator.onLine) {

const respuesta =
await fetch(
URL_APPS_SCRIPT +
"?action=trabajadores"
);


if (!respuesta.ok) {

throw new Error(
"Error de conexión"
);

}


const lista =
await respuesta.json();


trabajadores =
lista;


/*
Guardar trabajadores
localmente
*/

localStorage.setItem(
"trabajadores",
JSON.stringify(
trabajadores
)
);


estado.textContent =
"Trabajadores actualizados";


} else {


/*
Sin Internet
*/

const guardados =
localStorage.getItem(
"trabajadores"
);


if (guardados) {

trabajadores =
JSON.parse(
guardados
);

estado.textContent =
"Trabajadores cargados sin Internet";

} else {

estado.textContent =
"No hay trabajadores guardados";

}

}


} catch(error) {


console.log(
"Error cargando trabajadores:",
error
);


/*
Si falla Internet,
usar copia local
*/

const guardados =
localStorage.getItem(
"trabajadores"
);


if (guardados) {

trabajadores =
JSON.parse(
guardados
);

estado.textContent =
"Sin Internet. Trabajadores locales.";

} else {

estado.textContent =
"No se pudieron cargar trabajadores";

}

}

}


/* ==========================================
   BUSCAR TRABAJADOR
========================================== */

document
.getElementById("codigo")
.addEventListener(
"input",
function() {

buscarTrabajador(
this.value
);

}
);


function buscarTrabajador(
codigo
) {


codigo =
codigo.trim();


const trabajador =
trabajadores.find(
function(t) {

return String(
t.codigo
).toLowerCase()
===
codigo.toLowerCase();

}
);


const pantalla =
document.getElementById(
"trabajador"
);


if (trabajador) {


pantalla.textContent =
trabajador.nombre +
" (" +
trabajador.codigo +
")";


} else {


if (codigo.length > 0) {

pantalla.textContent =
"Trabajador no encontrado";

} else {

pantalla.textContent =
"Trabajador no seleccionado";

}

}

}


/* ==========================================
   GUARDAR PESAJE
========================================== */

async function guardarPesaje() {


const codigo =
document.getElementById(
"codigo"
).value.trim();


const kilos =
document.getElementById(
"kilos"
).value;


const estado =
document.getElementById(
"estado"
);


if (!codigo) {

estado.textContent =
"Ingrese el código";

return;

}


if (!kilos || kilos <= 0) {

estado.textContent =
"Ingrese los kilos";

return;

}


const trabajador =
trabajadores.find(
function(t) {

return String(
t.codigo
).toLowerCase()
===
codigo.toLowerCase();

}
);


if (!trabajador) {

estado.textContent =
"Trabajador no encontrado";

return;

}


const registro = {

id:
Date.now() +
"-" +
Math.random()
.toString(36)
.substring(2,8),

fechaHora:
new Date().toISOString(),

codigo:
trabajador.codigo,

kilos:
Number(kilos)

};


try {


await guardarLocal(
registro
);


await actualizarPendientes();


estado.textContent =
"✓ Pesaje guardado";


document.getElementById(
"kilos"
).value = "";


if (navigator.onLine) {

sincronizar();

}


} catch(error) {


estado.textContent =
"Error al guardar";


console.log(error);

}

}


/* ==========================================
   CONTADOR
========================================== */

async function actualizarPendientes() {

try {

const pendientes =
await obtenerPendientes();


document.getElementById(
"pendientes"
).textContent =
"Pendientes: " +
pendientes.length;

} catch(error) {

console.log(error);

}

}


/* ==========================================
   ENVIAR A GOOGLE
========================================== */

function enviarAGoogle(
registro
) {


return fetch(
URL_APPS_SCRIPT,
{

method: "POST",

headers: {

"Content-Type":
"text/plain;charset=utf-8"

},

body:
JSON.stringify(
registro
)

}
)

.then(
function(respuesta) {

return respuesta.json();

}
)

.then(
function(resultado) {

if (!resultado.ok) {

throw new Error(
resultado.error
);

}

return resultado;

}
);

}


/* ==========================================
   SINCRONIZAR
========================================== */

async function sincronizar() {


if (!navigator.onLine) {

return;

}


const pendientes =
await obtenerPendientes();


if (
pendientes.length === 0
) {

return;

}


for (
const registro
of pendientes
) {


try {


await enviarAGoogle(
registro
);


await eliminarLocal(
registro.id
);


} catch(error) {


console.log(
"No se pudo sincronizar:",
error
);


break;

}

}


await actualizarPendientes();

}


/* ==========================================
   INTERNET
========================================== */

window.addEventListener(
"online",
function() {


document.getElementById(
"estado"
).textContent =
"Internet disponible";


cargarTrabajadores();


sincronizar();

}
);


/* ==========================================
   SIN INTERNET
========================================== */

window.addEventListener(
"offline",
function() {


document.getElementById(
"estado"
).textContent =
"Sin Internet. Funcionando localmente.";

}
);


/* ==========================================
   INICIO
========================================== */

cargarTrabajadores();

actualizarPendientes();


/* ==========================================
   SERVICE WORKER
========================================== */

if (
"serviceWorker"
in navigator
) {

window.addEventListener(
"load",
function() {

navigator.serviceWorker.register(
"sw.js"
);

});

}


</script>


</body>

</html>
