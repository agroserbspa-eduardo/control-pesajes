</div>

<!-- ============================================== -->

<h2>

REGISTROS DEL TRABAJADOR

</h2>


<div id="listaRegistros">

Seleccione un trabajador

</div>

Total: 0 kg

</div>


</div>

<script>


// ==================================================
// URL GOOGLE APPS SCRIPT
// ==================================================

const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbxCDWwilSh4v7eukRicKgGR0eEFbGlbYmxqlRVwTtOYsTvO26rHYp-T1iQTjUdh0kLg_w/exec";


// ==================================================
// TRABAJADORES
// ==================================================

let trabajadores =
[];


// ==================================================
// BASE DE DATOS LOCAL
// ==================================================

// IMPORTANTE:
//
// Tu tablet ya tenía una base de datos
// con versión 3.
//
// Por eso usamos versión 4.

const DB_NAME =
"ControlPesajesDB";


const DB_VERSION =
4;


// Mantenemos el mismo nombre anterior
// para no crear problemas.

const STORE_NAME =
"pesajes";


// ==================================================
// ABRIR BASE DE DATOS
// ==================================================

function abrirBaseDatos() {

  return new Promise(
    function(resolve, reject) {

      let solicitud;


      try {

        solicitud =
          indexedDB.open(
            DB_NAME,
            DB_VERSION
          );

      } catch (error) {

        reject(error);

        return;

      }


      solicitud.onupgradeneeded =
        function(event) {

          const db =
            event.target.result;


          if (

            !db
              .objectStoreNames
              .contains(
                STORE_NAME
              )

          ) {

            db.createObjectStore(
              STORE_NAME,
              {
                keyPath:
                  "id"
              }
            );

          }

        };


      solicitud.onsuccess =
        function(event) {

          const db =
            event.target.result;


          resolve(db);

        };


      solicitud.onerror =
        function() {

          reject(
            solicitud.error
          );

        };


      solicitud.onblocked =
        function() {

          reject(
            new Error(
              "Base de datos bloqueada"
            )
          );

        };

    }
  );

}


// ==================================================
// GUARDAR REGISTRO LOCAL
// ==================================================

async function guardarLocal(registro) {

  const db =
    await abrirBaseDatos();


  return new Promise(
    function(resolve, reject) {

      const transaccion =
        db.transaction(
          STORE_NAME,
          "readwrite"
        );


      const almacen =
        transaccion.objectStore(
          STORE_NAME
        );


      almacen.put(
        registro
      );


      transaccion.oncomplete =
        function() {

          db.close();

          resolve();

        };


      transaccion.onerror =
        function() {

          db.close();

          reject(
            transaccion.error
          );

        };

    }
  );

}


// ==================================================
// OBTENER REGISTROS LOCALES
// ==================================================

async function obtenerPendientes() {

  const db =
    await abrirBaseDatos();


  return new Promise(
    function(resolve, reject) {

      const transaccion =
        db.transaction(
          STORE_NAME,
          "readonly"
        );


      const almacen =
        transaccion.objectStore(
          STORE_NAME
        );


      const solicitud =
        almacen.getAll();


      solicitud.onsuccess =
        function() {

          const registros =
            solicitud.result ||
            [];


          db.close();

          resolve(
            registros
          );

        };


      solicitud.onerror =
        function() {

          db.close();

          reject(
            solicitud.error
          );

        };

    }
  );

}


// ==================================================
// ELIMINAR REGISTRO LOCAL
// ==================================================

async function eliminarLocal(id) {

  const db =
    await abrirBaseDatos();


  return new Promise(
    function(resolve, reject) {

      const transaccion =
        db.transaction(
          STORE_NAME,
          "readwrite"
        );


      const almacen =
        transaccion.objectStore(
          STORE_NAME
        );


      almacen.delete(
        id
      );


      transaccion.oncomplete =
        function() {

          db.close();

          resolve();

        };


      transaccion.onerror =
        function() {

          db.close();

          reject(
            transaccion.error
          );

        };

    }
  );

}


// ==================================================
// JSONP
// ==================================================

function jsonp(url) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =

        "callback_" +

        Date.now() +

        "_" +

        Math
          .random()
          .toString(36)
          .substring(2);


      const script =
        document.createElement(
          "script"
        );


      let terminado =
        false;


      const tiempo =
        setTimeout(
          function() {

            if (terminado) {

              return;

            }


            terminado =
              true;


            limpiar();


            reject(
              new Error(
                "Tiempo de espera agotado"
              )
            );

          },
          15000
        );


      function limpiar() {

        clearTimeout(
          tiempo
        );


        if (
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }


        try {

          delete window[
            callbackName
          ];

        } catch (error) {

          window[
            callbackName
          ] =
          undefined;

        }

      }


      window[
        callbackName
      ] =
      function(datos) {

        if (terminado) {

          return;

        }


        terminado =
          true;


        limpiar();


        resolve(
          datos
        );

      };


      script.onerror =
        function() {

          if (terminado) {

            return;

          }


          terminado =
            true;


          limpiar();


          reject(
            new Error(
              "No se pudo conectar"
            )
          );

        };


      const separador =
        url.includes("?")
          ? "&"
          : "?";


      script.src =

        url +

        separador +

        "callback=" +

        encodeURIComponent(
          callbackName
        );


      document.body.appendChild(
        script
      );

    }
  );

}


// ==================================================
// CARGAR TRABAJADORES
// ==================================================

async function cargarTrabajadores() {

  const estado =
    document.getElementById(
      "estado"
    );


  if (
    navigator.onLine
  ) {

    try {

      const lista =
        await jsonp(

          URL_APPS_SCRIPT +

          "?action=trabajadores"

        );


      if (
        !Array.isArray(
          lista
        )
      ) {

        throw new Error(
          "Respuesta incorrecta"
        );

      }


      trabajadores =
        lista;


      localStorage.setItem(

        "trabajadores",

        JSON.stringify(
          trabajadores
        )

      );


      return;


    } catch (error) {

      console.log(
        "Error trabajadores:",
        error
      );

    }

  }


  const guardados =
    localStorage.getItem(
      "trabajadores"
    );


  if (guardados) {

    try {

      trabajadores =
        JSON.parse(
          guardados
        );


      estado.textContent =
        "Trabajadores disponibles sin Internet";


    } catch (error) {

      console.error(error);

    }

  }

}


// ==================================================
// BUSCAR TRABAJADOR
// ==================================================

document
  .getElementById(
    "codigo"
  )
  .addEventListener(

    "input",

    function() {

      buscarTrabajador(
        this.value
      );

    }

  );



function buscarTrabajador(codigo) {

  codigo =
    String(codigo)
      .trim();


  const pantalla =
    document.getElementById(
      "trabajador"
    );


  if (!codigo) {

    pantalla.textContent =
      "Trabajador no seleccionado";


    document
      .getElementById(
        "listaRegistros"
      )
      .textContent =
      "Seleccione un trabajador";


    document
      .getElementById(
        "totalTrabajador"
      )
      .textContent =
      "Total: 0 kg";


    return;

  }


  const trabajador =
    trabajadores.find(

      function(t) {

        return String(
          t.codigo
        )
        .trim()
        .toLowerCase()
        ===
        codigo.toLowerCase();

      }

    );


  if (trabajador) {

    pantalla.textContent =

      trabajador.nombre +

      " (" +

      trabajador.codigo +

      ")";


    mostrarRegistrosTrabajador(
      trabajador.codigo
    );


  } else {

    pantalla.textContent =
      "Trabajador no encontrado";


    document
      .getElementById(
        "listaRegistros"
      )
      .textContent =
      "Seleccione un trabajador";


    document
      .getElementById(
        "totalTrabajador"
      )
      .textContent =
      "Total: 0 kg";

  }

}


// ==================================================
// MOSTRAR CAMPO PESO
// ==================================================

function mostrarPeso() {

  const codigo =
    document
      .getElementById(
        "codigo"
      )
      .value
      .trim();


  const estado =
    document.getElementById(
      "estado"
    );


  if (!codigo) {

    estado.textContent =
      "Ingrese el código del trabajador";

    return;

  }


  const trabajador =
    buscarTrabajadorPorCodigo(
      codigo
    );


  if (!trabajador) {

    estado.textContent =
      "Trabajador no encontrado";

    return;

  }


  document
    .getElementById(
      "areaPeso"
    )
    .style
    .display =
    "block";


  document
    .getElementById(
      "peso"
    )
    .focus();


  estado.textContent =
    "Ingrese el peso";

}


// ==================================================
// BUSCAR TRABAJADOR POR CÓDIGO
// ==================================================

function buscarTrabajadorPorCodigo(codigo) {

  return trabajadores.find(

    function(t) {

      return String(
        t.codigo
      )
      .trim()
      .toLowerCase()
      ===
      String(
        codigo
      )
      .trim()
      .toLowerCase();

    }

  );

}


// ==================================================
// CREAR REGISTRO
// ==================================================

function crearRegistro(
  peso,
  jornada
) {

  const codigo =
    document
      .getElementById(
        "codigo"
      )
      .value
      .trim();


  const trabajador =
    buscarTrabajadorPorCodigo(
      codigo
    );


  if (!trabajador) {

    throw new Error(
      "Trabajador no encontrado"
    );

  }


  return {

    id:

      Date.now() +

      "-" +

      Math
        .random()
        .toString(36)
        .substring(2, 8),


    // Se guarda en formato ISO
    // y Apps Script lo convierte
    // a hora de Chile.

    fechaHora:

      new Date()
        .toISOString(),


    codigo:

      trabajador.codigo,


    peso:

      peso,


    jornada:

      jornada

  };

}


// ==================================================
// GUARDAR PESO
// ==================================================

async function guardarPeso() {

  const estado =
    document.getElementById(
      "estado"
    );


  const valorPeso =
    document
      .getElementById(
        "peso"
      )
      .value;


  if (
    valorPeso === ""
  ) {

    estado.textContent =
      "Ingrese un peso";

    return;

  }


  const peso =
    Number(
      String(valorPeso)
        .replace(",", ".")
    );


  if (
    isNaN(peso) ||
    peso <= 0
  ) {

    estado.textContent =
      "Ingrese un peso válido";

    return;

  }


  try {

    const registro =
      crearRegistro(
        peso,
        ""
      );


    await guardarRegistroLocal(
      registro
    );


    document
      .getElementById(
        "peso"
      )
      .value =
      "";


    document
      .getElementById(
        "areaPeso"
      )
      .style
      .display =
      "none";


  } catch (error) {

    estado.textContent =
      error.message;

  }

}


// ==================================================
// GUARDAR JORNADA
// ==================================================

async function guardarJornada(jornada) {

  const estado =
    document.getElementById(
      "estado"
    );


  try {

    const registro =
      crearRegistro(
        "",
        jornada
      );


    await guardarRegistroLocal(
      registro
    );


  } catch (error) {

    estado.textContent =
      error.message;

  }

}


// ==================================================
// GUARDAR LOCAL Y SINCRONIZAR
// ==================================================

async function guardarRegistroLocal(registro) {

  const estado =
    document.getElementById(
      "estado"
    );


  // Guardar primero en la tablet

  await guardarLocal(
    registro
  );


  await actualizarPendientes();


  await mostrarRegistrosTrabajador(
    registro.codigo
  );


  estado.textContent =
    "✓ Registro guardado en la tablet";


  // Intentar sincronizar

  if (
    navigator.onLine
  ) {

    try {

      await sincronizar();

      estado.textContent =
        "✓ Registro sincronizado";

    } catch (error) {

      console.log(
        error
      );

      estado.textContent =
        "✓ Guardado en la tablet. Pendiente de sincronización";

    }

  }

}


// ==================================================
// ACTUALIZAR PENDIENTES
// ==================================================

async function actualizarPendientes() {

  try {

    const pendientes =
      await obtenerPendientes();


    document
      .getElementById(
        "pendientes"
      )
      .textContent =

      "Pendientes de sincronización: " +

      pendientes.length;


  } catch (error) {

    console.error(error);

  }

}


// ==================================================
// MOSTRAR REGISTROS DEL TRABAJADOR
// ==================================================

async function mostrarRegistrosTrabajador(codigo) {

  const lista =
    document.getElementById(
      "listaRegistros"
    );


  const totalPantalla =
    document.getElementById(
      "totalTrabajador"
    );


  if (!codigo) {

    lista.textContent =
      "Seleccione un trabajador";


    totalPantalla.textContent =
      "Total: 0 kg";

    return;

  }


  try {

    const registros =
      await obtenerPendientes();


    const registrosTrabajador =
      registros.filter(

        function(registro) {

          return String(
            registro.codigo
          )
          .trim()
          .toLowerCase()
          ===
          String(codigo)
          .trim()
          .toLowerCase();

        }

      );


    lista.innerHTML =
      "";


    let total =
      0;


    if (
      registrosTrabajador.length === 0
    ) {

      lista.textContent =
        "No hay registros locales pendientes";

    }


    registrosTrabajador.forEach(

      function(registro) {

        const fila =
          document.createElement(
            "div"
          );


        fila.className =
          "registro";


        const informacion =
          document.createElement(
            "div"
          );


        informacion.className =
          "infoRegistro";


        let texto =
          "";


        // PESO

        if (

          registro.peso !== "" &&

          registro.peso !== null &&

          registro.peso !== undefined

        ) {

          const numero =
            Number(
              registro.peso
            );


          if (
            !isNaN(numero)
          ) {

            total +=
              numero;

          }


          texto +=

            registro.peso +

            " kg";

        }


        // JORNADA

        if (
          registro.jornada
        ) {

          if (texto) {

            texto +=
              " - ";

          }


          texto +=
            registro.jornada;

        }


        informacion.textContent =
          texto;


        const boton =
          document.createElement(
            "button"
          );


        boton.className =
          "botonEliminar";


        boton.textContent =
          "❌";


        boton.type =
          "button";


        boton.onclick =
          async function() {

            if (

              confirm(
                "¿Eliminar este registro?"
              )

            ) {

              try {

                await eliminarLocal(
                  registro.id
                );


                await actualizarPendientes();


                await mostrarRegistrosTrabajador(
                  codigo
                );


              } catch (error) {

                alert(
                  "No se pudo eliminar el registro"
                );

              }

            }

          };


        fila.appendChild(
          informacion
        );


        fila.appendChild(
          boton
        );


        lista.appendChild(
          fila
        );

      }

    );


    totalPantalla.textContent =

      "Total: " +

      total +

      " kg";


  } catch (error) {

    console.error(error);


    lista.textContent =
      "No se pudieron cargar los registros";


    totalPantalla.textContent =
      "Total: 0 kg";

  }

}


// ==================================================
// SINCRONIZAR UN REGISTRO
// ==================================================

async function sincronizarRegistro(registro) {

  const url =

    URL_APPS_SCRIPT +

    "?action=guardar" +


    "&id=" +

    encodeURIComponent(
      registro.id
    ) +


    "&fechaHora=" +

    encodeURIComponent(
      registro.fechaHora
    ) +


    "&codigo=" +

    encodeURIComponent(
      registro.codigo
    ) +


    "&peso=" +

    encodeURIComponent(

      registro.peso === undefined ||

      registro.peso === null

        ?

        ""

        :

        registro.peso

    ) +


    "&jornada=" +

    encodeURIComponent(

      registro.jornada === undefined ||

      registro.jornada === null

        ?

        ""

        :

        registro.jornada

    );


  const resultado =
    await jsonp(
      url
    );


  if (

    !resultado ||

    resultado.ok !== true

  ) {

    throw new Error(

      resultado &&
      resultado.error

        ?

        resultado.error

        :

        "No se pudo sincronizar"

    );

  }


  return true;

}


// ==================================================
// SINCRONIZAR TODOS LOS REGISTROS
// ==================================================

async function sincronizar() {

  if (
    !navigator.onLine
  ) {

    return;

  }


  const pendientes =
    await obtenerPendientes();


  for (

    const registro

    of pendientes

  ) {

    try {

      await sincronizarRegistro(
        registro
      );


      await eliminarLocal(
        registro.id
      );


    } catch (error) {

      console.log(
        "No se pudo sincronizar:",
        error
      );

      break;

    }

  }


  await actualizarPendientes();


  const codigo =
    document
      .getElementById(
        "codigo"
      )
      .value
      .trim();


  if (codigo) {

    await mostrarRegistrosTrabajador(
      codigo
    );

  }

}


// ==================================================
// CUANDO VUELVE INTERNET
// ==================================================

window.addEventListener(

  "online",

  async function() {

    document
      .getElementById(
        "estado"
      )
      .textContent =
      "Internet disponible. Sincronizando...";


    try {

      await cargarTrabajadores();

      await sincronizar();


      document
        .getElementById(
          "estado"
        )
        .textContent =
        "✓ Sincronización completada";


    } catch (error) {

      console.error(error);

    }

  }

);


// ==================================================
// SIN INTERNET
// ==================================================

window.addEventListener(

  "offline",

  function() {

    document
      .getElementById(
        "estado"
      )
      .textContent =
      "Sin Internet. Guardando en la tablet.";

  }

);


// ==================================================
// INICIAR APLICACIÓN
// ==================================================

async function iniciarAplicacion() {

  try {

    await cargarTrabajadores();

  } catch (error) {

    console.error(error);

  }


  try {

    await actualizarPendientes();

  } catch (error) {

    console.error(error);

  }


  if (
    navigator.onLine
  ) {

    try {

      await sincronizar();

    } catch (error) {

      console.log(error);

    }

  }

}


iniciarAplicacion();


</script>
