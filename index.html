<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"

>

<link

<title>Control de Pesajes</title>


<style>

body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 20px;
  background: #f2f2f2;
}

.contenedor {

}

.tarjeta {

  margin-top: 20px;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

input,
select,
button {
  width: 100%;
  box-sizing: border-box;
  padding: 15px;
  margin-top: 8px;
  font-size: 18px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  cursor: pointer;
  font-weight: bold;
  margin-top: 15px;
}

#trabajador {
  margin-top: 10px;
  padding: 15px;
  background: #eee;
  border-radius: 8px;
  font-size: 18px;
}

#lectorQR {
  margin-top: 15px;
  text-align: center;
}

#lectorQR video {
  width: 100%;
  max-width: 400px;
  border-radius: 10px;
}

#cerrarQR {
  display: none;
}

#estado {
  text-align: center;
  margin-top: 20px;
  font-weight: bold;
}

#pendientes {
  text-align: center;
  margin-top: 10px;
}

#registrosTrabajador {
  margin-top: 25px;
}

.registroPeso {

  display: flex;

  align-items: center;

  justify-content: space-between;

  background: #f1f1f1;

  padding: 12px;

  margin-top: 8px;

  border-radius: 8px;

}

.infoPeso {
  flex: 1;
}

.botonEliminar {

  width: auto;

  margin: 0;

  padding: 8px 12px;

  background: #ffffff;

  border: 1px solid #ccc;

  font-size: 18px;

}

#totalTrabajador {

  margin-top: 15px;

  padding: 15px;

  background: #eeeeee;

  border-radius: 8px;

  text-align: center;

  font-size: 24px;

  font-weight: bold;

</style>

</head>


<body>


<div class="contenedor">


<h1>CONTROL DE PESAJES</h1>


<div class="tarjeta">


<!-- ============================================= -->
<!-- CÓDIGO -->
<!-- ============================================= -->

<label>
Código del trabajador
</label>

<input
  id="codigo"
  type="text"
  placeholder="Ej: 1"
  autocomplete="off"
>


<button
  type="button"
  onclick="abrirEscaner()"
>

📷 ESCANEAR QR

</button>


<div id="lectorQR"></div>


<button
  id="cerrarQR"
  type="button"
  onclick="cerrarEscaner()"
>

✖ CERRAR CÁMARA

</button>


<div id="trabajador">

Trabajador no seleccionado

</div>


<!-- ============================================= -->
<!-- TIPO DE TRABAJO -->
<!-- ============================================= -->

<label>
Tipo de registro
</label>

<select
  id="tipoRegistro"
  onchange="cambiarTipoRegistro()"
>

<option value="peso">

Por peso

</option>

<option value="jornada">

Por jornada

</option>

</select>


<!-- ============================================= -->
<!-- PESO -->
<!-- ============================================= -->

<div id="contenedorPeso">

<label>
Peso en kilos
</label>

<input
  id="peso"
  type="number"
  step="0.1"
  placeholder="Ej: 84.5"
>

</div>


<!-- ============================================= -->
<!-- JORNADA -->
<!-- ============================================= -->

<div
  id="contenedorJornada"
  style="display:none;"
>

<label>
Jornada
</label>

<select id="jornada">

<option value="Día">

Día completo

</option>

<option value="Medio día">

Medio día

</option>

</select>

</div>


<!-- ============================================= -->
<!-- GUARDAR -->
<!-- ============================================= -->

<button
  type="button"
  onclick="guardarRegistro()"
>

GUARDAR REGISTRO

</button>


<div id="estado"></div>


<div id="pendientes">

Pendientes de sincronización: 0

</div>


<!-- ============================================= -->
<!-- REGISTROS -->
<!-- ============================================= -->

<div id="registrosTrabajador">


<h2>

REGISTROS DEL TRABAJADOR

</h2>


<div id="listaRegistros">

Seleccione un trabajador

</div>


<div id="totalTrabajador">

Total: 0 kg

</div>


</div>


</div>


</div>



<script>


// ==================================================
// URL APPS SCRIPT
// ==================================================

const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbzs9dBMJotH8zBQNYeeOIdejzlTbPBRkw0IErt0Td9eiHmvy497j7Mu2XZJRzc2J_YWkQ/exec";


// ==================================================
// TRABAJADORES
// ==================================================

let trabajadores = [];


// ==================================================
// LECTOR QR
// ==================================================

let streamQR = null;

let intervaloQR = null;


// ==================================================
// CAMBIAR TIPO DE REGISTRO
// ==================================================

function cambiarTipoRegistro() {

  const tipo =
    document.getElementById(
      "tipoRegistro"
    ).value;


  const contenedorPeso =
    document.getElementById(
      "contenedorPeso"
    );


  const contenedorJornada =
    document.getElementById(
      "contenedorJornada"
    );


  if (
    tipo === "peso"
  ) {

    contenedorPeso.style.display =
      "block";

    contenedorJornada.style.display =
      "none";

  } else {

    contenedorPeso.style.display =
      "none";

    contenedorJornada.style.display =
      "block";

  }

}


// ==================================================
// JSONP
// ==================================================

function jsonp(url) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        "callback_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2);


      const script =
        document.createElement(
          "script"
        );


      let terminado =
        false;


      const tiempo =
        setTimeout(
          function() {

            if (
              terminado
            ) {

              return;

            }


            terminado =
              true;

            limpiar();


            reject(
              new Error(
                "Tiempo de espera agotado"
              )
            );

          },
          15000
        );


      function limpiar() {

        clearTimeout(
          tiempo
        );


        if (
          script.parentNode
        ) {

          script.parentNode.removeChild(
            script
          );

        }


        try {

          delete window[
            callbackName
          ];

        } catch(error) {

          window[
            callbackName
          ] =
          undefined;

        }

      }


      window[
        callbackName
      ] =
      function(datos) {

        if (
          terminado
        ) {

          return;

        }


        terminado =
          true;

        limpiar();

        resolve(
          datos
        );

      };


      script.onerror =
      function() {

        if (
          terminado
        ) {

          return;

        }


        terminado =
          true;

        limpiar();


        reject(
          new Error(
            "No se pudo conectar"
          )
        );

      };


      const separador =
        url.includes("?")
          ? "&"
          : "?";


      script.src =
        url +
        separador +
        "callback=" +
        encodeURIComponent(
          callbackName
        );


      document.body.appendChild(
        script
      );

    }
  );

}


// ==================================================
// CARGAR TRABAJADORES
// ==================================================

async function cargarTrabajadores() {

  const estado =
    document.getElementById(
      "estado"
    );


  if (
    navigator.onLine
  ) {

    try {

      const lista =
        await jsonp(
          URL_APPS_SCRIPT +
          "?action=trabajadores"
        );


      if (
        !Array.isArray(
          lista
        )
      ) {

        throw new Error(
          "Respuesta incorrecta"
        );

      }


      trabajadores =
        lista;


      localStorage.setItem(
        "trabajadores",
        JSON.stringify(
          trabajadores
        )
      );


      estado.textContent =
        "✓ Trabajadores actualizados";


      return;

    } catch(error) {

      console.log(
        "Error al cargar trabajadores:",
        error
      );

    }

  }


  const guardados =
    localStorage.getItem(
      "trabajadores"
    );


  if (
    guardados
  ) {

    try {

      trabajadores =
        JSON.parse(
          guardados
        );


      estado.textContent =
        "✓ Trabajadores disponibles sin Internet";

    } catch(error) {

      console.error(
        error
      );

    }

  }

}


// ==================================================
// BUSCAR TRABAJADOR
// ==================================================

document
  .getElementById(
    "codigo"
  )
  .addEventListener(
    "input",
    function() {

      buscarTrabajador(
        this.value
      );

    }
  );


function buscarTrabajador(
  codigo
) {

  codigo =
    String(
      codigo
    )
    .trim();


  const pantalla =
    document.getElementById(
      "trabajador"
    );


  if (
    !codigo
  ) {

    pantalla.textContent =
      "Trabajador no seleccionado";


    mostrarRegistrosTrabajador(
      ""
    );


    return;

  }


  const trabajador =
    trabajadores.find(
      function(t) {

        return String(
          t.codigo
        )
        .trim()
        .toLowerCase()
        ===
        codigo
        .toLowerCase();

      }
    );


  if (
    trabajador
  ) {

    pantalla.textContent =
      trabajador.nombre +
      " (" +
      trabajador.codigo +
      ")";


    mostrarRegistrosTrabajador(
      trabajador.codigo
    );

  } else {

    pantalla.textContent =
      "Trabajador no encontrado";


    document.getElementById(
      "listaRegistros"
    ).textContent =
      "Seleccione un trabajador";


    document.getElementById(
      "totalTrabajador"
    ).textContent =
      "Total: 0 kg";

  }

}


// ==================================================
// ESCANEAR QR
// ==================================================

async function abrirEscaner() {

  const lector =
    document.getElementById(
      "lectorQR"
    );


  const botonCerrar =
    document.getElementById(
      "cerrarQR"
    );


  const estado =
    document.getElementById(
      "estado"
    );


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    estado.textContent =
      "La cámara no está disponible.";

    return;

  }


  try {

    streamQR =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal:
                "environment"
            }

          },

          audio:
            false

        });


    const video =
      document.createElement(
        "video"
      );


    video.setAttribute(
      "playsinline",
      true
    );


    video.autoplay =
      true;


    video.srcObject =
      streamQR;


    lector.innerHTML =
      "";


    lector.appendChild(
      video
    );


    botonCerrar.style.display =
      "block";


    estado.textContent =
      "Apunta la cámara al QR";


    await video.play();


    if (
      "BarcodeDetector"
      in window
    ) {

      const detector =
        new BarcodeDetector({

          formats: [
            "qr_code"
          ]

        });


      intervaloQR =
        setInterval(
          async function() {

            try {

              const codigos =
                await detector.detect(
                  video
                );


              if (
                codigos.length > 0
              ) {

                const codigoQR =
                  codigos[0]
                    .rawValue;


                procesarQR(
                  codigoQR
                );

              }

            } catch(error) {

              console.log(
                error
              );

            }

          },
          300
        );

    } else {

      estado.textContent =
        "Este navegador no admite lectura QR.";

    }

  } catch(error) {

    console.log(
      error
    );


    estado.textContent =
      "No se pudo abrir la cámara.";

  }

}


// ==================================================
// PROCESAR QR
// ==================================================

function procesarQR(
  valor
) {

  valor =
    String(
      valor
    )
    .trim();


  document.getElementById(
    "codigo"
  ).value =
    valor;


  buscarTrabajador(
    valor
  );


  cerrarEscaner();

}


// ==================================================
// CERRAR ESCÁNER
// ==================================================

function cerrarEscaner() {

  if (
    intervaloQR
  ) {

    clearInterval(
      intervaloQR
    );


    intervaloQR =
      null;

  }


  if (
    streamQR
  ) {

    streamQR
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    streamQR =
      null;

  }


  document.getElementById(
    "lectorQR"
  ).innerHTML =
    "";


  document.getElementById(
    "cerrarQR"
  ).style.display =
    "none";

}


// ==================================================
// BASE DE DATOS LOCAL
// ==================================================

const DB_NAME =
  "ControlPesajesDB";


const DB_VERSION =
  3;


const STORE_NAME =
  "pesajes";


// ==================================================
// ABRIR BASE DE DATOS
// ==================================================

function abrirBaseDatos() {

  return new Promise(
    function(resolve, reject) {

      const solicitud =
        indexedDB.open(
          DB_NAME,
          DB_VERSION
        );


      solicitud.onupgradeneeded =
        function(event) {

          const db =
            event.target.result;


          if (
            !db.objectStoreNames.contains(
              STORE_NAME
            )
          ) {

            db.createObjectStore(
              STORE_NAME,
              {
                keyPath:
                  "id"
              }
            );

          }

        };


      solicitud.onsuccess =
        function(event) {

          const db =
            event.target.result;


          resolve(
            db
          );

        };


      solicitud.onerror =
        function() {

          reject(
            solicitud.error
          );

        };

    }
  );

}


// ==================================================
// GUARDAR LOCAL
// ==================================================

async function guardarLocal(
  registro
) {

  const db =
    await abrirBaseDatos();


  return new Promise(
    function(resolve, reject) {

      const transaccion =
        db.transaction(
          STORE_NAME,
          "readwrite"
        );


      const almacen =
        transaccion.objectStore(
          STORE_NAME
        );


      almacen.put(
        registro
      );


      transaccion.oncomplete =
        function() {

          db.close();

          resolve();

        };


      transaccion.onerror =
        function() {

          db.close();

          reject(
            transaccion.error
          );

        };

    }
  );

}


// ==================================================
// OBTENER REGISTROS LOCALES
// ==================================================

async function obtenerPendientes() {

  const db =
    await abrirBaseDatos();


  return new Promise(
    function(resolve, reject) {

      const transaccion =
        db.transaction(
          STORE_NAME,
          "readonly"
        );


      const almacen =
        transaccion.objectStore(
          STORE_NAME
        );


      const solicitud =
        almacen.getAll();


      solicitud.onsuccess =
        function() {

          const resultado =
            solicitud.result ||
            [];


          db.close();

          resolve(
            resultado
          );

        };


      solicitud.onerror =
        function() {

          db.close();

          reject(
            solicitud.error
          );

        };

    }
  );

}


// ==================================================
// ELIMINAR LOCAL
// ==================================================

async function eliminarLocal(
  id
) {

  const db =
    await abrirBaseDatos();


  return new Promise(
    function(resolve, reject) {

      const transaccion =
        db.transaction(
          STORE_NAME,
          "readwrite"
        );


      const almacen =
        transaccion.objectStore(
          STORE_NAME
        );


      almacen.delete(
        id
      );


      transaccion.oncomplete =
        function() {

          db.close();

          resolve();

        };


      transaccion.onerror =
        function() {

          db.close();

          reject(
            transaccion.error
          );

        };

    }
  );

}


// ==================================================
// ACTUALIZAR PENDIENTES
// ==================================================

async function actualizarPendientes() {

  try {

    const pendientes =
      await obtenerPendientes();


    document.getElementById(
      "pendientes"
    ).textContent =
      "Pendientes de sincronización: " +
      pendientes.length;

  } catch(error) {

    document.getElementById(
      "pendientes"
    ).textContent =
      "Pendientes de sincronización: ?";

  }

}


// ==================================================
// MOSTRAR REGISTROS DEL TRABAJADOR
// ==================================================

async function mostrarRegistrosTrabajador(
  codigo
) {

  const lista =
    document.getElementById(
      "listaRegistros"
    );


  const totalPantalla =
    document.getElementById(
      "totalTrabajador"
    );


  if (
    !codigo
  ) {

    lista.textContent =
      "Seleccione un trabajador";


    totalPantalla.textContent =
      "Total: 0 kg";


    return;

  }


  try {

    const registros =
      await obtenerPendientes();


    const registrosTrabajador =
      registros.filter(
        function(registro) {

          return String(
            registro.codigo
          ).toLowerCase()
          ===
          String(
            codigo
          ).toLowerCase();

        }
      );


    lista.innerHTML =
      "";


    let total =
      0;


    if (
      registrosTrabajador.length === 0
    ) {

      lista.textContent =
        "No hay registros locales pendientes";

    }


    registrosTrabajador.forEach(
      function(registro) {

        const fila =
          document.createElement(
            "div"
          );


        fila.className =
          "registroPeso";


        const informacion =
          document.createElement(
            "div"
          );


        informacion.className =
          "infoPeso";


        if (
          registro.peso !== "" &&
          registro.peso !== null &&
          registro.peso !== undefined
        ) {

          informacion.textContent =
            registro.peso +
            " kg";


          total +=
            Number(
              registro.peso
            );

        } else {

          informacion.textContent =
            registro.jornada;

        }


        const boton =
          document.createElement(
            "button"
          );


        boton.className =
          "botonEliminar";


        boton.textContent =
          "❌";


        boton.type =
          "button";


        boton.onclick =
          async function() {

            if (
              confirm(
                "¿Eliminar este registro?"
              )
            ) {

              await eliminarLocal(
                registro.id
              );


              await actualizarPendientes();


              await mostrarRegistrosTrabajador(
                codigo
              );

            }

          };


        fila.appendChild(
          informacion
        );


        fila.appendChild(
          boton
        );


        lista.appendChild(
          fila
        );

      }
    );


    totalPantalla.textContent =
      "Total: " +
      total +
      " kg";


  } catch(error) {

    console.error(
      error
    );


    lista.textContent =
      "No se pudieron cargar los registros";

  }

}


// ==================================================
// GUARDAR REGISTRO
// ==================================================

async function guardarRegistro() {

  const codigo =
    document.getElementById(
      "codigo"
    )
    .value
    .trim();


  const tipo =
    document.getElementById(
      "tipoRegistro"
    )
    .value;


  const estado =
    document.getElementById(
      "estado"
    );


  if (
    !codigo
  ) {

    estado.textContent =
      "Ingrese el código";

    return;

  }


  const trabajador =
    trabajadores.find(
      function(t) {

        return String(
          t.codigo
        )
        .trim()
        .toLowerCase()
        ===
        codigo.toLowerCase();

      }
    );


  if (
    !trabajador
  ) {

    estado.textContent =
      "Trabajador no encontrado";

    return;

  }


  let peso =
    "";


  let jornada =
    "";


  // ================================================
  // REGISTRO POR PESO
  // ================================================

  if (
    tipo === "peso"
  ) {

    peso =
      document.getElementById(
        "peso"
      ).value;


    if (
      peso === "" ||
      Number(peso) <= 0
    ) {

      estado.textContent =
        "Ingrese un peso válido";

      return;

    }

  }


  // ================================================
  // REGISTRO POR JORNADA
  // ================================================

  if (
    tipo === "jornada"
  ) {

    jornada =
      document.getElementById(
        "jornada"
      ).value;

  }


  // ================================================
  // CREAR REGISTRO
  // ================================================

  const registro = {

    id:
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(
          2,
          8
        ),


    fechaHora:
      new Date()
        .toISOString(),


    codigo:
      trabajador.codigo,


    peso:
      peso,


    jornada:
      jornada

  };


  try {

    estado.textContent =
      "Guardando...";


    // Guardar primero localmente

    await guardarLocal(
      registro
    );


    await actualizarPendientes();


    await mostrarRegistrosTrabajador(
      trabajador.codigo
    );


    estado.textContent =
      "✓ Registro guardado";


    // Limpiar peso

    document.getElementById(
      "peso"
    ).value =
      "";


    // Sincronizar

    if (
      navigator.onLine
    ) {

      sincronizar()
        .catch(
          function(error) {

            console.log(
              error
            );

          }
        );

    }

  } catch(error) {

    console.error(
      error
    );


    estado.textContent =
      "Error al guardar en la tablet";

  }

}


// ==================================================
// SINCRONIZAR UN REGISTRO
// ==================================================

async function sincronizarRegistro(
  registro
) {

  const url =
    URL_APPS_SCRIPT +

    "?action=guardar" +

    "&id=" +
    encodeURIComponent(
      registro.id
    ) +

    "&fechaHora=" +
    encodeURIComponent(
      registro.fechaHora
    ) +

    "&codigo=" +
    encodeURIComponent(
      registro.codigo
    ) +

    "&peso=" +
    encodeURIComponent(
      registro.peso || ""
    ) +

    "&jornada=" +
    encodeURIComponent(
      registro.jornada || ""
    );


  const resultado =
    await jsonp(
      url
    );


  if (
    !resultado ||
    !resultado.ok
  ) {

    throw new Error(
      resultado &&
      resultado.error
        ?
        resultado.error
        :
        "No se pudo sincronizar"
    );

  }


  return true;

}


// ==================================================
// SINCRONIZAR TODOS
// ==================================================

async function sincronizar() {

  if (
    !navigator.onLine
  ) {

    return;

  }


  const pendientes =
    await obtenerPendientes();


  for (
    const registro
    of pendientes
  ) {

    try {

      await sincronizarRegistro(
        registro
      );


      await eliminarLocal(
        registro.id
      );

    } catch(error) {

      console.log(
        "Pendiente sin sincronizar:",
        error
      );


      break;

    }

  }


  await actualizarPendientes();


  const codigo =
    document.getElementById(
      "codigo"
    )
    .value
    .trim();


  if (
    codigo
  ) {

    mostrarRegistrosTrabajador(
      codigo
    );

  }

}


// ==================================================
// CUANDO VUELVE INTERNET
// ==================================================

window.addEventListener(
  "online",
  async function() {

    document.getElementById(
      "estado"
    ).textContent =
      "Internet disponible. Sincronizando...";


    try {

      await cargarTrabajadores();


      await sincronizar();


      document.getElementById(
        "estado"
      ).textContent =
        "✓ Sincronización completada";

    } catch(error) {

      console.error(
        error
      );

    }

  }
);


// ==================================================
// SIN INTERNET
// ==================================================

window.addEventListener(
  "offline",
  function() {

    document.getElementById(
      "estado"
    ).textContent =
      "Sin Internet. Guardando en la tablet.";

  }
);


// ==================================================
// INICIAR
// ==================================================

async function iniciarAplicacion() {

  await cargarTrabajadores();


  await actualizarPendientes();


  if (
    navigator.onLine
  ) {

    try {

      await sincronizar();

    } catch(error) {

      console.log(
        error
      );

    }

  }

}


iniciarAplicacion();


// ==================================================
// SERVICE WORKER
// ==================================================

if (
  "serviceWorker"
  in navigator
) {

  window.addEventListener(
    "load",
    function() {

      navigator.serviceWorker
        .register(
          "sw.js"
        )
        .then(
          function() {

            console.log(
              "Service Worker registrado"
            );

          }
        )
        .catch(
          function(error) {

            console.log(
              "Error Service Worker:",
              error
            );

          }
        );

    }
  );

}
