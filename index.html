<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Control de Pesajes</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f2f2f2;
    }

    .contenedor {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    .tarjeta {
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 15px;
      margin-top: 8px;
      font-size: 18px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      cursor: pointer;
      font-weight: bold;
      margin-top: 20px;
    }

    #trabajador {
      margin-top: 10px;
      padding: 15px;
      background: #eeeeee;
      border-radius: 8px;
      font-size: 18px;
    }

    #estado {
      text-align: center;
      margin-top: 20px;
      font-weight: bold;
    }

  </style>

</head>


<body>

  <div class="contenedor">

    <h1>CONTROL DE PESAJES</h1>


    <div class="tarjeta">


      <!-- CÓDIGO -->

      <label>
        Código del trabajador
      </label>

      <input
        id="codigo"
        type="text"
        placeholder="Ej: 1"
        autocomplete="off"
      >


      <!-- TRABAJADOR -->

      <div id="trabajador">

        Trabajador no seleccionado

      </div>


      <!-- PESO -->

      <label>
        Peso (kg)
      </label>

      <input
        id="peso"
        type="number"
        step="0.1"
        placeholder="Ej: 84.5"
      >


      <!-- JORNADA -->

      <label>
        Jornada
      </label>

      <input
        id="jornada"
        type="text"
        placeholder="Ej: Día completo o Medio día"
      >


      <!-- BOTÓN -->

      <button
        type="button"
        onclick="guardarRegistro()"
      >

        GUARDAR REGISTRO

      </button>


      <!-- ESTADO -->

      <div id="estado"></div>


    </div>

  </div>



  <script>


    // ==================================================
    // URL DEL NUEVO APPS SCRIPT
    // ==================================================

    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbxCDWwilSh4v7eukRicKgGR0eEFbGlbYmxqlRVwTtOYsTvO26rHYp-T1iQTjUdh0kLg_w/exec";


    // ==================================================
    // LISTA DE TRABAJADORES
    // ==================================================

    let trabajadores = [];


    // ==================================================
    // JSONP
    // ==================================================

    function jsonp(url) {

      return new Promise(
        function(resolve, reject) {


          const callbackName =
            "callback_" +
            Date.now() +
            "_" +
            Math.random()
              .toString(36)
              .substring(2);


          const script =
            document.createElement(
              "script"
            );


          let terminado =
            false;


          const tiempo =
            setTimeout(
              function() {

                if (terminado) {
                  return;
                }

                terminado =
                  true;

                limpiar();

                reject(
                  new Error(
                    "Tiempo de espera agotado"
                  )
                );

              },
              15000
            );


          function limpiar() {

            clearTimeout(
              tiempo
            );


            if (
              script.parentNode
            ) {

              script.parentNode.removeChild(
                script
              );

            }


            try {

              delete window[
                callbackName
              ];

            } catch(error) {

              window[
                callbackName
              ] =
                undefined;

            }

          }


          window[
            callbackName
          ] =
          function(datos) {

            if (terminado) {
              return;
            }

            terminado =
              true;

            limpiar();

            resolve(
              datos
            );

          };


          script.onerror =
          function() {

            if (terminado) {
              return;
            }

            terminado =
              true;

            limpiar();

            reject(
              new Error(
                "No se pudo conectar"
              )
            );

          };


          const separador =
            url.includes("?")
              ? "&"
              : "?";


          script.src =
            url +
            separador +
            "callback=" +
            encodeURIComponent(
              callbackName
            );


          document.body.appendChild(
            script
          );

        }
      );

    }


    // ==================================================
    // CARGAR TRABAJADORES
    // ==================================================

    async function cargarTrabajadores() {

      const estado =
        document.getElementById(
          "estado"
        );


      estado.textContent =
        "Cargando trabajadores...";


      try {

        const lista =
          await jsonp(
            URL_APPS_SCRIPT +
            "?action=trabajadores"
          );


        if (
          !Array.isArray(
            lista
          )
        ) {

          throw new Error(
            "No se recibieron los trabajadores"
          );

        }


        trabajadores =
          lista;


        estado.textContent =
          "✓ Trabajadores cargados";


      } catch(error) {

        console.error(
          error
        );


        estado.textContent =
          "Error al cargar trabajadores";

      }

    }


    // ==================================================
    // BUSCAR TRABAJADOR
    // ==================================================

    document
      .getElementById(
        "codigo"
      )
      .addEventListener(
        "input",
        function() {

          buscarTrabajador(
            this.value
          );

        }
      );


    function buscarTrabajador(codigo) {

      codigo =
        String(
          codigo
        )
        .trim();


      const pantalla =
        document.getElementById(
          "trabajador"
        );


      if (!codigo) {

        pantalla.textContent =
          "Trabajador no seleccionado";

        return;

      }


      const trabajador =
        trabajadores.find(
          function(t) {

            return String(
              t.codigo
            )
            .trim()
            .toLowerCase()
            ===
            codigo.toLowerCase();

          }
        );


      if (trabajador) {

        pantalla.textContent =
          trabajador.nombre +
          " (" +
          trabajador.codigo +
          ")";


      } else {

        pantalla.textContent =
          "Trabajador no encontrado";

      }

    }


    // ==================================================
    // GUARDAR REGISTRO
    // ==================================================

    async function guardarRegistro() {

      const codigo =
        document
          .getElementById(
            "codigo"
          )
          .value
          .trim();


      const peso =
        document
          .getElementById(
            "peso"
          )
          .value;


      const jornada =
        document
          .getElementById(
            "jornada"
          )
          .value
          .trim();


      const estado =
        document.getElementById(
          "estado"
        );


      // VALIDAR CÓDIGO

      if (!codigo) {

        estado.textContent =
          "Ingrese el código del trabajador";

        return;

      }


      // VALIDAR PESO O JORNADA

      if (
        peso === "" &&
        jornada === ""
      ) {

        estado.textContent =
          "Ingrese un peso o una jornada";

        return;

      }


      // BUSCAR TRABAJADOR

      const trabajador =
        trabajadores.find(
          function(t) {

            return String(
              t.codigo
            )
            .trim()
            .toLowerCase()
            ===
            codigo.toLowerCase();

          }
        );


      if (!trabajador) {

        estado.textContent =
          "Trabajador no encontrado";

        return;

      }


      // CREAR ID

      const id =
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .substring(
            2,
            8
          );


      // CREAR FECHA

      const fechaHora =
        new Date()
          .toISOString();


      // MOSTRAR ESTADO

      estado.textContent =
        "Guardando...";


      try {


        const url =
          URL_APPS_SCRIPT +

          "?action=guardar" +

          "&id=" +
          encodeURIComponent(
            id
          ) +

          "&fechaHora=" +
          encodeURIComponent(
            fechaHora
          ) +

          "&codigo=" +
          encodeURIComponent(
            trabajador.codigo
          ) +

          "&peso=" +
          encodeURIComponent(
            peso
          ) +

          "&jornada=" +
          encodeURIComponent(
            jornada
          );


        const resultado =
          await jsonp(
            url
          );


        if (
          !resultado ||
          resultado.ok !== true
        ) {

          throw new Error(
            resultado &&
            resultado.error
              ?
              resultado.error
              :
              "Error al guardar"
          );

        }


        estado.textContent =
          "✓ Registro guardado correctamente";


        // LIMPIAR CAMPOS

        document.getElementById(
          "peso"
        ).value =
          "";


        document.getElementById(
          "jornada"
        ).value =
          "";


      } catch(error) {

        console.error(
          error
        );


        estado.textContent =
          "❌ Error al guardar";

      }

    }


    // ==================================================
    // INICIAR
    // ==================================================

    cargarTrabajadores();


  </script>

</body>

</html>
